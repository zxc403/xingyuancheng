    <style>

<body>

<script type="module">
    // ============================================================
    // 星渊城 v9.0 · P13 季节系统
    // 管线：ECS、PBR纹理、HDR、SkyDome、IBL、Bloom+SSAO+Film+ACES
    // P1-P5: 地形、路网、地块、建筑、家具/雾
    // P10: 行人系统（InstancedMesh, Idle/Walk 状态机, 沿 sidewalk 行走）
    // ============================================================

    import * as THREE from 'three';
    window.THREE = THREE;
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
    import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
    import { FilmShader } from './src/core/FilmShader.js?v=5';
    import { World } from './src/ecs/index.js?v=5';
    const world = new World();
    import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';
    import { SSAOPass } from 'three/addons/postprocessing/SSAOPass.js';
    import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
    import { Renderer as RendererModule } from './src/core/Renderer.js?v=5';
    import { RendererBackend, Backend as BackendEnum } from './src/core/RendererBackend.js?v=5';
    import { Input as InputModule } from './src/core/Input.js?v=5';
    import { Player as PlayerModule } from './src/entities/Player.js?v=5';

    // ECS + Core 模块初始化
    window.__game = window.__game || {};
    window.__game.renderer = new RendererModule();
    window.__game.backend = new RendererBackend();
    window.__game.input = new InputModule();
    window.__game.player = new PlayerModule();

    window.__game.backend.detectCapabilities().then(cap => {
        console.log('[v7.0] 渲染后端能力', cap);
    });

    // GLTFLoader 动态 import
    let GLTFLoader = null;
    fetch('./vendor/three/addons/loaders/GLTFLoader.js?v=5', {method:'HEAD'}).then(r => {
        if(r.ok) return import('./vendor/three/addons/loaders/GLTFLoader.js?v=5');
    }).then(m => { if(m) { GLTFLoader = m.GLTFLoader; window.GLTFLoader = GLTFLoader; } }).catch(()=>{});

    let DRACOLoader = null, KTX2Loader = null;
    fetch('./vendor/three/addons/loaders/DRACOLoader.js?v=5', {method:'HEAD'}).then(r => {
        if(r.ok) return import('./vendor/three/addons/loaders/DRACOLoader.js?v=5');
    }).then(m => { if(m) { DRACOLoader = m.DRACOLoader; window.DRACOLoader = DRACOLoader; } }).catch(()=>{});
    fetch('./vendor/three/addons/loaders/KTX2Loader.js?v=5', {method:'HEAD'}).then(r => {
        if(r.ok) return import('./vendor/three/addons/loaders/KTX2Loader.js?v=5');
    }).then(m => { if(m) { KTX2Loader = m.KTX2Loader; window.KTX2Loader = KTX2Loader; } }).catch(()=>{});

    // ---- 工具 ----
    const U = {
        lerp: (a,b,t)=>a+(b-a)*t,
        clamp: (v,mn,mx)=>Math.max(mn,Math.min(mx,v)),
        dist2D: (x1,z1,x2,z2)=>{const dx=x1-x2,dz=z1-z2;return Math.sqrt(dx*dx+dz*dz);}
    };
    const isMobile = window._isMobile || false;

    // ---- 场景变量 ----
    let scene, camera, renderer, clock;
    let ambient, sun, hemi;
    let composer, outputPass, ssaoPass;

    // ---- 玩家 ----
    const player = {
        pos: new THREE.Vector3(0, 1.7, 30),
        vel: new THREE.Vector3(),
        yaw: 0, pitch: -0.05,
        onGround: false,
        radius: 0.4, height: 1.7,
        moveSpeed: 0
    };

    // ---- 输入 ----
    const keys = window.keys || {};
    let isPointerLocked = false, gamePaused = false, gameStarted = false;
    let qualityPreset = (isMobile ? 1 : 2);
    let shadowQuality = isMobile ? 512 : 2048;

    const QUALITY_PRESETS = {
        0: { name: '流畅', pixelRatioCap: 1.0, shadow: 512,  bloomStrength: 0.35, ssao: false,  ssaoRadius: 0.0, post: false },
        1: { name: '均衡', pixelRatioCap: 1.5, shadow: 512, bloomStrength: 0.6, ssao: true,  ssaoRadius: 0.4, post: true },
        2: { name: '高质', pixelRatioCap: 2.0,  shadow: 2048, bloomStrength: 0.85, ssao: true, ssaoRadius: 0.7, post: true },
        3: { name: '极致', pixelRatioCap: 2.0,  shadow: 2048, bloomStrength: 1.1, ssao: true, ssaoRadius: 0.9, post: true }
    };

    function applyQualityPreset(p) {
        const cfg = QUALITY_PRESETS[p] || QUALITY_PRESETS[2];
        shadowQuality = cfg.shadow;
        if (window.sun && window.sun.shadow) {
            window.sun.shadow.mapSize.set(cfg.shadow, cfg.shadow);
            if (window.sun.shadow.map) { window.sun.shadow.map.dispose(); window.sun.shadow.map = null; }
        }
        if (window.renderer) {
            window.renderer.setPixelRatio(Math.min(window.devicePixelRatio, cfg.pixelRatioCap));
        }
        try { rebuildPostPipeline(cfg); } catch (e) { console.warn('[quality] rebuild post failed', e); }
    }

    // ===== P6+P8: 日夜循环 + 夜景发光 =====
    const DAYNIGHT = {
        cycleDuration: 150,              // 完整日夜循环秒数（2.5分钟）
        elapsed: 0,
        dayness: 0.85,                   // 起始值（白天）
        prevDayness: 0.85,              // 上一帧值（用于阈值检测）
        targetSpeed: 1.0,               // 时间倍速（1=正常）
    };
    window._bldMeshes = [];              // 建筑网格引用 {mesh, nightEmissive}
    window._lampLights = [];             // 路灯 PointLight 引用
    window._glassStripes = [];           // CBD 玻璃幕墙引用 {mesh, baseEmissiveIntensity}
    window._interiorWindows = [];        // P17: 内饰映射窗户材质引用

    function updateLightIntensity(light, baseVal, dayScale, nightScale, t) {
        light.intensity = baseVal * (nightScale + (dayScale - nightScale) * t);
    }
    function updateLightColor(light, dayColor, nightColor, t) {
        const dc = new THREE.Color(dayColor), nc = new THREE.Color(nightColor);
        light.color.copy(dc).lerp(nc, 1 - t);
    }

    function updateDayNight(dt) {
        DAYNIGHT.elapsed += dt * DAYNIGHT.targetSpeed;
        DAYNIGHT.prevDayness = DAYNIGHT.dayness;
        const fullCycle = DAYNIGHT.cycleDuration;
        const raw = Math.sin((DAYNIGHT.elapsed / fullCycle) * Math.PI * 2 + Math.PI * 0.75);
        DAYNIGHT.dayness = (raw + 1) / 2;
        const d = DAYNIGHT.dayness;

        // ==== 天气系数 ====
        const w = WEATHER.lerped;
        const skyBright = 1 - w.skyDarken * 0.7;
        const lightAtten = 1 - w.skyDarken * 0.5;

        const sunPhase = (DAYNIGHT.elapsed / fullCycle) * Math.PI * 2;
        const sunElevation = Math.sin(sunPhase - Math.PI * 0.15) * 0.75 + 0.25;
        const sunAzimuthX = Math.cos(sunPhase + Math.PI * 0.2);
        const sunAzimuthZ = Math.sin(sunPhase + Math.PI * 0.2);
        const sunDir = new THREE.Vector3(sunAzimuthX, sunElevation, sunAzimuthZ).normalize();

        // 更新 SkyDome uniforms
        const sd = window._skyDome;
        if (sd) {
            sd.material.uniforms.uDayness.value = d;
            sd.material.uniforms.uSunDirection.value.copy(sunDir);
            sd.material.uniforms.uCloudCover.value = w.cloudCover;
            const sunsetWarm = 1 - Math.max(0, (d - 0.15) / 0.2);
            sd.material.uniforms.uSunColor.value.copy(
                new THREE.Color(1.0, 0.95 - sunsetWarm * 0.3, 0.8 - sunsetWarm * 0.5)
            );
            // 阴天天空偏灰 + 季节饱和度
            const overcastGray = 1 - w.skyDarken;
            const seasSat = SEASON.lerped.skySaturation;
            sd.material.uniforms.uZenithColor.value.copy(
                new THREE.Color().lerpColors(
                    new THREE.Color(0.08, 0.08, 0.18),
                    new THREE.Color(0.2*skyBright, 0.5*skyBright, 0.9*skyBright),
                    d
                )
            );
            // 季节：spring/green, summer/full, autumn/orange, winter/desaturated
            const zenithBase = sd.material.uniforms.uZenithColor.value;
            const seasZenith = zenithBase.clone();
            seasZenith.r += (SEASON.lerped.groundTint>>16 & 0xff)/255 * 0.04;
            seasZenith.g += (SEASON.lerped.groundTint>>8 & 0xff)/255 * 0.04;
            seasZenith.b += (SEASON.lerped.groundTint & 0xff)/255 * 0.04;
            seasZenith.lerp(zenithBase, 0.88);
            seasZenith.multiplyScalar(seasSat);
            sd.material.uniforms.uZenithColor.value.copy(seasZenith);
        
            sd.material.uniforms.uHorizonColor.value.copy(
                new THREE.Color().lerpColors(
                    new THREE.Color(0.3*overcastGray, 0.15*overcastGray, 0.05*overcastGray),
                    new THREE.Color(0.8*skyBright, 0.85*skyBright, 0.9*skyBright),
                    d
                )
            );
            // 季节地平线
            const horizBase = sd.material.uniforms.uHorizonColor.value.clone();
            horizBase.r *= (0.9 + seasSat * 0.2);
            horizBase.g *= (0.85 + seasSat * 0.3);
            horizBase.b *= (0.9 + seasSat * 0.2);
            sd.material.uniforms.uHorizonColor.value.copy(horizBase);
            sd.material.uniforms.uGroundColor.value.copy(
                new THREE.Color().lerpColors(
                    new THREE.Color(0.01, 0.005, 0.01),
                    new THREE.Color(0.02, 0.01, 0.02),
                    d
                )
            );
        }

        // 太阳 DirectionalLight：天气削弱
        if (window._sun) {
            const sun = window._sun;
            sun.position.set(sunDir.x * 120, sunDir.y * 120, sunDir.z * 120);
            updateLightIntensity(sun, 3.0, 3.0*lightAtten, 0.12, d);
            updateLightColor(sun, 0xfff0d0, 0x445577, d);
        }

        if (ambient) {
            updateLightIntensity(ambient, 0.45, 0.45*lightAtten, 0.06, d);
            updateLightColor(ambient, 0x8a7a6a, 0x223344, d);
        }
        if (hemi) {
            updateLightIntensity(hemi, 0.6, 0.6*lightAtten, 0.06, d);
            updateLightColor(hemi, 0x9ec5e8, 0x112233, d);
        }
        const fill = scene.children.find(c => c.isDirectionalLight && c !== sun && c !== hemi && c.intensity < 1);
        if (fill) updateLightIntensity(fill, 0.55, 0.55*lightAtten, 0.04, d);

        // 雾色 + 天气雾增强 + 季节
        const fogDay = new THREE.Color(0x7a9ab8), fogNight = new THREE.Color(0x0a0e14);
        const fogColor = fogDay.clone().lerp(fogNight, 1 - d);
        // 雨天雾向灰白偏移
        const rainFog = new THREE.Color(0x8899aa);
        const fogFinal = fogColor.clone().lerp(rainFog, w.fogBoost * 0.4);
        // 季节雾色混入
        const seasFog = new THREE.Color(SEASON.lerped.fogHue);
        fogFinal.lerp(seasFog, 0.25);
        if (scene.fog) scene.fog.color.copy(fogFinal);
        if (scene.fog instanceof THREE.FogExp2) scene.fog.density = 0.0055 - d * 0.0015 + w.fogBoost * 0.006;
        if (scene.fog instanceof THREE.Fog) scene.fog.far = 450 - w.fogBoost * 180;

        if (window._fogPlane) {
            const fp = window._fogPlane;
            fp.material.uniforms.uColor.value.copy(fogFinal).multiplyScalar(0.6);
            fp.material.uniforms.uFogColor.value.copy(fogFinal);
            fp.material.uniforms.uTime && (fp.material.uniforms.uTime.value += dt * (1 + w.rainIntensity * 2));
        }

        // Tone mapping
        if (renderer) renderer.toneMappingExposure = 0.65 + d * 0.55 - w.skyDarken * 0.2;

        // ==== 湿地面 ====
        if (window._terrain && window._terrain.material) {
            const tm = window._terrain.material;
            if (tm.userData._baseRoughness === undefined) tm.userData._baseRoughness = tm.roughness;
            if (tm.userData._baseEnvIntensity === undefined) tm.userData._baseEnvIntensity = tm.envMapIntensity || 0;
            const wet = w.wetness;
            tm.roughness = tm.userData._baseRoughness * (1 - wet * 0.75);
            tm.envMapIntensity = (tm.userData._baseEnvIntensity || 0) + wet * 1.5;
            // 湿地面颜色偏暗蓝灰
            const baseColor = tm.userData._baseColor || (tm.color ? tm.color.getHex() : 0x555555);
            if (!tm.userData._baseColor && tm.color) tm.userData._baseColor = baseColor;
            const bc = new THREE.Color(baseColor);
            const wetColor = new THREE.Color(0x3a4048);
            if (tm.color) tm.color.copy(bc).lerp(wetColor, wet * 0.5);
        }

        // ==== 季节地面色调 ====
        if (window._terrain && window._terrain.material && window._terrain.material.color) {
            const tc = window._terrain.material.color;
            if (tc.userData._origTerrainColor === undefined) tc.userData._origTerrainColor = tc.getHex();
            const orig = new THREE.Color(tc.userData._origTerrainColor);
            const seasTint = new THREE.Color(SEASON.lerped.groundTint);
            tc.copy(orig).lerp(seasTint, 0.35);
        }

        // ==== 夜景发光：阈值触发（避免每帧遍历所有材质） ====
        const nightThreshold = 0.35;
        const crossedIntoNight = (DAYNIGHT.prevDayness > nightThreshold && d <= nightThreshold);
        const crossedOutOfNight = (DAYNIGHT.prevDayness <= nightThreshold && d > nightThreshold);

        if (crossedIntoNight || crossedOutOfNight) {
            const nightFactor = d < nightThreshold ? (1 - d / nightThreshold) : 0;

            // 建筑窗户 emissive
            for (const bm of window._bldMeshes) {
                if (bm.nightEmissive) {
                    bm.mesh.material.emissive.copy(bm.nightEmissive);
                    bm.mesh.material.emissiveIntensity = nightFactor * 0.7;
                    bm.mesh.material.needsUpdate = true;
                }
            }

            // CBD 玻璃幕墙 emissive 增强
            for (const gs of window._glassStripes) {
                gs.mesh.material.emissiveIntensity = gs.baseEmissiveIntensity + nightFactor * 0.8;
            }

            // P17: 内饰映射窗户夜间发光
            for (const im of window._interiorWindows) {
                im.uniforms.uNightFactor.value = nightFactor;
            }

            // 路灯
            for (const lamp of window._lampLights) {
                lamp.intensity = 1.0 + nightFactor * 7.0;
            }
        }

        // 路灯渐变（在阈值区间内平滑）
        if (d < nightThreshold + 0.08) {
            const nf = d < nightThreshold ? (1 - d / nightThreshold) : 0;
            for (const lamp of window._lampLights) {
                lamp.intensity = 1.0 + nf * 7.0;
            }
        }

        // P17: 内饰窗户持续渐变 (每帧更新 nightFactor)
        const smoothNightFactor = d < nightThreshold ? (1 - d / nightThreshold) * (d < nightThreshold * 0.5 ? 1.0 : (nightThreshold - d) / (nightThreshold * 0.5)) : 0;
        for (const im of window._interiorWindows) {
            im.uniforms.uNightFactor.value = smoothNightFactor;
        }
    }

    // ===== P11B: 天气系统 =====
    const WEATHER = {
        states: ['Clear','Overcast','Drizzle','Rain','HeavyRain','Thunderstorm'],
        current: 'Clear',
        target: 'Clear',
        progress: 1.0,
        transitionSpeed: 0.25,
        profiles: {
            Clear:       { cloudCover:0.20,rainIntensity:0,  fogBoost:0,   skyDarken:0,   wetness:0,   lightningFreq:0 },
            Overcast:    { cloudCover:0.85,rainIntensity:0,  fogBoost:0.10,skyDarken:0.25,wetness:0,   lightningFreq:0 },
            Drizzle:     { cloudCover:0.90,rainIntensity:0.25,fogBoost:0.25,skyDarken:0.35,wetness:0.35,lightningFreq:0 },
            Rain:        { cloudCover:0.95,rainIntensity:0.60,fogBoost:0.50,skyDarken:0.55,wetness:0.70,lightningFreq:0 },
            HeavyRain:   { cloudCover:1.00,rainIntensity:1.00,fogBoost:0.80,skyDarken:0.75,wetness:1.00,lightningFreq:0.05 },
            Thunderstorm:{ cloudCover:1.00,rainIntensity:0.85,fogBoost:0.95,skyDarken:0.85,wetness:1.00,lightningFreq:1.00 }
        },
        lerped: { cloudCover:0.20,rainIntensity:0,fogBoost:0,skyDarken:0,wetness:0,lightningFreq:0 },
        wind: { dir: new THREE.Vector3(1,0,0.3).normalize(), baseSpeed:5, gust:0, time:0 },
        timeSinceBolt: 0,
        nextBoltIn: 10,
        cycleTimer: 0,
        cycleIdx: 0,
        cycleOrder: ['Clear','Overcast','Drizzle','Rain','HeavyRain','Thunderstorm','HeavyRain','Rain','Drizzle','Overcast']
    };

    // ===== P13: 季节系统 =====
    const SEASON = {
        names: ['Spring','Summer','Autumn','Winter'],
        name: 'Spring',
        seasonality: 0.0,      // 0=mid-spring, 0.25=mid-summer, 0.5=mid-autumn, 0.75=mid-winter
        cycleDays: 300.0,      // 完整一年 = 300 秒（~5分钟）
        transitionSpeed: 0.8,  // 颜色/效果 lerp 速度
        lerpedSeasonality: 0.0,
        profiles: {
            Spring: { groundTint:0x5a6e3a, skySaturation:0.85, fogHue:0x8a9e7a, leafColor:0x7eb546, tempBias:0.0, snowAmount:0, leafAmount:0.1 },
            Summer: { groundTint:0x4a6e2a, skySaturation:1.00, fogHue:0x9ab888, leafColor:0x3d6b20, tempBias:+0.15, snowAmount:0, leafAmount:0 },
            Autumn: { groundTint:0x6e5a2a, skySaturation:0.65, fogHue:0xb89a6a, leafColor:0xd4902a, tempBias:-0.05, snowAmount:0, leafAmount:0.4 },
            Winter:  { groundTint:0x7a8a9a, skySaturation:0.40, fogHue:0x8899aa, leafColor:0x6a6a6a, tempBias:-0.30, snowAmount:0.6, leafAmount:0 }
        },
        lerped: { groundTint:0x5a6e3a, skySaturation:0.85, fogHue:0x8a9e7a, leafColor:0x7eb546, tempBias:0.0, snowAmount:0, leafAmount:0.1 }
    };

    function updateSeasons(dt) {
        // seasonality 正弦波形
        SEASON.seasonality = (DAYNIGHT.elapsed % SEASON.cycleDays) / SEASON.cycleDays;
        SEASON.lerpedSeasonality += (SEASON.seasonality - SEASON.lerpedSeasonality) * Math.min(1, dt * SEASON.transitionSpeed);

        // 确定当前季名
        const s = SEASON.seasonality;
        let idx = Math.floor(s * 4) % 4;
        SEASON.name = SEASON.names[idx];

        // lerp 季节效果
        const keys = ['groundTint','skySaturation','fogHue','leafColor','tempBias','snowAmount','leafAmount'];
        // 用正弦插值平滑跨季节过渡
        const phase = s * 4; // 0-4 映射到四季段
        const seg = phase % 1;
        const smooth = seg < 0.5 ? 2*seg*seg : 1 - Math.pow(-2*seg + 2, 2)/2; // ease-in-out

        const from = SEASON.profiles[SEASON.names[Math.floor(phase) % 4]];
        const to = SEASON.profiles[SEASON.names[(Math.floor(phase) + 1) % 4]];
        for (const k of keys) {
            SEASON.lerped[k] = from[k] + (to[k] - from[k]) * smooth;
        }
    }

    function setWeather(state) {
        if (!WEATHER.states.includes(state)) return;
        if (WEATHER.target === state && WEATHER.progress >= 1) return;
        WEATHER.current = WEATHER.target;
        WEATHER.target = state;
        WEATHER.progress = 0;
        if (WEATHER.progress >= 1) {
            for (const k of Object.keys(WEATHER.lerped)) WEATHER.lerped[k] = WEATHER.profiles[WEATHER.current][k];
        }
    }

    function updateWeather(dt) {
        if (WEATHER.progress < 1) {
            WEATHER.progress = Math.min(1, WEATHER.progress + dt * WEATHER.transitionSpeed);
            const from = WEATHER.profiles[WEATHER.current];
            const to = WEATHER.profiles[WEATHER.target];
            for (const k of Object.keys(WEATHER.lerped)) {
                WEATHER.lerped[k] = from[k] + (to[k] - from[k]) * WEATHER.progress;
            }
            if (WEATHER.progress >= 1) WEATHER.current = WEATHER.target;
        }
        // 风
        WEATHER.wind.time += dt;
        WEATHER.wind.gust = (Math.sin(WEATHER.wind.time * 0.7) * 0.5 + 0.5) * WEATHER.wind.baseSpeed * 0.6;
        const spd = WEATHER.wind.baseSpeed + WEATHER.wind.gust;
        WEATHER.wind.force = WEATHER.wind.dir.clone().multiplyScalar(spd);

        // 自动循环（每 30 秒切换，受季节影响概率偏向）
        WEATHER.cycleTimer += dt;
        if (WEATHER.cycleTimer > 30 && WEATHER.progress >= 1) {
            WEATHER.cycleTimer = 0;
            
            // 季节偏向：tempBias 正→更多雷雨概率，负→更多阴云雪
            const tb = SEASON.lerped.tempBias;
            const roll = Math.random();
            let targetState;
            if (tb > 0.05 && roll < tb * 0.4) {
                targetState = roll < tb * 0.15 ? 'Thunderstorm' : (roll < tb * 0.25 ? 'HeavyRain' : 'Rain');
            } else if (tb < -0.05 && roll < -tb * 0.5) {
                targetState = 'Overcast';
            } else {
                WEATHER.cycleIdx = (WEATHER.cycleIdx + 1) % WEATHER.cycleOrder.length;
                targetState = WEATHER.cycleOrder[WEATHER.cycleIdx];
            }
            setWeather(targetState);
        }

        // 闪电计时
        WEATHER.timeSinceBolt += dt;
        const lf = WEATHER.lerped.lightningFreq;
        if (lf > 0.01 && WEATHER.timeSinceBolt > WEATHER.nextBoltIn && WEATHER.progress >= 0.5) {
            WEATHER.timeSinceBolt = 0;
            WEATHER.nextBoltIn = 3 + Math.random() * (12 / lf);
            triggerLightning();
        }
    }

    // ---- 闪电 ----
    let boltLine = null, boltGlow = null, boltLight = null;
    function generateBolt(start, end, displace, branches) {
        const pts = [start.clone(), end.clone()];
        function recurse(a, b, d, depth) {
            if (depth <= 0) return;
            const mid = a.clone().add(b).multiplyScalar(0.5);
            const perp = new THREE.Vector3(-(b.z-a.z), 0, b.x-a.x).normalize();
            mid.x += perp.x * (Math.random()-0.5) * d * 2;
            mid.z += perp.z * (Math.random()-0.5) * d * 2;
            mid.y += (Math.random()-0.4) * d;
            pts.splice(pts.indexOf(b), 0, mid);
            const nd = d * 0.55;
            recurse(a, mid, nd, depth-1);
            recurse(mid, b, nd, depth-1);
            // 分支
            if (Math.random() < 0.3 && depth > 1 && branches) {
                const branchEnd = mid.clone();
                branchEnd.x += (Math.random()-0.5) * d * 3;
                branchEnd.z += (Math.random()-0.5) * d * 3;
                branchEnd.y -= Math.random() * d * 0.8;
                pts.push(branchEnd);
                recurse(mid, branchEnd, nd*0.7, depth-2);
            }
        }
        recurse(start, end, displace, 5);
        return pts;
    }

    function triggerLightning() {
        if (!scene) return;
        // 清理旧闪电
        if (boltLine) { scene.remove(boltLine); boltLine.geometry.dispose(); boltLine.material.dispose(); boltLine=null; }
        if (boltGlow) { scene.remove(boltGlow); boltGlow.geometry.dispose(); boltGlow.material.dispose(); boltGlow=null; }

        const cpos = camera ? camera.position : new THREE.Vector3(0,30,0);
        const angle = Math.random()*Math.PI*2;
        const dist = 40 + Math.random()*80;
        const sx = cpos.x + Math.cos(angle)*dist;
        const sz = cpos.z + Math.sin(angle)*dist;
        const sy = 50 + Math.random()*30;
        const ey = getTerrainH(sx, sz) + 0.5;
        const start = new THREE.Vector3(sx, sy, sz);
        const end = new THREE.Vector3(sx, ey, sz);
        const pts = generateBolt(start, end, 25, true);

        const geo = new THREE.BufferGeometry().setFromPoints(pts);
        boltLine = new THREE.Line(geo, new THREE.LineBasicMaterial({color:0xccddff, transparent:true, opacity:0.9, depthWrite:false}));
        scene.add(boltLine);

        const glowGeo = new THREE.BufferGeometry().setFromPoints(pts);
        boltGlow = new THREE.Line(glowGeo, new THREE.LineBasicMaterial({color:0xaaccff, transparent:true, opacity:0.3, linewidth:1, depthWrite:false}));
        boltGlow.scale.set(1.3, 1.3, 1.3);
        scene.add(boltGlow);

        // 闪光点光源
        if (!boltLight) {
            boltLight = new THREE.PointLight(0xddeeff, 0, 200);
            scene.add(boltLight);
            window._boltLight = boltLight;
        }
        const midPt = pts[Math.floor(pts.length/2)];
        boltLight.position.copy(midPt);
        boltLight.intensity = 80;

        // SkyDome 闪白
        if (window._skyDome) {
            const origSun = window._skyDome.material.uniforms.uSunColor.value.getHex();
            window._skyDome.material.uniforms.uSunColor.value.set(0xffffff);
            setTimeout(() => {
                if (window._skyDome) window._skyDome.material.uniforms.uSunColor.value.setHex(origSun);
            }, 80);
        }

        // 闪电衰减
        const decayStart = performance.now();
        function decayBolt() {
            const elapsed = (performance.now() - decayStart) / 1000;
            const fade = Math.max(0, 1 - elapsed * 3);
            if (boltLine) boltLine.material.opacity = fade * 0.9;
            if (boltGlow) boltGlow.material.opacity = fade * 0.3;
            if (boltLight) boltLight.intensity = 80 * fade;
            if (elapsed < 0.35) { requestAnimationFrame(decayBolt); }
            else {
                if (boltLine) { scene.remove(boltLine); boltLine.geometry.dispose(); boltLine.material.dispose(); boltLine=null; }
                if (boltGlow) { scene.remove(boltGlow); boltGlow.geometry.dispose(); boltGlow.material.dispose(); boltGlow=null; }
                if (boltLight) boltLight.intensity = 0;
            }
        }
        requestAnimationFrame(decayBolt);
    }

    // ---- 雨系统 ----
    let rainMesh = null;
    function createRainSystem() {
        if (rainMesh) return;
        const count = isMobile ? 15000 : 40000;
        const spawnW = 55, spawnH = 32;
        const positions = new Float32Array(count * 6);
        const seeds = new Float32Array(count * 2);
        for (let i = 0; i < count; i++) {
            const x = rng.range(-spawnW, spawnW);
            const y = rng.float() * spawnH;
            const z = rng.range(-spawnW, spawnW);
            positions[i*6]=x; positions[i*6+1]=y; positions[i*6+2]=z;
            positions[i*6+3]=x; positions[i*6+4]=y-0.35; positions[i*6+5]=z;
            seeds[i*2]=rng.float(); seeds[i*2+1]=rng.float() * Math.PI * 2;
        }
        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geo.setAttribute('aSeed', new THREE.BufferAttribute(seeds, 2));
        const mat = new THREE.ShaderMaterial({
            uniforms: {
                uTime: {value:0}, uIntensity: {value:0}, uWind: {value:new THREE.Vector3()},
                uGravity: {value:-16}, uSpawnH: {value:spawnH}, uSpawnW: {value:spawnW},
                uCameraPos: {value:new THREE.Vector3()}
            },
            vertexShader: `
                attribute vec2 aSeed;
                uniform float uTime, uIntensity, uGravity, uSpawnH, uSpawnW;
                uniform vec3 uWind, uCameraPos;
                varying float vAlpha;
                void main() {
                    float seed = aSeed.x, phase = aSeed.y;
                    float speed = (0.5+seed*0.5)*abs(uGravity)*uIntensity;
                    float t = mod(uTime*speed+phase*5.0, 1.0);
                    float y0 = uSpawnH;
                    float y = y0 - t*uSpawnH - uGravity*t*t*0.1;
                    float xOffset = uWind.x*t*0.8 + uWind.z*t*0.3*seed;
                    float zOffset = uWind.z*t*0.8 - uWind.x*t*0.3*seed;
                    vec3 pos = position + vec3(xOffset, y-position.y, zOffset);
                    pos.xz += uCameraPos.xz;
                    vAlpha = smoothstep(0.0,0.08,t)*smoothstep(1.0,0.85,t)*uIntensity;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(pos,1.0);
                }
            `,
            fragmentShader: `
                varying float vAlpha;
                void main() {
                    gl_FragColor = vec4(0.75,0.82,0.95,vAlpha*0.45);
                }
            `,
            transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
        });
        rainMesh = new THREE.LineSegments(geo, mat);
        rainMesh.frustumCulled = false;
        rainMesh.renderOrder = 1;
        scene.add(rainMesh);
        window._rainMesh = rainMesh;
    }

    function updateRainSystem(dt) {
        if (!rainMesh) return;
        const m = rainMesh.material;
        m.uniforms.uTime.value += dt;
        m.uniforms.uIntensity.value = WEATHER.lerped.rainIntensity;
        m.uniforms.uWind.value.copy(WEATHER.wind.force || WEATHER.wind.dir);
        if (camera) m.uniforms.uCameraPos.value.copy(camera.position);
        rainMesh.visible = WEATHER.lerped.rainIntensity > 0.05;
    }

    // ---- P13: 秋叶系统 (InstancedMesh) ----
    let leafMesh = null;
    let leafData = []; // {baseX, baseY, baseZ, phase, speed, wobble}
    const LEAF_COUNT = 300;
    
    function createLeafSystem() {
        if (leafMesh) return;
        
        // 小方形 plane geometry（带秋叶色）
        const leafGeo = new THREE.PlaneGeometry(0.3, 0.2);
        leafGeo.translate(0.15, 0.1, 0);
        const leafMat = new THREE.MeshBasicMaterial({
            color: new THREE.Color(SEASON.lerped.leafColor),
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0.75,
            depthWrite: false
        });
        leafMesh = new THREE.InstancedMesh(leafGeo, leafMat, LEAF_COUNT);
        leafMesh.renderOrder = 2;
        leafMesh.visible = false;
        scene.add(leafMesh);
        window._leafMesh = leafMesh;
        
        // 初始化每个叶子的轨道参数
        const spawnW = 40, spawnH = 22;
        leafData = [];
        for (let i = 0; i < LEAF_COUNT; i++) {
            leafData.push({
                baseX: rng.range(-spawnW, spawnW),
                baseY: rng.range(spawnH * 0.2, spawnH),
                baseZ: rng.range(-spawnW, spawnW),
                phase: rng.float() * Math.PI * 2,
                speed: 0.15 + rng.float() * 0.5,
                wobble: 0.3 + rng.float() * 0.8,
                spin: 0.5 + rng.float() * 2.5
            });
        }
    }
    
    function updateLeafSystem(dt) {
        if (!leafMesh) return;
        const amount = SEASON.lerped.leafAmount;
        leafMesh.visible = amount > 0.02;
        if (!leafMesh.visible) return;
        
        const mat = leafMesh.material;
        mat.color.set(SEASON.lerped.leafColor);
        mat.opacity = 0.5 + amount * 0.4;
        
        const dummy = new THREE.Object3D();
        const cx = camera ? camera.position.x : 0;
        const cz = camera ? camera.position.z : 0;
        const spawnW = 40, spawnH = 22;
        
        for (let i = 0; i < LEAF_COUNT; i++) {
            const d = leafData[i];
            d.baseY -= d.speed * dt;
            
            // 绕圈重置
            if (d.baseY < 0) {
                d.baseY = spawnH * 0.5 + rng.float() * spawnH * 0.5;
                d.baseX = cx + rng.range(-spawnW, spawnW);
                d.baseZ = cz + rng.range(-spawnW, spawnW);
            }
            
            // 水平漂移+摆动
            const t = performance.now() * 0.001 + d.phase;
            const wx = Math.sin(t * d.wobble) * 0.3;
            const wz = Math.cos(t * d.wobble * 1.3) * 0.3;
            const wind = WEATHER.wind.force || new THREE.Vector3(0, 0, 0);
            
            const x = d.baseX + wx + wind.x * 0.03;
            const y = d.baseY;
            const z = d.baseZ + wz + wind.z * 0.03;
            
            dummy.position.set(x, y, z);
            // 旋转下落
            dummy.rotation.set(
                t * d.spin * 0.7,
                t * d.spin * 1.2,
                Math.sin(t * d.wobble * 0.5) * 0.6
            );
            dummy.updateMatrix();
            leafMesh.setMatrixAt(i, dummy.matrix);
        }
        leafMesh.instanceMatrix.needsUpdate = true;
    }

    // ---- P13: 冬雪系统 ----
    let snowMesh = null;
    function createSnowSystem() {
        if (snowMesh) return;
        const count = 8000;
        const spawnW = 45, spawnH = 30;
        const positions = new Float32Array(count * 6);
        const seeds = new Float32Array(count * 2);
        
        for (let i = 0; i < count; i++) {
            const x = rng.range(-spawnW, spawnW);
            const y = rng.float() * spawnH;
            const z = rng.range(-spawnW, spawnW);
            positions[i*6]=x; positions[i*6+1]=y; positions[i*6+2]=z;
            positions[i*6+3]=x; positions[i*6+4]=y-0.25; positions[i*6+5]=z;
            seeds[i*2]=rng.float(); seeds[i*2+1]=rng.float() * Math.PI * 2;
        }
        
        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geo.setAttribute('aSeed', new THREE.BufferAttribute(seeds, 2));
        
        const mat = new THREE.ShaderMaterial({
            uniforms: {
                uTime: {value:0}, uAmount: {value:0}, uWind: {value:new THREE.Vector3()},
                uGravity: {value:-3.5}, uSpawnH: {value:spawnH}, uSpawnW: {value:spawnW},
                uCameraPos: {value:new THREE.Vector3()}
            },
            vertexShader: `
                attribute vec2 aSeed;
                uniform float uTime, uAmount, uGravity, uSpawnH, uSpawnW;
                uniform vec3 uWind, uCameraPos;
                varying float vAlpha;
                void main() {
                    float seed = aSeed.x, phase = aSeed.y;
                    float speed = (0.4+seed*0.6)*abs(uGravity)*uAmount;
                    float t = mod(uTime*speed*0.5+phase*3.0, 1.0);
                    float y0 = uSpawnH;
                    float y = y0 - t*uSpawnH - uGravity*t*t*0.005;
                    // 雪花飘摇
                    float swayX = sin(uTime*2.0+phase)*0.8*seed + cos(uTime*1.3+phase*2.0)*0.4;
                    float swayZ = cos(uTime*1.7+phase)*0.8*seed + sin(uTime*2.2+phase*2.0)*0.4;
                    float xOffset = uWind.x*t*0.35 + swayX;
                    float zOffset = uWind.z*t*0.35 + swayZ;
                    vec3 pos = position + vec3(xOffset, y-position.y, zOffset);
                    pos.xz += uCameraPos.xz;
                    vAlpha = smoothstep(0.0,0.06,t)*smoothstep(1.0,0.9,t)*uAmount;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(pos,1.0);
                }
            `,
            fragmentShader: `
                varying float vAlpha;
                void main() {
                    gl_FragColor = vec4(0.95,0.97,1.0,vAlpha*0.55);
                }
            `,
            transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
        });
        
        snowMesh = new THREE.LineSegments(geo, mat);
        snowMesh.frustumCulled = false;
        snowMesh.renderOrder = 1;
        snowMesh.visible = false;
        scene.add(snowMesh);
        window._snowMesh = snowMesh;
    }
    
    function updateSnowSystem(dt) {
        if (!snowMesh) return;
        const amount = SEASON.lerped.snowAmount;
        snowMesh.visible = amount > 0.03;
        if (!snowMesh.visible) return;
        const m = snowMesh.material;
        m.uniforms.uTime.value += dt;
        m.uniforms.uAmount.value = amount;
        m.uniforms.uWind.value.copy(WEATHER.wind.force || WEATHER.wind.dir);
        if (camera) m.uniforms.uCameraPos.value.copy(camera.position);
    }

    // ---- PBR 纹理加载 ----
    async function loadRealTextures() {
        const allSets = ['asphalt', 'forest', 'plank', 'rocky', 'brick', 'concrete', 'metal', 'iron', 'paving'];
        const sets = (window._isMobile) ? ['asphalt', 'plank', 'rocky', 'concrete', 'paving'] : allSets;
        const chMap = {
            diff:  { file: 'color.jpg',     setFn: (t,tex)=>{ t.colorSpace=THREE.SRGBColorSpace; tex.map=t; } },
            nor:   { file: 'normal.jpg',    setFn: (t,tex)=>{ tex.normalMap=t; } },
            rough: { file: 'roughness.jpg', setFn: (t,tex)=>{ tex.roughnessMap=t; } },
            ao:    { file: 'ao.jpg',        setFn: (t,tex)=>{ tex.aoMap=t; } }
        };
        const chs = ['diff', 'nor', 'rough', 'ao'];
        const out = {};
        const _withTimeout = (p, ms) => Promise.race([
            p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))
        ]);
        const tasks = [];
        for (const setName of sets) {
            const tex = { map: null, normalMap: null, roughnessMap: null, aoMap: null };
            out[setName] = tex;
            for (const ch of chs) {
                const chDef = chMap[ch];
                tasks.push((async () => {
                    try {
                        const url = `assets/textures/${setName}/${chDef.file}`;
                        const t = await _withTimeout(new THREE.TextureLoader().loadAsync(url), 30000);
                        chDef.setFn(t, tex);
                        t.wrapS = t.wrapT = THREE.RepeatWrapping;
                        t.anisotropy = 8;
                        t.repeat.set(2, 2);
                    } catch (e) {
                        console.warn(`[RealTexture] fallback ${setName}/${ch}`, e && e.message);
                    }
                })());
            }
        }
        await Promise.allSettled(tasks);
        for (const setName of sets) {
            const tex = out[setName];
            if (!tex.map) tex.map = _mkFallbackTex('#888888', setName);
            if (!tex.normalMap) tex.normalMap = _mkFallbackTex('#8080ff', setName);
            if (!tex.roughnessMap) tex.roughnessMap = _mkFallbackTex('#cccccc', setName);
        }
        return out;
    }

    function _mkFallbackTex(color, seed) {
        try {
            const c = document.createElement('canvas');
            c.width = c.height = 64;
            const ctx = c.getContext('2d');
            ctx.fillStyle = color;
            ctx.fillRect(0, 0, 64, 64);
            const tex = new THREE.CanvasTexture(c);
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
            return tex;
        } catch(_) { return null; }
    }

    // ---- HDR 加载 ----
    async function loadRealHDR() {
        let currentHDRKey = null;
        const hdrKeys = { day_quarry:1, night_city:1, sunset_hill:1 };
        try {
            const loader = new RGBELoader();
            loader.setDataType(THREE.HalfFloatType);
            for (const key of Object.keys(hdrKeys)) {
                try {
                    const tex = await Promise.race([
                        loader.loadAsync(`assets/hdr/${key}.hdr`),
                        new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 15000))
                    ]);
                    hdrKeys[key] = tex;
                } catch(e) { delete hdrKeys[key]; }
            }
        } catch(e) { console.warn('[HDR] loader init failed', e); }
        const tex = hdrKeys['day_quarry'] || hdrKeys['sunset_hill'] || Object.values(hdrKeys)[0];
        if (tex) {
            const pmrem = new THREE.PMREMGenerator(renderer);
            pmrem.compileEquirectangularShader();
            const envRT = pmrem.fromEquirectangular(tex);
            tex.dispose();
            pmrem.dispose();
            return envRT.texture;
        }
        return null;
    }

        console.log('[v7.0] Models loaded:', Object.keys(window._realModels).length);
    }

                uCloudCover: { value: 0.5 }
            },
            vertexShader: `
                varying vec3 vWorldPosition;
                void main() {
                    vec4 worldPos = modelMatrix * vec4(position, 1.0);
                    vWorldPosition = worldPos.xyz;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    gl_Position.z = gl_Position.w;
                }
            `,
            fragmentShader: `
                uniform float uDayness;
                uniform vec3 uSunDirection;
                uniform float uTime;
                uniform vec3 uSunColor;
                uniform vec3 uHorizonColor;
                uniform vec3 uZenithColor;
                uniform vec3 uGroundColor;
                uniform float uCloudCover;
                varying vec3 vWorldPosition;

                float hash(vec3 p) {
                    p = fract(p * 0.3183099 + 0.1);
                    p *= 17.0;
                    return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
                }
                float noise(vec3 p) {
                    vec3 i = floor(p);
                    vec3 f = fract(p);
                    f = f * f * (3.0 - 2.0 * f);
                    return mix(
                        mix(mix(hash(i+vec3(0,0,0)),hash(i+vec3(1,0,0)),f.x),
                            mix(hash(i+vec3(0,1,0)),hash(i+vec3(1,1,0)),f.x),f.y),
                        mix(mix(hash(i+vec3(0,0,1)),hash(i+vec3(1,0,1)),f.x),
                            mix(hash(i+vec3(0,1,1)),hash(i+vec3(1,1,1)),f.x),f.y),f.z);
                }
                float fbm(vec3 p) {
                    float v = 0.0, a = 0.5;
                    for(int i = 0; i < 5; i++) { v += a * noise(p); p *= 2.0; a *= 0.5; }
                    return v;
                }
                void main() {
                    vec3 dir = normalize(vWorldPosition);
                    float y = dir.y;
                    vec3 skyColor = mix(uZenithColor, uHorizonColor, pow(1.0 - max(y, 0.0), 0.6));
                    float horizonBlend = exp(-abs(y) * 8.0);
                    vec3 horizonTint = mix(uHorizonColor, vec3(1.0, 0.7, 0.4), 0.15 * uDayness);
                    skyColor = mix(skyColor, horizonTint, horizonBlend * 0.6);

                    vec3 sunDir = normalize(uSunDirection);
                    float sunAngle = max(dot(dir, sunDir), 0.0);
                    float sunCore = smoothstep(0.9992, 1.0, sunAngle);
                    vec3 sunCoreColor = vec3(1.0, 0.98, 0.9) * sunCore * 8.0;
                    float sunGlow = pow(sunAngle, 8.0) * 0.6;
                    float sunGlow2 = pow(sunAngle, 48.0) * 0.8;
                    vec3 sunGlowColor = uSunColor * (sunGlow * 0.4 + sunGlow2 * 0.6);
                    float sunScatter = pow(sunAngle + 0.1, 2.0) * 0.15;
                    vec3 scatterColor = vec3(1.0, 0.6, 0.3) * sunScatter * uDayness;
                    vec3 sunResult = (sunCoreColor + sunGlowColor + scatterColor) * (0.2 + 0.8 * uDayness);

                    vec3 cloudPos = dir * 30.0 + vec3(uTime * 0.04, 0.0, uTime * 0.02);
                    float cloudNoise = fbm(cloudPos);
                    float cloudDensity = smoothstep(0.35, 0.75, cloudNoise) * uDayness * uCloudCover;
                    float cloudSun = max(dot(dir, sunDir), 0.0);
                    vec3 cloudBright = mix(vec3(0.7, 0.75, 0.8), vec3(1.0, 0.9, 0.7), pow(cloudSun, 4.0));
                    vec3 cloudDark = mix(vec3(0.4, 0.42, 0.45), vec3(0.3, 0.3, 0.35), 1.0 - uDayness);
                    vec3 cloudColor = mix(cloudDark, cloudBright, cloudDensity);

                    float starVis = 1.0 - uDayness;
                    vec3 starPos = dir * 200.0;
                    vec3 starCell = floor(starPos * 30.0);
                    float starHash = hash(starCell);
                    float starPattern = step(0.997, starHash) * starVis;
                    float starTwinkle = sin(uTime * 3.0 + starHash * 100.0 + starCell.x * 0.5) * 0.5 + 0.5;
                    vec3 starColor = mix(vec3(0.8, 0.85, 1.0), vec3(1.0, 0.9, 0.7), starHash) * starPattern * (0.5 + 0.5 * starTwinkle);

                    float moonVis = 1.0 - uDayness;
                    vec3 moonDir = normalize(vec3(-sunDir.x * 0.8, 0.25 + 0.3 * (1.0 - uDayness), -sunDir.z * 0.8));
                    float moonAngle = max(dot(dir, moonDir), 0.0);
                    float moonDisk = smoothstep(0.999, 1.0, moonAngle);
                    float moonGlow = pow(moonAngle, 16.0) * 0.15;
                    vec3 moonColor = vec3(0.85, 0.85, 0.95) * (moonDisk * 1.5 + moonGlow) * moonVis;

                    vec3 finalColor = skyColor + sunResult + cloudColor * cloudDensity + starColor + moonColor;
                    if(y < 0.0) {
                        float groundBlend = exp(y * 12.0);
                        finalColor = mix(uGroundColor, uHorizonColor, groundBlend);

                    finalColor = pow(finalColor, vec3(1.0/2.2));
                    gl_FragColor = vec4(finalColor, 1.0);
                }
            `,
            side: THREE.BackSide,

            outputPass = new OutputPass();

        function rebuildMobileBloom() {

        if (window.__game && window.__game.renderer) {
