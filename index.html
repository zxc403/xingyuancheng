    (function(){
        try {
            window._isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
            window._pixelRatio = window._isMobile ? Math.min(window.devicePixelRatio||1, 2.0) : Math.min(window.devicePixelRatio||1, 2);
            window.addEventListener('unhandledrejection', function(e){
                console.warn('[v7.0] unhandled promise:', e.reason && (e.reason.message||e.reason));
                e.preventDefault && e.preventDefault();
            });
            window.addEventListener('error', function(e){
                if (e && e.message && /script error/i.test(e.message)) {
                    console.warn('[v7.0] swallowed script error');
                    return true;
                }
            });
        } catch(_) {}
    })();
    </script>

<script type="module">
    // ============================================================
    // 星渊城 v7.0 · 渲染管线保留版本
    // 保留：ECS、PBR纹理、HDR、SkyDome、IBL、Bloom+SSAO+Film+ACES
    // 移除：场景生成、NPC、载具、战斗、任务
    // ============================================================

    import * as THREE from 'three';
    window.THREE = THREE;
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
    import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
    import { FilmShader } from './src/core/FilmShader.js?v=5';
    import { World } from './src/ecs/index.js?v=5';
    const world = new World();
    import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';
    import { SSAOPass } from 'three/addons/postprocessing/SSAOPass.js';
    import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
    import { Renderer as RendererModule } from './src/core/Renderer.js?v=5';
    import { RendererBackend, Backend as BackendEnum } from './src/core/RendererBackend.js?v=5';
    import { Input as InputModule } from './src/core/Input.js?v=5';
    import { Player as PlayerModule } from './src/entities/Player.js?v=5';

    // ECS + Core 模块初始化
    window.__game = window.__game || {};
    window.__game.renderer = new RendererModule();
    window.__game.backend = new RendererBackend();
    window.__game.input = new InputModule();
    window.__game.player = new PlayerModule();

    window.__game.backend.detectCapabilities().then(cap => {
        console.log('[v7.0] 渲染后端能力', cap);
    });

    // GLTFLoader 动态 import
    let GLTFLoader = null;
    fetch('./vendor/three/addons/loaders/GLTFLoader.js?v=5', {method:'HEAD'}).then(r => {
        if(r.ok) return import('./vendor/three/addons/loaders/GLTFLoader.js?v=5');
    }).then(m => { if(m) { GLTFLoader = m.GLTFLoader; window.GLTFLoader = GLTFLoader; } }).catch(()=>{});

    let DRACOLoader = null, KTX2Loader = null;
    fetch('./vendor/three/addons/loaders/DRACOLoader.js?v=5', {method:'HEAD'}).then(r => {
        if(r.ok) return import('./vendor/three/addons/loaders/DRACOLoader.js?v=5');
    }).then(m => { if(m) { DRACOLoader = m.DRACOLoader; window.DRACOLoader = DRACOLoader; } }).catch(()=>{});
    fetch('./vendor/three/addons/loaders/KTX2Loader.js?v=5', {method:'HEAD'}).then(r => {
        if(r.ok) return import('./vendor/three/addons/loaders/KTX2Loader.js?v=5');
    }).then(m => { if(m) { KTX2Loader = m.KTX2Loader; window.KTX2Loader = KTX2Loader; } }).catch(()=>{});

    // ---- 工具 ----
    const U = {
        lerp: (a,b,t)=>a+(b-a)*t,
        clamp: (v,mn,mx)=>Math.max(mn,Math.min(mx,v)),
        dist2D: (x1,z1,x2,z2)=>{const dx=x1-x2,dz=z1-z2;return Math.sqrt(dx*dx+dz*dz);}
    };
    const isMobile = window._isMobile || false;

    // ---- 场景变量 ----
    let scene, camera, renderer, clock;
    let ambient, sun, hemi;
    let composer, outputPass, ssaoPass;

    // ---- 玩家 ----
    const player = {
        pos: new THREE.Vector3(0, 1.7, 30),
        vel: new THREE.Vector3(),
        yaw: 0, pitch: -0.05,
        onGround: false,
        radius: 0.4, height: 1.7,
        moveSpeed: 0
    };

    // ---- 输入 ----
    const keys = window.keys || {};
    let isPointerLocked = false, gamePaused = false, gameStarted = false;
    let qualityPreset = (isMobile ? 1 : 2);
    let shadowQuality = isMobile ? 512 : 2048;

    const QUALITY_PRESETS = {
        0: { name: '流畅', pixelRatioCap: 1.0, shadow: 512,  bloomStrength: 0.35, ssao: false,  ssaoRadius: 0.0, post: false },
        1: { name: '均衡', pixelRatioCap: 1.5, shadow: 512, bloomStrength: 0.6, ssao: true,  ssaoRadius: 0.4, post: true },
        2: { name: '高质', pixelRatioCap: 2.0,  shadow: 2048, bloomStrength: 0.85, ssao: true, ssaoRadius: 0.7, post: true },
        3: { name: '极致', pixelRatioCap: 2.0,  shadow: 2048, bloomStrength: 1.1, ssao: true, ssaoRadius: 0.9, post: true }
    };

    function applyQualityPreset(p) {
        const cfg = QUALITY_PRESETS[p] || QUALITY_PRESETS[2];
        shadowQuality = cfg.shadow;
        if (window.sun && window.sun.shadow) {
            window.sun.shadow.mapSize.set(cfg.shadow, cfg.shadow);
            if (window.sun.shadow.map) { window.sun.shadow.map.dispose(); window.sun.shadow.map = null; }
        }
        if (window.renderer) {
            window.renderer.setPixelRatio(Math.min(window.devicePixelRatio, cfg.pixelRatioCap));
        }
        try { rebuildPostPipeline(cfg); } catch (e) { console.warn('[quality] rebuild post failed', e); }
    }

    // ---- PBR 纹理加载 ----
    async function loadRealTextures() {
        const allSets = ['asphalt', 'forest', 'plank', 'rocky', 'brick', 'concrete', 'metal', 'iron', 'paving'];
        const sets = (window._isMobile) ? ['asphalt', 'plank', 'rocky', 'concrete', 'paving'] : allSets;
        const chMap = {
            diff:  { file: 'color.jpg',     setFn: (t,tex)=>{ t.colorSpace=THREE.SRGBColorSpace; tex.map=t; } },
            nor:   { file: 'normal.jpg',    setFn: (t,tex)=>{ tex.normalMap=t; } },
            rough: { file: 'roughness.jpg', setFn: (t,tex)=>{ tex.roughnessMap=t; } },
            ao:    { file: 'ao.jpg',        setFn: (t,tex)=>{ tex.aoMap=t; } }
        };
        const chs = ['diff', 'nor', 'rough', 'ao'];
        const out = {};
        const _withTimeout = (p, ms) => Promise.race([
            p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))
        ]);
        const tasks = [];
        for (const setName of sets) {
            const tex = { map: null, normalMap: null, roughnessMap: null, aoMap: null };
            out[setName] = tex;
            for (const ch of chs) {
                const chDef = chMap[ch];
                tasks.push((async () => {
                    try {
                        const url = `assets/textures/${setName}/${chDef.file}`;
                        const t = await _withTimeout(new THREE.TextureLoader().loadAsync(url), 30000);
                        chDef.setFn(t, tex);
                        t.wrapS = t.wrapT = THREE.RepeatWrapping;
                        t.anisotropy = 8;
                        t.repeat.set(2, 2);
                    } catch (e) {
                        console.warn(`[RealTexture] fallback ${setName}/${ch}`, e && e.message);
                    }
                })());
            }
        }
        await Promise.allSettled(tasks);
        for (const setName of sets) {
            const tex = out[setName];
            if (!tex.map) tex.map = _mkFallbackTex('#888888', setName);
            if (!tex.normalMap) tex.normalMap = _mkFallbackTex('#8080ff', setName);
            if (!tex.roughnessMap) tex.roughnessMap = _mkFallbackTex('#cccccc', setName);
        }
        return out;
    }

    function _mkFallbackTex(color, seed) {
        try {
            const c = document.createElement('canvas');
            c.width = c.height = 64;
            const ctx = c.getContext('2d');
            ctx.fillStyle = color;
            ctx.fillRect(0, 0, 64, 64);
            const tex = new THREE.CanvasTexture(c);
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
            return tex;
        } catch(_) { return null; }
    }

    // ---- HDR 加载 ----
    async function loadRealHDR() {
        let currentHDRKey = null;
        const hdrKeys = { day_quarry:1, night_city:1, sunset_hill:1 };
        try {
            const loader = new RGBELoader();
            loader.setDataType(THREE.HalfFloatType);
            for (const key of Object.keys(hdrKeys)) {
                try {
                    const tex = await Promise.race([
                        loader.loadAsync(`assets/hdr/${key}.hdr`),
                        new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 15000))
                    ]);
                    hdrKeys[key] = tex;
                } catch(e) { delete hdrKeys[key]; }
            }
        } catch(e) { console.warn('[HDR] loader init failed', e); }
        const tex = hdrKeys['day_quarry'] || hdrKeys['sunset_hill'] || Object.values(hdrKeys)[0];
        if (tex) {
            const pmrem = new THREE.PMREMGenerator(renderer);
            pmrem.compileEquirectangularShader();
            const envRT = pmrem.fromEquirectangular(tex);
            tex.dispose();
            pmrem.dispose();
            return envRT.texture;
        }
        return null;
    }

    // ---- GLB 模型加载 ----
    async function loadRealModels() {
        window._realModels = {};
        window._modelErrors = [];
        window._npcMixers = [];
        const loader = GLTFLoader ? new GLTFLoader() : null;
        if (!loader) return;
        if (DRACOLoader) {
            const draco = new DRACOLoader();
            draco.setDecoderPath('./vendor/three/addons/libs/draco/');
            loader.setDRACOLoader(draco);
        }
        if (KTX2Loader && renderer) {
            const ktx2 = new KTX2Loader();
            ktx2.setTranscoderPath('./vendor/three/addons/libs/basis/');
            ktx2.detectSupport(renderer);
            loader.setKTX2Loader(ktx2);
        }
        const modelList = [
            { key:'building_city', url:'assets/models/building_city.glb' },
            { key:'building_block', url:'assets/models/building_block.glb' },
            { key:'car_mustang', url:'assets/models/car_mustang.glb' },
            { key:'car_truck', url:'assets/models/car_truck.glb' },
            { key:'car_minivan', url:'assets/models/car_minivan.glb' },
            { key:'car_dragster', url:'assets/models/car_dragster.glb' },
            { key:'car_bigset', url:'assets/models/car_bigset.glb' },
            { key:'char_barbarian', url:'assets/models/char_barbarian.glb' },
            { key:'char_knight', url:'assets/models/char_knight.glb' },
            { key:'char_mage', url:'assets/models/char_mage.glb' },
            { key:'char_rogue', url:'assets/models/char_rogue.glb' },
            { key:'char_rogue_h', url:'assets/models/char_rogue_h.glb' },
            { key:'pbr_ferrari', url:'assets/models/pbr_ferrari.glb' },
            { key:'pdr_helmet', url:'assets/models/pdr_helmet.glb' },
            { key:'pbr_boombox', url:'assets/models/pbr_boombox.glb' },
            { key:'pbr_lantern', url:'assets/models/pbr_lantern.glb' },
            { key:'pbr_avocado', url:'assets/models/pbr_avocado.glb' },
            { key:'pbr_camera', url:'assets/models/pbr_camera.glb' },
            { key:'pbr_fish', url:'assets/models/pbr_fish.glb' },
            { key:'pbr_car_concept', url:'assets/models/pbr_car_concept.glb' },
            { key:'pbr_dragon', url:'assets/models/pbr_dragon.glb' },
            { key:'pbr_brainstem', url:'assets/models/pbr_brainstem.glb' },
            { key:'pbr_horse', url:'assets/models/pbr_horse.glb' },
            { key:'pbr_flamingo', url:'assets/models/pbr_flamingo.glb' },
            { key:'pbr_stork', url:'assets/models/pbr_stork.glb' },
            { key:'pbr_cesium', url:'assets/models/pbr_cesium.glb' },
            { key:'pbr_tokyo', url:'assets/models/pbr_tokyo.glb' },
            { key:'scene_cyberpunk', url:'assets/models/scene_cyberpunk.glb' },
        ];
        const tasks = modelList.map(item => (async () => {
            try {
                const gltf = await loader.loadAsync(item.url);
                window._realModels[item.key] = gltf.scene;
            } catch(e) {
                window._modelErrors.push({ key: item.key, err: e.message || String(e) });
            }
        })());
        await Promise.allSettled(tasks);
        console.log('[v7.0] Models loaded:', Object.keys(window._realModels).length);
    }

    // ---- 材质帮助函数 ----
    function createMat(tex, color, metal, rough) {
        return new THREE.MeshStandardMaterial({
            map: tex.map, roughnessMap: tex.roughnessMap,
            normalMap: tex.normalMap, aoMap: tex.aoMap,
            normalScale: new THREE.Vector2(0.8, 0.8),
            color: color, metalness: metal, roughness: rough,
            envMapIntensity: 1.0
        });
    }

    // ---- 引擎初始化（完整保留） ----
    function initEngine() {
        try {
            var _testCanvas = document.createElement('canvas');
            var _testGL = _testCanvas.getContext('webgl2') || _testCanvas.getContext('webgl') || _testCanvas.getContext('experimental-webgl');
            if (!_testGL) {
                var _e = new Error('WebGL 不可用（硬件加速被禁用？）');
                _e.code = 'NO_WEBGL';
                throw _e;
            }
        } catch(_e) { throw _e; }

        scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x7a9ab8, 0.0055);

        camera = new THREE.PerspectiveCamera(62, window.innerWidth/window.innerHeight, 0.1, 2000);
        camera.position.set(0, 5, 10);

        renderer = new THREE.WebGLRenderer({
            antialias: !isMobile,
            powerPreference: 'high-performance',
            alpha: false, stencil: false, depth: true
        });
        renderer.setClearColor(0x0a0e14, 1.0);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window._pixelRatio || Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.shadowMap.autoUpdate = true;
        renderer.shadowMap.bias = -0.0005;
        renderer.shadowMap.normalBias = 0.02;
        renderer.shadowMap.radius = 4;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.15;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        document.body.appendChild(renderer.domElement);

        // ===== 自定义天空穹顶着色器 =====
        const skyDomeGeo = new THREE.SphereGeometry(100, 32, 16);
        const skyDomeMat = new THREE.ShaderMaterial({
            uniforms: {
                uDayness: { value: 0.85 },
                uSunDirection: { value: new THREE.Vector3(0.5, 0.8, -0.3) },
                uTime: { value: 0 },
                uSunColor: { value: new THREE.Color(1.0, 0.95, 0.8) },
                uHorizonColor: { value: new THREE.Color(0.8, 0.85, 0.9) },
                uZenithColor: { value: new THREE.Color(0.2, 0.5, 0.9) },
                uGroundColor: { value: new THREE.Color(0.02, 0.01, 0.02) },
                uCloudCover: { value: 0.5 }
            },
            vertexShader: `
                varying vec3 vWorldPosition;
                void main() {
                    vec4 worldPos = modelMatrix * vec4(position, 1.0);
                    vWorldPosition = worldPos.xyz;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    gl_Position.z = gl_Position.w;
                }
            `,
            fragmentShader: `
                uniform float uDayness;
                uniform vec3 uSunDirection;
                uniform float uTime;
                uniform vec3 uSunColor;
                uniform vec3 uHorizonColor;
                uniform vec3 uZenithColor;
                uniform vec3 uGroundColor;
                uniform float uCloudCover;
                varying vec3 vWorldPosition;

                float hash(vec3 p) {
                    p = fract(p * 0.3183099 + 0.1);
                    p *= 17.0;
                    return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
                }
                float noise(vec3 p) {
                    vec3 i = floor(p);
                    vec3 f = fract(p);
                    f = f * f * (3.0 - 2.0 * f);
                    return mix(
                        mix(mix(hash(i+vec3(0,0,0)),hash(i+vec3(1,0,0)),f.x),
                            mix(hash(i+vec3(0,1,0)),hash(i+vec3(1,1,0)),f.x),f.y),
                        mix(mix(hash(i+vec3(0,0,1)),hash(i+vec3(1,0,1)),f.x),
                            mix(hash(i+vec3(0,1,1)),hash(i+vec3(1,1,1)),f.x),f.y),f.z);
                }
                float fbm(vec3 p) {
                    float v = 0.0, a = 0.5;
                    for(int i = 0; i < 5; i++) { v += a * noise(p); p *= 2.0; a *= 0.5; }
                    return v;
                }
                void main() {
                    vec3 dir = normalize(vWorldPosition);
                    float y = dir.y;
                    vec3 skyColor = mix(uZenithColor, uHorizonColor, pow(1.0 - max(y, 0.0), 0.6));
                    float horizonBlend = exp(-abs(y) * 8.0);
                    vec3 horizonTint = mix(uHorizonColor, vec3(1.0, 0.7, 0.4), 0.15 * uDayness);
                    skyColor = mix(skyColor, horizonTint, horizonBlend * 0.6);

                    vec3 sunDir = normalize(uSunDirection);
                    float sunAngle = max(dot(dir, sunDir), 0.0);
                    float sunCore = smoothstep(0.9992, 1.0, sunAngle);
                    vec3 sunCoreColor = vec3(1.0, 0.98, 0.9) * sunCore * 8.0;
                    float sunGlow = pow(sunAngle, 8.0) * 0.6;
                    float sunGlow2 = pow(sunAngle, 48.0) * 0.8;
                    vec3 sunGlowColor = uSunColor * (sunGlow * 0.4 + sunGlow2 * 0.6);
                    float sunScatter = pow(sunAngle + 0.1, 2.0) * 0.15;
                    vec3 scatterColor = vec3(1.0, 0.6, 0.3) * sunScatter * uDayness;
                    vec3 sunResult = (sunCoreColor + sunGlowColor + scatterColor) * (0.2 + 0.8 * uDayness);

                    vec3 cloudPos = dir * 30.0 + vec3(uTime * 0.04, 0.0, uTime * 0.02);
                    float cloudNoise = fbm(cloudPos);
                    float cloudDensity = smoothstep(0.35, 0.75, cloudNoise) * uDayness * uCloudCover;
                    float cloudSun = max(dot(dir, sunDir), 0.0);
                    vec3 cloudBright = mix(vec3(0.7, 0.75, 0.8), vec3(1.0, 0.9, 0.7), pow(cloudSun, 4.0));
                    vec3 cloudDark = mix(vec3(0.4, 0.42, 0.45), vec3(0.3, 0.3, 0.35), 1.0 - uDayness);
                    vec3 cloudColor = mix(cloudDark, cloudBright, cloudDensity);

                    float starVis = 1.0 - uDayness;
                    vec3 starPos = dir * 200.0;
                    vec3 starCell = floor(starPos * 30.0);
                    float starHash = hash(starCell);
                    float starPattern = step(0.997, starHash) * starVis;
                    float starTwinkle = sin(uTime * 3.0 + starHash * 100.0 + starCell.x * 0.5) * 0.5 + 0.5;
                    vec3 starColor = mix(vec3(0.8, 0.85, 1.0), vec3(1.0, 0.9, 0.7), starHash) * starPattern * (0.5 + 0.5 * starTwinkle);

                    float moonVis = 1.0 - uDayness;
                    vec3 moonDir = normalize(vec3(-sunDir.x * 0.8, 0.25 + 0.3 * (1.0 - uDayness), -sunDir.z * 0.8));
                    float moonAngle = max(dot(dir, moonDir), 0.0);
                    float moonDisk = smoothstep(0.999, 1.0, moonAngle);
                    float moonGlow = pow(moonAngle, 16.0) * 0.15;
                    vec3 moonColor = vec3(0.85, 0.85, 0.95) * (moonDisk * 1.5 + moonGlow) * moonVis;

                    vec3 finalColor = skyColor + sunResult + cloudColor * cloudDensity + starColor + moonColor;
                    if(y < 0.0) {
                        float groundBlend = exp(y * 12.0);
                        finalColor = mix(uGroundColor, uHorizonColor, groundBlend);
                    }
                    finalColor = finalColor / (finalColor + vec3(1.0));
                    finalColor = pow(finalColor, vec3(1.0/2.2));
                    gl_FragColor = vec4(finalColor, 1.0);
                }
            `,
            side: THREE.BackSide,
            depthWrite: false
        });
        const skyDome = new THREE.Mesh(skyDomeGeo, skyDomeMat);
        skyDome.name = 'skyDome';
        scene.add(skyDome);
        window._skyDome = skyDome;

        // ===== IBL =====
        try {
            const pmrem = new THREE.PMREMGenerator(renderer);
            pmrem.compileEquirectangularShader();
            const envRT = pmrem.fromScene(skyDome, 0.04);
            scene.environment = envRT.texture;
            window._envRT = envRT;
            pmrem.dispose();
        } catch(e){ console.warn('IBL failed', e); }

        // 三点光 + 半球光
        ambient = new THREE.AmbientLight(0x8a7a6a, 0.45);
        scene.add(ambient);
        hemi = new THREE.HemisphereLight(0x9ec5e8, 0x3a2a1a, 0.6);
        scene.add(hemi);
        sun = new THREE.DirectionalLight(0xfff0d0, 3.0);
        sun.position.set(-80, 120, -60);
        sun.castShadow = true;
        sun.shadow.mapSize.set(isMobile ? 512 : 2048, isMobile ? 512 : 2048);
        sun.shadow.camera.near = 1; sun.shadow.camera.far = 500;
        sun.shadow.camera.left = -250; sun.shadow.camera.right = 250;
        sun.shadow.camera.top = 250; sun.shadow.camera.bottom = -250;
        sun.shadow.bias = -0.00005; sun.shadow.normalBias = 0.04; sun.shadow.radius = 4;
        scene.add(sun);
        window._sun = sun;
        const fill = new THREE.DirectionalLight(0x6688c0, 0.55);
        fill.position.set(80, 60, 80);
        scene.add(fill);
        const rim = new THREE.DirectionalLight(0xc9a96e, 0.35);
        rim.position.set(0, 20, -120);
        scene.add(rim);

        // 后处理
        if (isMobile) {
            try { rebuildMobileBloom(); } catch(e) { composer = null; }
        } else {
            try { rebuildPostPipeline(QUALITY_PRESETS[qualityPreset]); } catch(e) {
                console.warn('EffectComposer init failed', e); composer = null;
            }
        }

        clock = new THREE.Clock();

        function rebuildPostPipeline(cfg) {
            if (!renderer || isMobile) { composer = null; return; }
            if (!cfg.post) { composer = null; return; }
            if (composer) { try { composer.dispose && composer.dispose(); } catch (_) {} composer = null; }
            composer = new EffectComposer(renderer);
            const renderPass = new RenderPass(scene, camera);
            composer.addPass(renderPass);

            if (cfg.ssao && cfg.ssaoRadius > 0) {
                try {
                    ssaoPass = new SSAOPass(scene, camera, window.innerWidth, window.innerHeight);
                    ssaoPass.kernelRadius = cfg.ssaoRadius;
                    ssaoPass.minDistance = 0.001;
                    ssaoPass.maxDistance = 0.05;
                    ssaoPass.output = SSAOPass.OUTPUT.Default;
                    composer.addPass(ssaoPass);
                    window._ssao = ssaoPass;
                } catch (e) { console.warn('SSAO failed, skip', e); }
            } else { ssaoPass = null; }

            const bloomPass = new UnrealBloomPass(
                new THREE.Vector2(window.innerWidth, window.innerHeight),
                cfg.bloomStrength, 0.55, 0.78
            );
            composer.addPass(bloomPass);
            window._bloom = bloomPass;

            try {
                let filmPass = new ShaderPass(FilmShader);
                filmPass.uniforms.uResolution.value = new THREE.Vector2(
                    window.innerWidth * renderer.getPixelRatio(),
                    window.innerHeight * renderer.getPixelRatio()
                );
                const filmOn = (qualityPreset >= 1);
                filmPass.uniforms.uVignette.value = filmOn ? 0.45 : 0.0;
                filmPass.uniforms.uGrain.value    = filmOn ? 0.06 : 0.0;
                filmPass.uniforms.uFxaa.value     = 1.0;
                filmPass.uniforms.uChroma.value   = filmOn ? 0.6 : 0.0;
                filmPass.uniforms.uSharp.value    = filmOn ? 0.5 : 0.0;
                composer.addPass(filmPass);
                window._film = filmPass;
            } catch (e) { console.warn('FilmPass failed, skip', e); }

            outputPass = new OutputPass();
            composer.addPass(outputPass);
            window._composer = composer;
        }

        function rebuildMobileBloom() {
            if (!renderer) { composer = null; return; }
            if (composer) { try { composer.dispose(); } catch(_) {} composer = null; }
            composer = new EffectComposer(renderer);
            composer.addPass(new RenderPass(scene, camera));
            const bloomPass = new UnrealBloomPass(
                new THREE.Vector2(window.innerWidth, window.innerHeight),
                0.3, 0.4, 0.85
            );
            composer.addPass(bloomPass);
            composer.addPass(new OutputPass());
            window._bloom = bloomPass;
            window._composer = composer;
        }

        if (window.__game && window.__game.renderer) {
            window.__game.renderer.attach({ scene, camera, renderer, composer, clock, isMobile });
            window.__game.renderer.syncGlobals();
        }
    }

    // ---- 构建测试场景（替代旧 buildWorld） ----
    function buildWorld() {
        // 大地平面 - 测试 PBR 纹理
        const groundGeo = new THREE.PlaneGeometry(500, 500);
        groundGeo.rotateX(-Math.PI / 2);
        const groundTex = window._realTex && window._realTex['asphalt'];
        let groundMat;
        if (groundTex && groundTex.map) {
            groundMat = new THREE.MeshStandardMaterial({
                map: groundTex.map.copy ? groundTex.map : groundTex.map,
                roughnessMap: groundTex.roughnessMap,
                normalMap: groundTex.normalMap,
                aoMap: groundTex.aoMap,
                normalScale: new THREE.Vector2(1, 1),
                roughness: 0.8,
                metalness: 0.05,
                envMapIntensity: 1.0
            });
            if (groundMat.map && groundMat.map.repeat) groundMat.map.repeat.set(20, 20);
            if (groundMat.roughnessMap && groundMat.roughnessMap.repeat) groundMat.roughnessMap.repeat.set(20, 20);
            if (groundMat.normalMap && groundMat.normalMap.repeat) groundMat.normalMap.repeat.set(20, 20);
            if (groundMat.aoMap && groundMat.aoMap.repeat) groundMat.aoMap.repeat.set(20, 20);
        } else {
            groundMat = new THREE.MeshStandardMaterial({ color: 0x555555, roughness: 0.85, metalness: 0.05 });
        }
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.receiveShadow = true;
        scene.add(ground);

        // PBR 展示圈 - 测试材质
        if (window._realTex) {
            const texList = ['concrete', 'brick', 'metal', 'rocky', 'plank', 'paving'];
            const cols = [0xcccccc, 0x8b4513, 0x8899aa, 0x887766, 0x8b6914, 0x999999];
            texList.forEach((name, i) => {
                const tex = window._realTex[name];
                if (!tex || !tex.map) return;
                const geo = new THREE.BoxGeometry(3, 3, 3);
                const mat = createMat(tex, cols[i], i === 2 ? 0.8 : 0.05, i === 1 ? 0.6 : 0.4);
                const cube = new THREE.Mesh(geo, mat);
                cube.position.set((i - 2.5) * 5, 1.5, 20);
                cube.castShadow = true;
                cube.receiveShadow = true;
                scene.add(cube);
            });
        }

        // GLB 模型展示
        if (window._realModels) {
            const placeG = (key, x, z, ry = 0, scale = 1) => {
                if (window._realModels[key]) {
                    const m = window._realModels[key].clone();
                    m.position.set(x, 0, z);
                    m.rotation.y = ry;
                    m.scale.setScalar(scale);
                    scene.add(m);
                }
            };
            placeG('building_city', 30, 30, 0, 1.5);
            placeG('building_block', -30, 30, Math.PI / 4, 0.8);
            placeG('car_mustang', 15, 10, Math.PI / 2, 1.0);
            placeG('pbr_ferrari', -15, 15, -Math.PI / 2, 1.0);
            placeG('pbr_boombox', 25, 10, 0, 1.2);
            placeG('pbr_lantern', -25, 10, 0, 0.8);
            placeG('pbr_dragon', 0, 40, 0, 0.06);
        }

        // 光照参考球
        const refGeo = new THREE.SphereGeometry(0.5, 32, 32);
        const refMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2, metalness: 0.1, envMapIntensity: 1.0 });
        const refBall = new THREE.Mesh(refGeo, refMat);
        refBall.position.set(0, 2, 10);
        refBall.castShadow = true;
        scene.add(refBall);
    }

    // ---- 玩家移动 ----
    function updatePlayer(dt) {
        if (!gameStarted || gamePaused) return;
        const speed = 8;
        let mx = 0, mz = 0;
        if (keys['KeyW'] || keys['ArrowUp']) mz = 1;
        if (keys['KeyS'] || keys['ArrowDown']) mz = -1;
        if (keys['KeyA'] || keys['ArrowLeft']) mx = -1;
        if (keys['KeyD'] || keys['ArrowRight']) mx = 1;
        const len = Math.sqrt(mx * mx + mz * mz);
        if (len > 0) { mx /= len; mz /= len; }
        player.vel.x = (Math.cos(player.yaw) * mz - Math.sin(player.yaw) * mx) * speed;
        player.vel.z = (-Math.sin(player.yaw) * mz - Math.cos(player.yaw) * mx) * speed;
        player.moveSpeed = len * speed;
        player.pos.x += player.vel.x * dt;
        player.pos.z += player.vel.z * dt;
        player.pos.y = 1.7;
    }

    // ---- 相机更新 ----
    function updateCamera() {
        const tx = player.pos.x - Math.sin(player.yaw) * 8 * Math.cos(player.pitch);
        const tz = player.pos.z - Math.cos(player.yaw) * 8 * Math.cos(player.pitch);
        const ty = player.pos.y + 2.5 + Math.sin(player.pitch) * 8;
        camera.position.lerp(new THREE.Vector3(tx, ty, tz), 0.12);
        camera.lookAt(player.pos.x, player.pos.y + player.height * 0.6, player.pos.z);
    }

    // ---- 输入 ----
    function initInput() {
        window.addEventListener('keydown', e => { keys[e.code] = true; });
        window.addEventListener('keyup', e => { keys[e.code] = false; });
        document.addEventListener('mousemove', e => {
            if (isPointerLocked && gameStarted) {
                player.yaw -= e.movementX * 0.002;
                player.pitch -= e.movementY * 0.002;
                player.pitch = U.clamp(player.pitch, -1.0, 0.6);
            }
        });
        document.addEventListener('pointerlockchange', () => {
            isPointerLocked = document.pointerLockElement === renderer.domElement;
        });
        window.addEventListener('wheel', e => {
            player.pitch += e.deltaY * 0.0005;
            player.pitch = U.clamp(player.pitch, -1.0, 0.6);
        }, { passive: true });
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            if (composer) composer.setSize(window.innerWidth, window.innerHeight);
        });
    }

    // ---- 主循环 ----
    function animate() {
        requestAnimationFrame(animate);
        const dt = Math.min(clock.getDelta(), 0.05);

        if (gameStarted && !gamePaused) {
            updatePlayer(dt);
        }
        updateCamera();

        if (window._skyDome) window._skyDome.material.uniforms.uTime.value += dt;

        if (window._film && window._film.uniforms && window._film.uniforms.uTime) {
            window._film.uniforms.uTime.value = clock.elapsedTime;
        }

        if (composer) composer.render();
        else if (renderer) renderer.render(scene, camera);

        // 显示 FPS
        document.getElementById('info').textContent = `v7.0 | FPS: ${Math.round(1/dt)}`;
    }

    // ---- 启动 ----
    async function init() {
        const isMob = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
        if (isMob) {
            document.getElementById('blocker').style.display = 'none';
            gameStarted = true;
            gamePaused = false;
        }

        const lt = document.getElementById('loadText');
        try {
            if (lt) lt.textContent = '初始化引擎...';
            await initEngine();

            if (lt) lt.textContent = '加载 PBR 纹理...';
            const realTex = await loadRealTextures().catch(e => { console.warn('[Init] textures failed', e); return null; });
            window._realTex = realTex;

            if (lt) lt.textContent = '加载 HDR 环境...';
            const realHDR = await Promise.race([
                loadRealHDR().catch(e => { console.warn('[Init] HDR failed', e); return null; }),
                new Promise(res => setTimeout(() => res(null), 30000))
            ]);
            if (realHDR) scene.environment = realHDR;
            window._realHDR = realHDR;

            if (lt) lt.textContent = '加载模型...';
            try { await loadRealModels(); } catch(e) { console.warn('[Init] models failed', e); }

            if (lt) lt.textContent = '构建场景...';
            buildWorld();

        } catch(e) {
            if (lt) lt.textContent = '初始化失败: ' + e.message;
            if (/webgl|context/i.test(e.message||'')) {
                document.getElementById('webglFail').style.display = 'flex';
                document.getElementById('loading').style.display = 'none';
            }
            console.error(e);
            return;
        }

        if (!scene || !player) {
            console.warn('[Init] WebGL 未启动');
            return;
        }

        initInput();

        if (!gameStarted) {
            gameStarted = true;
            gamePaused = false;
        }

        setTimeout(() => document.getElementById('loading').classList.add('hide'), 800);
        clock.start();
        animate();
    }

    // 事件绑定
    document.getElementById('blocker').addEventListener('click', () => {
        if (!gameStarted) {
            document.getElementById('blocker').style.display = 'none';
            gameStarted = true;
            gamePaused = false;
            const isMob = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
            if (!isMob) { try { renderer.domElement.requestPointerLock(); } catch(_) {} }
        }
    });

    setTimeout(() => {
        const isMob = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
        if (isMob) return;
        if (!gameStarted && typeof player !== 'undefined' && player && typeof scene !== 'undefined' && scene) {
            document.getElementById('blocker').style.display = 'none';
            gameStarted = true;
            gamePaused = false;
            try { renderer.domElement.requestPointerLock(); } catch(_) {}
        }
    }, 12000);

    init();
    console.log('星渊城 v7.0 渲染管线保留版 加载完成');
</script>
</body></html>
