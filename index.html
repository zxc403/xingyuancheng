    const _contactShadowMat = new THREE.MeshBasicMaterial({
        color: 0x000000,

    });
    function addContactShadow(x, y, z, scale, opacity) {
        const m = new THREE.Mesh(_contactShadowGeo, _contactShadowMat.clone());
        m.material.opacity = opacity || 0.35;
        m.rotation.x = -Math.PI/2;

    function getTerrainH(x,z) {
        let h = 0;
        h += Math.sin(x*0.01 + z*0.008)*1.2;
        h += Math.sin(x*0.023 + z*0.015)*0.6;
        h += Math.cos(x*0.005 - z*0.007)*0.3;
        if(Math.abs(x+100)<60 && Math.abs(z+120)<40) h += 1.5 - Math.abs(x+100)/40 - Math.abs(z+120)/27;
        if(Math.abs(x-30)<15 && Math.abs(z+15)<15) h += 0.8;
        if(Math.abs(x-50)<18 && Math.abs(z+40)<18) h += 1.0;
        if(Math.abs(x+230)<30 && Math.abs(z+80)<30) h += 0.6;
        if(Math.abs(x-50)<25 && Math.abs(z-130)<25) h += 0.5;
        return h;
    }

    async function loadRealTextures() {
        const sets = ['asphalt', 'forest', 'plank', 'rocky', 'brick', 'concrete', 'metal', 'iron'];
        const chs = ['diff', 'nor', 'rough'];  // v6.1: AO 缺失会 fall through

        for (const setName of sets) {
            const tex = { map: null, normalMap: null, roughnessMap: null, aoMap: null };
            for (const ch of chs) {
                try {
                    const url = `assets/textures/${setName}_${ch}.jpg`;
                    const t = await new THREE.TextureLoader().loadAsync(url);
                    if (ch === 'diff') {
                        t.colorSpace = THREE.SRGBColorSpace;
                        tex.map = t;
                    } else if (ch === 'nor') {
                        tex.normalMap = t;
                    } else if (ch === 'rough') {
                        tex.roughnessMap = t;
                    } else if (ch === 'ao') {
                        tex.aoMap = t;
                    }
                    t.wrapS = t.wrapT = THREE.RepeatWrapping;
                    t.anisotropy = 8;
                    t.repeat.set(2, 2);
                } catch (e) {
                    console.warn(`[RealTexture] failed ${setName}/${ch}`, e);
                }
            }
            out[setName] = tex;
            console.log(`[RealTexture] loaded ${setName}: d=${!!tex.map} n=${!!tex.normalMap} r=${!!tex.roughnessMap} a=${!!tex.aoMap}`);
        }
        return out;

    // ---- 程序生成纹理（备用，回退方案） ----
    function genTex5Ch(type, sz) {
        sz = sz || 512;
        const mapCv = document.createElement('canvas');
        mapCv.width = mapCv.height = sz;
        const mctx = mapCv.getContext('2d');
        const roughCv = document.createElement('canvas');
        roughCv.width = roughCv.height = sz;
        const rctx = roughCv.getContext('2d');
        const normCv = document.createElement('canvas');
        normCv.width = normCv.height = sz;
        const nctx = normCv.getContext('2d');
        mctx.fillStyle = '#808080';
        mctx.fillRect(0,0,sz,sz);
        rctx.fillStyle = '#808080';
        rctx.fillRect(0,0,sz,sz);
        nctx.fillStyle = '#8080ff';
        nctx.fillRect(0,0,sz,sz);
        if(type === 'brick') {
            const bw = sz/6, bh = sz/4;
            for(let r=0; r<4; r++) for(let c=0; c<6; c++) {
                const ox = (r%2)*bw/2;
                mctx.fillStyle = '#909090';
                mctx.fillRect(c*bw+ox+1, r*bh+1, bw-2, bh-2);
                mctx.strokeStyle = '#505050';
                mctx.strokeRect(c*bw+ox, r*bh, bw, bh);
                rctx.fillStyle = '#707070';
                rctx.fillRect(c*bw+ox+1, r*bh+1, bw-2, bh-2);
                rctx.fillStyle = '#a0a0a0';
                rctx.fillRect(c*bw+ox, r*bh, bw, bh);
            }
        } else if(type === 'wood') {
            for(let i=0; i<30; i++) {
                const x = (i/30)*sz + Math.sin(i*0.5)*8;
                const b = 100+Math.sin(i*1.7)*40;
                mctx.strokeStyle = `rgb(${b},${b-20},${b-30})`;
                mctx.lineWidth = 2+Math.sin(i*0.9)*2;
                mctx.beginPath();
                mctx.moveTo(x,0);
                for(let y=0; y<sz; y+=2) mctx.lineTo(x+Math.sin(y*0.03+i)*6, y);
                mctx.stroke();
            }
        } else if(type === 'grass') {
            // 真实草地纹理：多层细草叶 + 色斑
            const id = mctx.getImageData(0,0,sz,sz);
            const d = id.data;
            for(let i=0; i<d.length; i+=4) {
                // 基础绿色 + 噪声
                const base = 80 + Math.random()*60;
                d[i]   = base * 0.7 + Math.random()*30;        // R
                d[i+1] = base + 30 + Math.random()*60;         // G
                d[i+2] = base * 0.5 + Math.random()*30;        // B
            }
            mctx.putImageData(id,0,0);
            // 大量短草叶
            for(let i=0; i<8000; i++){
                const x = Math.random()*sz, y = Math.random()*sz;
                const len = 2+Math.random()*5;
                const g = 90+Math.random()*80;
                mctx.strokeStyle = `rgba(${g*0.5},${g},${g*0.4},0.7)`;
                mctx.lineWidth = 0.8;
                mctx.beginPath();
                mctx.moveTo(x,y);
                mctx.lineTo(x + (Math.random()-0.5)*2, y-len);
                mctx.stroke();
            }
            // 粗糙度噪点
            const rid = rctx.getImageData(0,0,sz,sz);
            const rd = rid.data;
            for(let i=0; i<rd.length; i+=4){
                const v = 140 + Math.random()*100;
                rd[i]=rd[i+1]=rd[i+2]=v;
            }
            rctx.putImageData(rid,0,0);
            // 法线：模拟草叶朝向
            const nid = nctx.getImageData(0,0,sz,sz);
            const nd = nid.data;
            for(let i=0; i<nd.length; i+=4){
                nd[i]   = 128 + (Math.random()-0.5)*80;   // X
                nd[i+1] = 128 + (Math.random()-0.5)*80;   // Y
                nd[i+2] = 255;                             // Z
            }
            nctx.putImageData(nid,0,0);
        } else if(type === 'road') {
            // 沥青路面：灰底+颗粒+白黄车道线
            mctx.fillStyle = '#3a3a3e';
            mctx.fillRect(0,0,sz,sz);
            // 沥青颗粒
            for(let i=0; i<6000; i++){
                const x=Math.random()*sz, y=Math.random()*sz;
                const v = 40+Math.random()*40;
                mctx.fillStyle = `rgba(${v},${v},${v+5},0.5)`;
                mctx.fillRect(x,y,1+Math.random()*2,1+Math.random()*2);
            }
            // 黄色车道中线
            mctx.fillStyle = '#ffd24a';
            mctx.fillRect(sz*0.48, 0, sz*0.04, sz);
            // 白色边线
            mctx.fillStyle = '#eeeeee';
            mctx.fillRect(sz*0.04, 0, 3, sz);
            mctx.fillRect(sz*0.94, 0, 3, sz);
            // 粗糙度
            const rid = rctx.getImageData(0,0,sz,sz);
            const rd = rid.data;
            for(let i=0; i<rd.length; i+=4){
                rd[i]=rd[i+1]=rd[i+2]=180+Math.random()*60;
            }
            rctx.putImageData(rid,0,0);
            // 法线
            const nid = nctx.getImageData(0,0,sz,sz);
            const nd = nid.data;
            for(let i=0; i<nd.length; i+=4){
                nd[i]   = 128 + (Math.random()-0.5)*40;
                nd[i+1] = 128 + (Math.random()-0.5)*40;
                nd[i+2] = 255;
            }
            nctx.putImageData(nid,0,0);
        } else {
            // 石头：碎石纹理（不再只是灰噪点）
            const id = mctx.getImageData(0,0,sz,sz);
            const d = id.data;
            for(let i=0; i<d.length; i+=4) {
                const r = 110+(Math.random()-0.5)*70;
                d[i]=r; d[i+1]=r*0.95; d[i+2]=r*0.85;
            }
            mctx.putImageData(id,0,0);
            // 裂痕
            for(let i=0; i<200; i++){
                const x=Math.random()*sz, y=Math.random()*sz;
                mctx.strokeStyle = `rgba(50,50,50,${0.3+Math.random()*0.4})`;
                mctx.lineWidth = 0.6;
                mctx.beginPath();
                mctx.moveTo(x,y);
                mctx.lineTo(x+(Math.random()-0.5)*15, y+(Math.random()-0.5)*15);
                mctx.stroke();
            }
            // 粗糙度
            const rid = rctx.getImageData(0,0,sz,sz);
            const rd = rid.data;
            for(let i=0; i<rd.length; i+=4){
                rd[i]=rd[i+1]=rd[i+2]=160+Math.random()*80;
            }
            rctx.putImageData(rid,0,0);
            // 法线
            const nid = nctx.getImageData(0,0,sz,sz);
            const nd = nid.data;
            for(let i=0; i<nd.length; i+=4){
                nd[i]   = 128 + (Math.random()-0.5)*60;
                nd[i+1] = 128 + (Math.random()-0.5)*60;
                nd[i+2] = 255;
            }
            nctx.putImageData(nid,0,0);
        }
        const out = { map: null, roughnessMap: null, normalMap: null };
        out.map = new THREE.CanvasTexture(mapCv);
        out.map.wrapS = out.map.wrapT = THREE.RepeatWrapping;
        out.map.colorSpace = THREE.SRGBColorSpace;
        out.map.anisotropy = 4;
        out.map.repeat.set(2,2);
        out.roughnessMap = new THREE.CanvasTexture(roughCv);
        out.roughnessMap.wrapS = out.roughnessMap.wrapT = THREE.RepeatWrapping;
        out.roughnessMap.anisotropy = 4;
        out.roughnessMap.repeat.set(2,2);
        out.normalMap = new THREE.CanvasTexture(normCv);
        out.normalMap.wrapS = out.normalMap.wrapT = THREE.RepeatWrapping;
        out.normalMap.anisotropy = 4;
        out.normalMap.repeat.set(2,2);
        return out;
    }

    const texBrick = genTex5Ch('brick');
    // 程序生成纹理（fallback）
    const texWood = genTex5Ch('wood');

    // ---- 音频系统（简化，保留完整功能） ----
    const AudioSys = {
        init() {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            this.master = this.ctx.createGain();
            this.master.gain.value = 0.3;
            this.master.connect(this.ctx.destination);
        },
        playBeep(freq, dur, vol) {
            try {
                const osc = this.ctx.createOscillator();
                const g = this.ctx.createGain();
                osc.frequency.value = freq || 440;
                g.gain.setValueAtTime(vol||0.15, this.ctx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime+(dur||0.2));
                osc.connect(g);
                g.connect(this.master);
                osc.start();
                osc.stop(this.ctx.currentTime+(dur||0.2));
            } catch(e) {}
        },
        playGunshot(type) {
            const freq = type==='shotgun'?80:(type==='smg'?200:(type==='rifle'?120:150));
            const dur = type==='shotgun'?0.15:(type==='smg'?0.05:(type==='rifle'?0.08:0.1));
            const vol = type==='shotgun'?0.3:(type==='smg'?0.1:(type==='rifle'?0.2:0.15));
            this.playBeep(freq, dur, vol);
            if(type==='shotgun'||type==='rifle') setTimeout(()=>this.playBeep(freq*0.8, dur*0.7, vol*0.5), dur*300);
        },
        playExplosion() { this.playBeep(60, 0.3, 0.35); setTimeout(()=>this.playBeep(40, 0.2, 0.2), 100); },
        playPickup() { this.playBeep(800, 0.08, 0.08); setTimeout(()=>this.playBeep(1000, 0.06, 0.06), 80); },
        startEngine() { /* 简化 */ },
        setEngineRPM(r) { /* 简化 */ },
        stopEngine() { /* 简化 */ },
        radioStations: [{name:'Head Radio',bpm:120}],
        startRadio(idx) { /* 简化 */ },
        stopRadio() { /* 简化 */ }
    };

    // ===== 构建世界 =====
    function addBCollider(x,z,radius,height,name) {
        buildings.push({x,z,radius,height,name});
    }
    function checkBCollision(x,z,r) {
        r = r||0.4;
        for(const b of buildings) {
            if(U.dist2D(x,z,b.x,b.z) < b.radius+r) return b;
        }
        return null;
    }

    function buildRoads() {
        // 路面材质：优先用真实 PBR 沥青纹理（Poly Haven）
        const realRoad = REAL_TEX_ROAD();
        const roadMat = new THREE.MeshPhysicalMaterial({
            map: realRoad.map,
            roughnessMap: realRoad.roughnessMap,
            normalMap: realRoad.normalMap,
            aoMap: realRoad.aoMap,
            aoMapIntensity: 0.6,
            normalScale: new THREE.Vector2(0.8, 0.8),
            roughness: 0.85,
            metalness: 0.05,
            envMapIntensity: 1.0,
            clearcoat: 0.08,
            clearcoatRoughness: 0.45
        });
        // 平铺到适合路面
        if(roadMat.map) roadMat.map.repeat.set(4, 24);
        if(roadMat.roughnessMap) roadMat.roughnessMap.repeat.set(4, 24);
        if(roadMat.normalMap) roadMat.normalMap.repeat.set(4, 24);
        if(roadMat.aoMap) roadMat.aoMap.repeat.set(4, 24);
        const roads = [
            {x:0,z:0,w:20,l:600,rot:0},
            {x:50,z:0,w:18,l:500,rot:Math.PI/2},
            {x:-50,z:0,w:14,l:500,rot:Math.PI/2},
            {x:0,z:-30,w:14,l:400,rot:0},
            {x:0,z:60,w:14,l:350,rot:0}
        ];
        roads.forEach(r=>{
            const geo = new THREE.PlaneGeometry(r.w, r.l);
            geo.rotateX(-Math.PI/2);
            const m = new THREE.Mesh(geo, roadMat);
            m.position.set(r.x, 0.05, r.z);
            m.rotation.y = r.rot;
            m.receiveShadow = true;
            scene.add(m);
        });
    }

    function buildBuildings() {
        const colors = [0x9aa5b0,0xa5b0bb,0x8895a3,0xb5a599,0xa59588,0x7a8a98,0xb5b5cc];
        const regions = [
            {cx:35,cz:-20,r:40,c:25,mnH:20,mxH:80},
            {cx:15,cz:-55,r:30,c:20,mnH:4,mxH:12},
            {cx:150,cz:0,r:60,c:30,mnH:10,mxH:50},
            {cx:50,cz:100,r:50,c:25,mnH:6,mxH:30},
            {cx:-230,cz:-20,r:40,c:20,mnH:5,mxH:20},
            {cx:-180,cz:50,r:50,c:25,mnH:8,mxH:40}
        ];

        // 主体材质：砖纹理 PBR（增强版）
        const wallMat = new THREE.MeshPhysicalMaterial({
            map: texBrick.map, roughnessMap: texBrick.roughnessMap,
            normalMap: texBrick.normalMap, normalScale: new THREE.Vector2(1.8, 1.8),
            roughness: 0.75, metalness: 0.05, envMapIntensity: 1.8, color: 0xffffff,
            clearcoat: 0.15, clearcoatRoughness: 0.5
        });
        // 窗户材质：深蓝玻璃，自发光（夜间更亮）
        const winMat = new THREE.MeshPhysicalMaterial({
            color: 0x2a4060, metalness: 0.4, roughness: 0.08,
            envMapIntensity: 2.0, clearcoat: 1.0, clearcoatRoughness: 0.05,
            emissive: 0x1a3050, emissiveIntensity: 0.4
        });
        // 夜晚暖光窗户材质（部分窗户使用）
        const winLitMat = new THREE.MeshPhysicalMaterial({
            color: 0x3a2a18, metalness: 0.3, roughness: 0.1,
            envMapIntensity: 1.5, clearcoat: 0.8, clearcoatRoughness: 0.05,
            emissive: 0xffd9a0, emissiveIntensity: 1.8
        });
        window._winLitMat = winLitMat;
        window._winDefaultMat = winMat;
        // 屋顶材料：暗绿瓦（PBR 增强）
        const roofMat = new THREE.MeshPhysicalMaterial({
            color: 0x3a3a3a, roughness: 0.65, metalness: 0.1, envMapIntensity: 1.5,
            clearcoat: 0.2, clearcoatRoughness: 0.3
        });
        // 排水管：金属（PBR 增强）
        const pipeMat = new THREE.MeshPhysicalMaterial({
            color: 0x5a5a5a, roughness: 0.4, metalness: 0.75, envMapIntensity: 1.8
        });
        // 窗框：浅色
        const frameMat = new THREE.MeshStandardMaterial({
            color: 0xe0d8c8, roughness: 0.6, metalness: 0.1
        });

        regions.forEach(reg=>{
            for(let i=0; i<reg.c; i++){
                const a=Math.random()*Math.PI*2, d=Math.random()*reg.r;
                const x=reg.cx+Math.cos(a)*d, z=reg.cz+Math.sin(a)*d;
                let close=false;
                for(const b of buildings) if(U.dist2D(x,z,b.x,b.z)<b.radius+5){ close=true; break; }
                if(Math.abs(x+100)<50) close=true;
                if(close) continue;

                const w=U.rand(5,12), d2=U.rand(5,12), h=U.rand(reg.mnH, reg.mxH);
                const group = new THREE.Group();

                // ① 主体
                const matInst = wallMat.clone();
                matInst.color = new THREE.Color(colors[U.randInt(0,colors.length-1)]);
                const body = new THREE.Mesh(new THREE.BoxGeometry(w, h, d2), matInst);
                body.position.set(0, h/2, 0);
                body.castShadow = true; body.receiveShadow = true;
                group.add(body);

                // ② 窗户列 — 4 面，每面 2-4 列 × 2-3 层
                const cols = Math.max(2, Math.floor(w/2.2));
                const rows = Math.max(2, Math.floor(h/3.5));
                for(let fy=0; fy<2; fy++){                  // 上下两组
                    for(let fz=0; fz<2; fz++){               // 四面
                        for(let c=0; c<cols; c++){
                            for(let r=0; r<rows-1; r++){
                                if(Math.random() < 0.18) continue;   // 18% 窗户缺失（旧感）
                                const ww = 0.8, wh = 1.0;
                                const px = -w/2 + (c+0.5)*(w/cols);
                                const py = 1.5 + r*3.2 + fy*((h-3)/2);
                                const pz = (fz<2?-1:1)*d2/2 + 0.05*(fz<2?-1:1);
                                const rot = fz<2 ? 0 : Math.PI/2;
                                // 玻璃
                                const win = new THREE.Mesh(
                                    new THREE.PlaneGeometry(ww, wh),
                                    winMat
                                );
                                win.position.set(
                                    fz%2===0 ? px : (fz===0 ? 0 : 0),
                                    py,
                                    fz%2===0 ? (fz===0?-d2/2-0.01:d2/2+0.01) : px
                                );
                                if(fz===1) win.rotation.y = Math.PI;
                                if(fz>=2) {
                                    win.rotation.y = Math.PI/2 * (fz-1);
                                    win.position.set(px, py, pz);
                                    if(fz===3) win.rotation.y = -Math.PI/2;
                                }
                                // 简化：四个面各 1 组
                                group.add(win);
                            }
                        }
                    }
                }

                // ③ 屋顶 — 压顶/女儿墙
                const roofH = 0.8;
                const roofY = h + roofH/2;
                const roof = new THREE.Mesh(
                    new THREE.BoxGeometry(w*1.04, roofH, d2*1.04),
                    roofMat
                );
                roof.position.set(0, roofY, 0);
                roof.castShadow = true; roof.receiveShadow = true;
                group.add(roof);

                // ④ 排水管（4 角细管）
                for(let px2 of [-w/2+0.2, w/2-0.2]) for(let pz2 of [-d2/2+0.2, d2/2-0.2]){
                    const pipe = new THREE.Mesh(
                        new THREE.CylinderGeometry(0.06, 0.06, h+0.6, 6),
                        pipeMat
                    );
                    pipe.position.set(px2, h/2, pz2);
                    pipe.castShadow = true;
                    group.add(pipe);
                }

                // ⑤ 接触阴影
                addContactShadow(0, 0, 0, Math.max(w,d2)*0.7, 0.45);

                // ⑥ 墙面霓虹招牌（高楼随机 1-2 个）
                if (h > 18) {
                    const signCount = 1 + (Math.random() < 0.5 ? 1 : 0);
                    for (let s = 0; s < signCount; s++) {
                        const neonHex = [0x00e5ff, 0xff2d95, 0xffd166, 0x7c4dff, 0x00ff9d, 0xff6b35][U.randInt(0, 5)];
                        const signW = U.rand(2.5, 4.5);
                        const signH = U.rand(0.8, 1.6);
                        const signY = U.rand(h * 0.3, h * 0.7);
                        const side = U.randInt(0, 3);
                        const signMat = new THREE.MeshStandardMaterial({
                            color: 0x05050a, emissive: neonHex, emissiveIntensity: 2.8,
                            metalness: 0.2, roughness: 0.4
                        });
                        const sign = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), signMat);
                        sign.scale.set(signW, signH, 0.3);
                        if (side === 0) { sign.position.set(U.rand(-w*0.3, w*0.3), signY, -d2/2 - 0.12); sign.rotation.y = Math.PI; }
                        else if (side === 1) { sign.position.set(U.rand(-w*0.3, w*0.3), signY, d2/2 + 0.12); }
                        else if (side === 2) { sign.position.set(-w/2 - 0.12, signY, U.rand(-d2*0.3, d2*0.3)); sign.rotation.y = -Math.PI/2; }
                        else { sign.position.set(w/2 + 0.12, signY, U.rand(-d2*0.3, d2*0.3)); sign.rotation.y = Math.PI/2; }
                        group.add(sign);
                    }
                }

                group.position.set(x, 0, z);
                scene.add(group);
                addBCollider(x,z,Math.max(w,d2)/2+1,h,'建筑');
            }
        });
    }

    function buildTrees() {
        const trunkGeo = new THREE.CylinderGeometry(0.12,0.18,1.5,5);
        const trunkMat = new THREE.MeshStandardMaterial({color:0x553322});
        const leafMat = new THREE.MeshStandardMaterial({
            color:0x337733,
            side:THREE.DoubleSide,
            transparent:true,
            alphaTest:0.5
        });
        const leafGeo = new THREE.PlaneGeometry(2.2,2.8);
        const texCv = document.createElement('canvas');
        texCv.width=texCv.height=64;
        const ctx=texCv.getContext('2d');
        ctx.fillStyle='rgba(0,0,0,0)';
        ctx.fillRect(0,0,64,64);
        ctx.fillStyle='#337733';
        ctx.beginPath();
        ctx.arc(32,32,24,0,Math.PI*2);
        ctx.fill();
        ctx.globalCompositeOperation='destination-out';
        for(let i=0;i<15;i++){ ctx.beginPath(); ctx.arc(U.rand(0,64),U.rand(0,64),U.rand(3,8),0,Math.PI*2); ctx.fill(); }
        const leafTex = new THREE.CanvasTexture(texCv);
        leafMat.map = leafTex;

        const trunkInst = new THREE.InstancedMesh(trunkGeo, trunkMat, 100);
        const leafInst = new THREE.InstancedMesh(leafGeo, leafMat, 100);
        trunkInst.castShadow=true; leafInst.castShadow=true;
        const dummy = new THREE.Object3D();
        let tIdx=0, lIdx=0;
        for(let i=0; i<100; i++){
            const x=U.rand(-300,300), z=U.rand(-300,300);
            if(Math.abs(x+100)<50 || U.dist2D(x,z,-250,-50)>60) continue;
            const h=getTerrainH(x,z);
            dummy.position.set(x, h+0.75, z);
            dummy.scale.setScalar(U.rand(0.7,1.5));
            dummy.updateMatrix();
            trunkInst.setMatrixAt(tIdx++, dummy.matrix);
            dummy.position.y = h+2.0;
            dummy.rotation.y = Math.random()*Math.PI;
            dummy.scale.setScalar(1);
            dummy.updateMatrix();
            leafInst.setMatrixAt(lIdx++, dummy.matrix);
        }
        trunkInst.count = tIdx; leafInst.count = lIdx;
        trunkInst.instanceMatrix.needsUpdate = true;
        leafInst.instanceMatrix.needsUpdate = true;
        scene.add(trunkInst);
        scene.add(leafInst);
    }

    // ===== 街道灯光系统（杆+灯+地面光池） — Neon City 风格 =====
    function buildStreetLights() {
        // 道路数组（与 buildRoads 对齐）
        const roadStrips = [
            {x: 0,  z: 0,   w: 20, l: 600, rot: 0},
            {x: 50, z: 0,   w: 18, l: 500, rot: Math.PI/2},
            {x:-50, z: 0,   w: 14, l: 500, rot: Math.PI/2},
            {x: 0,  z:-30,  w: 14, l: 400, rot: 0},
            {x: 0,  z: 60,  w: 14, l: 350, rot: 0}
        ];

        // 灯杆：金属杆
        const poleGeo = new THREE.CylinderGeometry(0.09, 0.13, 5.5, 6);
        const poleMat = new THREE.MeshStandardMaterial({
            color: 0x2a3040, roughness: 0.5, metalness: 0.85, envMapIntensity: 1.4
        });
        // 灯泡：暖色发光
        const bulbGeo = new THREE.SphereGeometry(0.32, 10, 10);
        const bulbMat = new THREE.MeshStandardMaterial({
            color: 0x111108, emissive: 0xffd9a0, emissiveIntensity: 3.5
        });
        // 灯罩：环
        const shadeGeo = new THREE.SphereGeometry(0.5, 10, 8, 0, Math.PI*2, 0, Math.PI/2);
        const shadeMat = new THREE.MeshStandardMaterial({
            color: 0x1a1a22, roughness: 0.6, metalness: 0.4, side: THREE.DoubleSide
        });
        // 地面光池（additive blending 圆盘）
        const poolGeo = new THREE.CircleGeometry(4.5, 20);
        const poolMat = new THREE.MeshBasicMaterial({
            color: 0xffca7a, transparent: true, opacity: 0.12,
            blending: THREE.AdditiveBlending, depthWrite: false
        });
        // 灯杆顶端横臂
        const armGeo = new THREE.BoxGeometry(1.2, 0.08, 0.08);
        const armMat = new THREE.MeshStandardMaterial({
            color: 0x2a3040, roughness: 0.5, metalness: 0.85
        });

        const poles = [], bulbs = [], pools = [], arms = [], shades = [];
        const dummy = new THREE.Object3D();
        const armDummy = new THREE.Object3D();

        roadStrips.forEach(r => {
            const along = r.l;           // 道路长度
            const half = along / 2;
            const step = 18;             // 路灯间隔
            const isVert = Math.abs(r.rot) > 0.1;
            for (let t = -half + 4; t <= half - 4; t += step) {
                // 在道路两侧各放一根
                for (const side of [-1, 1]) {
                    // 50% 概率生成（避免过密）
                    if (Math.random() < 0.5) continue;

                    let px, pz;
                    if (isVert) {
                        px = r.x + side * (r.w / 2 + 0.8);
                        pz = t;
                    } else {
                        px = t;
                        pz = r.z + side * (r.w / 2 + 0.8);
                    }
                    // 限制在地图内
                    if (Math.abs(px) > 380 || Math.abs(pz) > 380) continue;

                    // 杆
                    poles.push([px, 0, pz]);
                    // 灯泡
                    bulbs.push([px, 5.6, pz]);
                    // 光池
                    pools.push([px, 0.05, pz]);
                    // 横臂
                    arms.push([px, 5.4, pz]);
                    // 灯罩
                    shades.push([px, 5.55, pz]);
                }
            }
        });

        const pInst = new THREE.InstancedMesh(poleGeo, poleMat, poles.length);
        poles.forEach((p, i) => {
            dummy.position.set(p[0], 2.75, p[2]);
            dummy.rotation.set(0, 0, 0);
            dummy.scale.set(1, 1, 1);
            dummy.updateMatrix();
            pInst.setMatrixAt(i, dummy.matrix);
        });
        scene.add(pInst);

        const blInst = new THREE.InstancedMesh(bulbGeo, bulbMat, bulbs.length);
        bulbs.forEach((b, i) => {
            dummy.position.set(b[0], b[1], b[2]);
            dummy.updateMatrix();
            blInst.setMatrixAt(i, dummy.matrix);
        });
        scene.add(blInst);
        window._bulbInst = blInst;
        window._bulbCount = bulbs.length;

        const shInst = new THREE.InstancedMesh(shadeGeo, shadeMat, shades.length);
        shades.forEach((s, i) => {
            dummy.position.set(s[0], s[1], s[2]);
            dummy.updateMatrix();
            shInst.setMatrixAt(i, dummy.matrix);
        });
        scene.add(shInst);

        const armInst = new THREE.InstancedMesh(armGeo, armMat, arms.length);
        arms.forEach((a, i) => {
            dummy.position.set(a[0], a[1], a[2]);
            dummy.rotation.set(0, 0, Math.PI / 2);
            dummy.updateMatrix();
            armInst.setMatrixAt(i, dummy.matrix);
        });
        scene.add(armInst);

        const poInst = new THREE.InstancedMesh(poolGeo, poolMat, pools.length);
        pools.forEach((p, i) => {
            dummy.position.set(p[0], p[1], p[2]);
            dummy.rotation.set(-Math.PI / 2, 0, 0);
            dummy.updateMatrix();
            poInst.setMatrixAt(i, dummy.matrix);
        });
        scene.add(poInst);
    }

    function createVehicle(type,x,z,rotY) {
        const vt = vehicleTypes[type];
        const g = new THREE.Group();
        const bw=2, bh=(type==='suv'?1.6:1.3), bl=4.5;
        const bodyMat = new THREE.MeshPhysicalMaterial({
            color: vt.color,
            metalness: 0.7,
            roughness: 0.25,
            clearcoat: 1.0,
            clearcoatRoughness: 0.03,
            iridescence: 0.4,        // v6.1: GTA5 虹彩车漆
            iridescenceIOR: 1.3,
            envMapIntensity: 1.5
        });
        const body = new THREE.Mesh(new THREE.BoxGeometry(bw,bh,bl), bodyMat);
        body.position.y = bh/2+0.4;
        body.castShadow = true;
        g.add(body);
        const cabinMat = new THREE.MeshPhysicalMaterial({
            color: vt.color,
            metalness: 0.5,
            roughness: 0.4,
            transparent: true,
            opacity: 0.6
        });
        const cw=bw*0.85, ch=bh*0.6, cl=bl*0.5;
        const cabin = new THREE.Mesh(new THREE.BoxGeometry(cw,ch,cl), cabinMat);
        cabin.position.set(0, bh+ch/2+0.4, -bl*0.1);
        cabin.castShadow = true;
        g.add(cabin);
        const wheelGeo = new THREE.CylinderGeometry(0.35,0.35,0.25,12);
        wheelGeo.rotateZ(Math.PI/2);
        const wheelMat = new THREE.MeshStandardMaterial({color:0x111111, roughness:0.8});
        const wPos = [[bw/2+0.1,0.35,bl*0.35],[-bw/2-0.1,0.35,bl*0.35],
                      [bw/2+0.1,0.35,-bl*0.35],[-bw/2-0.1,0.35,-bl*0.35]];
        const wheels = [];
        wPos.forEach(wp=>{
            const w = new THREE.Mesh(wheelGeo, wheelMat);
            w.position.set(wp[0], wp[1], wp[2]);
            g.add(w);
            wheels.push(w);
        });
        let sirenL = null;
        if(vt.siren) {
            sirenL = [];
            [0xff0000,0x0000ff].forEach((c,i)=>{
                const l = new THREE.Mesh(new THREE.SphereGeometry(0.15,8,8), new THREE.MeshBasicMaterial({color:c}));
                l.position.set((i-0.5)*0.5, bh+ch+0.6, -bl*0.1);
                g.add(l);
                sirenL.push(l);
            });
        }

        // 车头灯（双灯光锥，cone mesh + additive blending 假体积光）
        const headlightMat = new THREE.MeshStandardMaterial({
            color: 0x222211, emissive: 0xfff2cc, emissiveIntensity: 3.2,
            roughness: 0.3
        });
        [-0.55, 0.55].forEach(sx => {
            const hl = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.15, 0.08), headlightMat);
            hl.position.set(sx, bh/2+0.45, -bl/2 - 0.04);
            g.add(hl);
            // 灯光锥
            const coneMat = new THREE.MeshBasicMaterial({
                color: 0xfff3cf, transparent: true, opacity: 0.08,
                blending: THREE.AdditiveBlending, depthWrite: false
            });
            const cone = new THREE.Mesh(new THREE.ConeGeometry(2.2, 9, 16, 1, true), coneMat);
            cone.rotation.x = Math.PI/2;
            cone.position.set(sx, bh/2+0.3, -bl/2 - 5);
            g.add(cone);
        });

        // 车尾灯（红色横条 + 刹车时更亮）
        const tailMat = new THREE.MeshStandardMaterial({
            color: 0x220000, emissive: 0xff1133, emissiveIntensity: 2.5,
            roughness: 0.4
        });
        const tailLight = new THREE.Mesh(new THREE.BoxGeometry(bw*0.85, 0.12, 0.06), tailMat);
        tailLight.position.set(0, bh/2+0.45, bl/2 + 0.04);
        g.add(tailLight);

        // 车底氛围灯（点光源）
        const underGlow = new THREE.PointLight(vt.color, 0.8, 5);
        underGlow.position.y = 0.3;
        g.add(underGlow);

        g.position.set(x, getTerrainH(x,z), z);
        g.rotation.y = rotY;
        scene.add(g);
        const v = {
            mesh:g, type, config:vt,
            speed:0, health:vt.health, maxHealth:vt.health,
            wheels, sirenL, sirenActive:false,
            headlightMat, tailMat, tailLight, underGlow,
            isPlayerVehicle:false, bodyW:bw, bodyL:bl
        };
        vehicles.push(v);
        return v;
    }

    function emitParticles(pos, count, color) {
        let emitted=0;
        for(const p of particles){
            if(p.visible) continue;
            p.mesh.position.copy(pos);
            p.vel.set(U.rand(-5,5), U.rand(2,8), U.rand(-5,5));
            p.life = U.rand(0.5,1.5);
            p.maxLife = p.life;
            p.mesh.material.color.setHex(color||0xffaa00);
            p.mesh.scale.setScalar(U.rand(0.5,1.5));
            p.visible = true;
            emitted++;
            if(emitted>=count) break;
        }
    }

    function updateParticles(dt) {
        for(const p of particles){
            if(!p.visible) continue;
            p.life -= dt;
            if(p.life<=0){ p.visible=false; continue; }
            p.vel.y -= 15*dt;
            p.mesh.position.addScaledVector(p.vel, dt);
            const s = p.life / p.maxLife;
            p.mesh.material.opacity = s;
            p.mesh.scale.setScalar(s*1.5);
        }
    }

    function updatePlayer(dt) {
        if(player.isDead||player.isBusted||gamePaused) return;
        if(!player.inVehicle){
            let mx=0,mz=0;
            if(keys['w']||keys['arrowup']) mz-=1;
            if(keys['s']||keys['arrowdown']) mz+=1;
            if(keys['a']||keys['arrowleft']) mx-=1;
            if(keys['d']||keys['arrowright']) mx+=1;
            const moving = mx!==0||mz!==0;
            const running = keys['shift'] && player.energy>0;
            const spd = running ? 8 : 4.5;
            if(moving){
                const sy=Math.sin(player.yaw), cy=Math.cos(player.yaw);
                const dx=mx*cy + mz*sy, dz=-mx*sy + mz*cy;
                const len=Math.sqrt(dx*dx+dz*dz);
                if(len>0){
                    const mx2=dx/len*spd*dt, mz2=dz/len*spd*dt;
                    if(!checkBCollision(player.pos.x+mx2, player.pos.z, player.radius))
                        player.pos.x += mx2;
                    if(!checkBCollision(player.pos.x, player.pos.z+mz2, player.radius))
                        player.pos.z += mz2;
                }
                if(running) player.energy = Math.max(0, player.energy - dt*15);
            } else {
                player.energy = Math.min(player.maxEnergy, player.energy + dt*8);
            }
            player.vel.y -= 25*dt;
            player.pos.y += player.vel.y * dt;
            const gy = getTerrainH(player.pos.x, player.pos.z);
            if(player.pos.y <= gy){
                player.pos.y = gy;
                player.vel.y = 0;
                player.onGround = true;
            } else player.onGround = false;
            if(keys[' '] && player.onGround){
                player.vel.y = 9;
                player.onGround = false;
            }
        } else {
            const v = player.inVehicle;
            let th=0, br=0, st=0;
            if(keys['w']||keys['arrowup']) th=1;
            if(keys['s']||keys['arrowdown']) br=1;
            if(keys['a']||keys['arrowleft']) st=1;
            if(keys['d']||keys['arrowright']) st=-1;
            if(th>0) v.speed += v.config.accel*dt*th;
            else if(br>0){
                if(v.speed>0) v.speed -= v.config.brake*dt*br;
                else v.speed -= v.config.accel*0.5*dt*br;
            } else v.speed *= Math.pow(0.95, dt*60);
            v.speed = U.clamp(v.speed, -v.config.speed*0.4, v.config.speed);
            const sr=Math.abs(v.speed)/v.config.speed;
            const tf=sr>0.1?1:sr*10;
            v.mesh.rotation.y += st * v.config.turn * dt * tf * Math.sign(v.speed||1);
            const fwd = new THREE.Vector3(Math.sin(v.mesh.rotation.y),0,Math.cos(v.mesh.rotation.y));
            const nx = v.mesh.position.x + fwd.x*v.speed*dt;
            const nz = v.mesh.position.z + fwd.z*v.speed*dt;
            const col = checkBCollision(nx, nz, v.bodyL/2);
            if(!col){
                v.mesh.position.x = nx;
                v.mesh.position.z = nz;
            } else {
                if(Math.abs(v.speed)>5){
                    damageVehicle(v, Math.abs(v.speed)*0.3);
                    takeDamage(Math.abs(v.speed)*0.06, 'crash');
                    AudioSys.playExplosion();
                    emitParticles(v.mesh.position.clone().add(new THREE.Vector3(0,1,0)), 10, 0xff6600);
                }
                v.speed *= -0.3;
            }
            v.mesh.position.y = getTerrainH(v.mesh.position.x, v.mesh.position.z);
            const wr = v.speed*dt/0.35;
            v.wheels.forEach(w=> w.rotation.x += wr);
            if(v.sirenL && v.sirenActive){
                const t=performance.now()*0.008;
                v.sirenL[0].material.color.setHSL(Math.sin(t)>0?0:0.66,1,0.5);
                v.sirenL[1].material.color.setHSL(Math.sin(t)>0?0.66:0,1,0.5);
            }
            if(v.health<=0){
                explodeVehicle(v);
                exitVehicle();
                player.isDead=true;
                setTimeout(()=>showDeath(),1500);
            }
            updateVehicleHUD();
        }
        player.pos.x = U.clamp(player.pos.x, -380, 380);
        player.pos.z = U.clamp(player.pos.z, -380, 380);
        if(player.pos.y < -1.5) takeDamage(5*dt, 'drown');

        pickups.forEach((p,i)=>{
            if(U.dist2D(player.pos.x, player.pos.z, p.mesh.position.x, p.mesh.position.z) < 1.2)
                collectPickup(p,i);
        });
        glowObjs.forEach((g,i)=>{
            if(!g.collected && U.dist2D(player.pos.x,player.pos.z,g.x,g.z)<1){
                g.collected=true;
                scene.remove(g.mesh);
                const r=Math.random();
                let reward=5, name='废铁';
                if(r>0.8){ reward=15; name='净水片'; }
                else if(r>0.5){ reward=10; name='电子零件'; }
                player.money += reward;
                flashMoney();
                AudioSys.playPickup();
                showNotif('拾取了'+name+' +$'+reward);
                glowObjs.splice(i,1);
            }
        });
        updateVehicleInteraction();
        checkMission();
    }

    function collectPickup(p,idx) {
        switch(p.type){
            case 'health': player.health=Math.min(player.maxHealth, player.health+25); showNotif('恢复生命 +25'); break;
            case 'armor': player.armor=Math.min(player.maxArmor, player.armor+50); showNotif('获得护甲 +50'); break;
            case 'money': player.money+=100; showNotif('获得 $100'); flashMoney(); break;
        }
        AudioSys.playPickup();
        scene.remove(p.mesh);
        pickups.splice(idx,1);
    }

    function updateVehicleInteraction() {
        let nearest=null, nd=3.5;
        vehicles.forEach(v=>{
            if(v.health<=0) return;
            const d=U.dist2D(player.pos.x, player.pos.z, v.mesh.position.x, v.mesh.position.z);
            if(d<nd){ nearest=v; nd=d; }
        });
        if(nearest && !player.inVehicle){
            showInteractHint('F 进入 '+nearest.config.name);
            if(keys['f']){ enterVehicle(nearest); keys['f']=false; }
        } else if(player.inVehicle){
            if(keys['f']){ exitVehicle(); keys['f']=false; }
        } else if(U.dist2D(player.pos.x,player.pos.z,0,0)<5){
            showInteractHint('E 军火店');
            if(keys['e']){ openShop(); keys['e']=false; }
        } else hideInteractHint();
    }

    function enterVehicle(v) {
        player.inVehicle = v;
        v.isPlayerVehicle = true;
        AudioSys.startEngine();
        showNotif('进入 '+v.config.name);
        document.getElementById('vehicleHud').classList.add('show');
        AudioSys.startRadio(0);
        document.getElementById('radioDisp').classList.add('show');
    }

    function exitVehicle() {
        if(!player.inVehicle) return;
        const v=player.inVehicle;
        const ex=v.mesh.position.x + Math.cos(v.mesh.rotation.y+Math.PI/2)*2;
        const ez=v.mesh.position.z + Math.sin(v.mesh.rotation.y+Math.PI/2)*2;
        player.pos.set(ex, getTerrainH(ex,ez)+0.5, ez);
        v.isPlayerVehicle=false;
        player.inVehicle=null;
        AudioSys.stopEngine();
        AudioSys.stopRadio();
        document.getElementById('vehicleHud').classList.remove('show');
        document.getElementById('radioDisp').classList.remove('show');
        showNotif('离开载具');
    }

    function damageVehicle(v, amt) { v.health = Math.max(0, v.health-amt); }

    function explodeVehicle(v) {
        if(v._exploded) return;
        v._exploded=true;
        AudioSys.playExplosion();
        emitParticles(v.mesh.position.clone().add(new THREE.Vector3(0,1,0)), 30, 0xff6600);
        v.mesh.children.forEach(c=>{
            if(c.material && c.material.color) c.material.color.setHex(0x333333);
        });
        setTimeout(()=>{
            scene.remove(v.mesh);
            v.mesh.traverse(o=>{ if(o.geometry) o.geometry.dispose(); if(o.material) o.material.dispose(); });
        }, 2000);
        const ex=v.mesh.position.x, ez=v.mesh.position.z;
        npcs.forEach(n=>{
            if(n.health<=0) return;
            const d=U.dist2D(n.mesh.position.x,n.mesh.position.z,ex,ez);
            if(d<15) damageNPC(n, 100*(1-d/15));
        });
        vehicles.forEach(ov=>{
            if(ov!==v && ov.health>0 && !ov._exploded){
                const d=U.dist2D(ov.mesh.position.x,ov.mesh.position.z,ex,ez);
                if(d<10){ damageVehicle(ov,50); if(ov.health<=0) setTimeout(()=>explodeVehicle(ov),300); }
            }
        });
        const idx=vehicles.indexOf(v);
        if(idx>-1) vehicles.splice(idx,1);
        if(v.isPlayerVehicle) increaseWanted(2);
    }

    // ===== 战斗 =====
    function shoot() {
        if(player.isDead||gamePaused||isReloading) return;
        const now=performance.now(), w=weapons[curWeapon];
        if(now-lastFireTime<w.fireRate) return;
        if(w.isGrenade){ throwGrenade(); return; }
        if(w.isRocket){ fireRocket(); return; }
        if(w.ammo<=0 && w.magSize!==Infinity){ reload(); return; }
        if(w.magAmmo<=0 && w.magSize!==Infinity){ reload(); return; }
        lastFireTime=now;
        if(w.magSize!==Infinity){ w.magAmmo--; w.ammo--; }
        AudioSys.playGunshot(w.slot==='shotgun'?'shotgun':w.slot==='smg'?'smg':w.slot==='rifle'?'rifle':'pistol');
        const dir = new THREE.Vector3(-Math.sin(player.yaw)*Math.cos(player.pitch),
                                     Math.sin(player.pitch),
                                     -Math.cos(player.yaw)*Math.cos(player.pitch));
        for(let b=0; b<w.bullets; b++){
            const d=dir.clone();
            const sp=w.spread*(player.inVehicle?1.5:1);
            d.x += (Math.random()-0.5)*sp;
            d.y += (Math.random()-0.5)*sp;
            d.z += (Math.random()-0.5)*sp;
            d.normalize();
            let closestNPC=null, closestDist=w.range;
            const origin = player.pos.clone();
            origin.y += player.height*0.7;
            if(player.inVehicle){ origin.copy(player.inVehicle.mesh.position); origin.y+=1.5; }
            npcs.forEach(n=>{
                if(n.health<=0) return;
                const toN = new THREE.Vector3().subVectors(n.mesh.position, origin);
                const proj = toN.dot(d);
                if(proj<0 || proj>closestDist) return;
                const perp = toN.clone().addScaledVector(d, -proj);
                if(perp.length()<0.8 && proj<closestDist){
                    closestDist=proj; closestNPC=n;
                }
            });
            if(closestNPC) damageNPC(closestNPC, w.damage);
        }
        player.pitch -= 0.01*(w.damage/10);
        player.pitch = U.clamp(player.pitch, -1.4, 1.4);
        if(w.magSize!==Infinity && w.magAmmo<=0 && w.ammo>0) reload();
        if(w.damage>=10){
            let witnessed=false;
            npcs.forEach(n=>{ if(n.isPolice && n.health>0 && U.dist2D(player.pos.x,player.pos.z,n.mesh.position.x,n.mesh.position.z)<50) witnessed=true; });
            increaseWanted(witnessed?0.5:0.2);
        }
        updateWeaponHUD();
    }

    function reload() {
        if(isReloading) return;
        const w=weapons[curWeapon];
        if(w.magSize===Infinity || w.ammo<=0 || w.magAmmo>=w.magSize) return;
        isReloading=true;
        showNotif('换弹中...');
        setTimeout(()=>{
            const need = w.magSize - w.magAmmo;
            const av = Math.min(need, w.ammo);
            w.magAmmo += av;
            w.ammo -= av;
            isReloading=false;
            updateWeaponHUD();
        }, 1500);
    }

    function switchWeapon(idx) {
        if(idx<0||idx>=weapons.length) return;
        curWeapon=idx;
        isReloading=false;
        updateWeaponHUD();
    }

    function throwGrenade() {
        const w=weapons[curWeapon];
        if(w.ammo<=0) return;
        w.ammo--;
        const dir = new THREE.Vector3(-Math.sin(player.yaw), 0.3, -Math.cos(player.yaw)).normalize();
        projectiles.push({
            pos: player.pos.clone().add(new THREE.Vector3(0,1.5,0)),
            vel: dir.multiplyScalar(15),
            timer:3
        });
        lastFireTime=performance.now();
        updateWeaponHUD();
    }

    function fireRocket() {
        const w=weapons[curWeapon];
        if(w.ammo<=0) return;
        w.ammo--;
        const dir = new THREE.Vector3(-Math.sin(player.yaw)*Math.cos(player.pitch),
                                     Math.sin(player.pitch),
                                     -Math.cos(player.yaw)*Math.cos(player.pitch));
        projectiles.push({
            pos: player.pos.clone().add(new THREE.Vector3(0,1.5,0)),
            vel: dir.multiplyScalar(80),
            isRocket:true,
            life:3
        });
        AudioSys.playGunshot('rocket');
        lastFireTime=performance.now();
        increaseWanted(1);
        updateWeaponHUD();
    }

    function updateProjectiles(dt) {
        for(let i=projectiles.length-1; i>=0; i--){
            const p=projectiles[i];
            if(p.isRocket){
                p.pos.addScaledVector(p.vel, dt);
                p.life -= dt;
                let hit=false;
                npcs.forEach(n=>{ if(n.health>0 && U.dist2D(p.pos.x,p.pos.z,n.mesh.position.x,n.mesh.position.z)<1){ damageNPC(n,100); hit=true; } });
                buildings.forEach(b=>{ if(U.dist2D(p.pos.x,p.pos.z,b.x,b.z)<b.radius) hit=true; });
                if(hit || p.life<=0){
                    createExplosion(p.pos.x, p.pos.z, 200);
                    projectiles.splice(i,1);
                }
            } else {
                p.vel.y -= 25*dt;
                p.pos.addScaledVector(p.vel, dt);
                const gh=getTerrainH(p.pos.x, p.pos.z);
                if(p.pos.y <= gh){
                    p.pos.y=gh; p.vel.y*=-0.3; p.vel.x*=0.8; p.vel.z*=0.8;
                }
                p.timer -= dt;
                if(p.timer<=0){
                    createExplosion(p.pos.x, p.pos.z, 100);
                    projectiles.splice(i,1);
                }
            }
        }
    }

    function createExplosion(x,z,dmg) {
        AudioSys.playExplosion();
        emitParticles(new THREE.Vector3(x,1,z), 30, 0xff6600);
        npcs.forEach(n=>{
            if(n.health<=0) return;
            const d=U.dist2D(n.mesh.position.x,n.mesh.position.z,x,z);
            if(d<12) damageNPC(n, dmg*(1-d/12));
        });
        const pd=U.dist2D(player.pos.x,player.pos.z,x,z);
        if(pd<12) takeDamage(dmg*0.5*(1-pd/12), 'explosion');
        vehicles.forEach(v=>{
            if(v.health>0){
                const d=U.dist2D(v.mesh.position.x,v.mesh.position.z,x,z);
                if(d<15){ damageVehicle(v, dmg*(1-d/15)); if(v.health<=0) setTimeout(()=>explodeVehicle(v),200); }
            }
        });
        increaseWanted(1.5);
    }

    // ===== NPC AI =====
    function updateNPCs(dt) {
        const pp=player.pos;
        npcs.forEach(n=>{
            if(n.health<=0) return;
            const dist=U.dist2D(n.mesh.position.x,n.mesh.position.z,pp.x,pp.z);
            if(dist>200) return;
            if(n.stateCooldown>0) n.stateCooldown-=dt;
            if(dist>80 && Math.random()>0.2) return;
            n.stateTimer-=dt;
            const canSee = dist<40;
            switch(n.state){
                case 'idle':
                    if(n.stateTimer<=0){
                        if(Math.random()<0.6){
                            n.state='walk';
                            const a=Math.random()*Math.PI*2, d=U.rand(5,20);
                            n.target.set(n.mesh.position.x+Math.cos(a)*d, 0, n.mesh.position.z+Math.sin(a)*d);
                        }
                        n.stateTimer=U.rand(2,6);
                    }
                    if(canSee && player.wantedLevel>0 && n.stateCooldown<=0){
                        if(n.isPolice){ n.state='chase'; n.stateCooldown=2; }
                        else if(n.isGang){ n.state='fight'; n.stateCooldown=2; }
                        else { n.state='flee'; n.stateCooldown=2;
                              const dx=n.mesh.position.x-pp.x, dz=n.mesh.position.z-pp.z, l=Math.sqrt(dx*dx+dz*dz)||1;
                              n.target.set(n.mesh.position.x+dx/l*30, 0, n.mesh.position.z+dz/l*30); }
                    }
                    break;
                case 'walk':
                    moveNPC(n,dt);
                    if(U.dist2D(n.mesh.position.x,n.mesh.position.z,n.target.x,n.target.z)<1){
                        n.state='idle'; n.stateTimer=U.rand(1,4);
                    }
                    if(canSee && player.wantedLevel>1 && n.stateCooldown<=0){
                        if(n.isPolice){ n.state='chase'; n.stateCooldown=2; }
                        else { n.state='flee'; n.stateCooldown=2;
                              const dx=n.mesh.position.x-pp.x, dz=n.mesh.position.z-pp.z, l=Math.sqrt(dx*dx+dz*dz)||1;
                              n.target.set(n.mesh.position.x+dx/l*30, 0, n.mesh.position.z+dz/l*30); }
                    }
                    break;
                case 'flee':
                    moveNPC(n,dt,1.5);
                    if(U.dist2D(n.mesh.position.x,n.mesh.position.z,pp.x,pp.z)>60 && n.stateCooldown<=0){
                        n.state='idle'; n.stateTimer=3; n.stateCooldown=2;
                    }
                    break;
                case 'chase':
                    n.target.copy(pp);
                    moveNPC(n,dt,1.2);
                    if(dist<15){
                        const now=performance.now();
                        if(now-n.lastShot>800 && n.weapon){
                            n.lastShot=now;
                            if(Math.random()<0.3*(15-dist)/15) takeDamage(U.rand(5,12), 'police');
                            AudioSys.playGunshot('pistol');
                        }
                    }
                    if(dist<2 && player.wantedLevel<=2){ player.isBusted=true; showBusted(); }
                    break;
                case 'fight':
                    n.target.copy(pp);
                    moveNPC(n,dt,0.8);
                    if(dist<20){
                        const now=performance.now();
                        if(now-n.lastShot>1500){
                            n.lastShot=now;
                            if(Math.random()<0.2) takeDamage(U.rand(3,8), 'gang');
                        }
                    }
                    break;
            }
            n.mesh.position.y = getTerrainH(n.mesh.position.x, n.mesh.position.z);
            if(n.greetingCooldown>0) n.greetingCooldown-=dt;
            if(!n.isPolice && !n.isGang && dist<5 && n.greetingCooldown<=0 && n.health>0 && player.wantedLevel===0){
                const ph=n.greetings[Math.floor(Math.random()*n.greetings.length)];
                showNotif(n.name+'：'+ph);
                n.greetingCooldown=30;
            }
        });
    }

    function moveNPC(n,dt,mul) {
        mul=mul||1;
        const dx=n.target.x-n.mesh.position.x, dz=n.target.z-n.mesh.position.z;
        const dist=Math.sqrt(dx*dx+dz*dz);
        if(dist<0.1) return;
        const spd=n.speed*mul;
        const mx2=dx/dist*spd*dt, mz2=dz/dist*spd*dt;
        if(!checkBCollision(n.mesh.position.x+mx2, n.mesh.position.z, 0.3)) n.mesh.position.x += mx2;
        if(!checkBCollision(n.mesh.position.x, n.mesh.position.z+mz2, 0.3)) n.mesh.position.z += mz2;
        n.yaw=Math.atan2(dx,dz);
        n.mesh.rotation.y=n.yaw;
    }

    function damageNPC(n, amt) {
        n.health -= amt;
        if(n.health<=0){
            n.health=0;
            n.mesh.rotation.x=-Math.PI/2;
            n.mesh.position.y-=0.5;
            emitParticles(n.mesh.position.clone().add(new THREE.Vector3(0,1,0)), 10, 0xff0000);
            if(amt>0 && !n._counted){
                n._counted=true;
                if(n.isPolice){ increaseWanted(1.5); player.money+=50; }
                else if(n.isGang){ increaseWanted(0.5); player.money+=30; }
                else { increaseWanted(1); player.money+=10; }
                flashMoney();
            }
        } else {
            if(!n.isPolice && !n.isGang && n.stateCooldown<=0){ n.state='flee'; n.stateCooldown=2; }
        }
    }

    function increaseWanted(amt) {
        if(player.wantedLevel>=6) return;
        const old=Math.floor(player.wantedLevel);
        player.wantedLevel = Math.min(6, player.wantedLevel+amt);
        const nw=Math.floor(player.wantedLevel);
        if(nw>old && nw>0){ showNotif('通缉等级提升！'+nw+'星'); flashWanted(); spawnPolice(); }
    }

    function spawnPolice() {
        const lvl=Math.floor(player.wantedLevel), cnt=lvl*2;
        for(let i=0; i<cnt; i++){
            const a=Math.random()*Math.PI*2, d=60+Math.random()*30;
            const x=player.pos.x+Math.cos(a)*d, z=player.pos.z+Math.sin(a)*d;
            const pc=npcs.filter(n=>n.isPolice && n.health>0).length;
            if(pc>=20) break;
            const n=createNPC({name:'警察',color:0x2244aa,beh:'police'}, x,z);
            n.state='chase';
        }
        if(lvl>=3){
            const a=Math.random()*Math.PI*2, d=80;
            const v=createVehicle('police', player.pos.x+Math.cos(a)*d, player.pos.z+Math.sin(a)*d, a+Math.PI);
            v.sirenActive=true;
        }
    }

    function updateWantedDecay(dt) {
        if(player.wantedLevel<=0) return;
        let witnessed=false;
        npcs.forEach(n=>{ if(n.isPolice && n.health>0 && U.dist2D(player.pos.x,player.pos.z,n.mesh.position.x,n.mesh.position.z)<40) witnessed=true; });
        if(!witnessed){
            player.wantedLevel = Math.max(0, player.wantedLevel - dt*0.05);
            updateWantedHUD();
        }
    }

    // ===== 伤害与 HUD =====
    function takeDamage(amt, src) {
        if(player.isDead||player.isBusted) return;
        if(player.armor>0){ const ab=Math.min(player.armor, amt*0.6); player.armor-=ab; amt-=ab; }
        player.health -= amt;
        showDmgFlash();
        player.stress = Math.min(player.maxStress, player.stress+amt*0.5);
        if(player.health<=0){ player.health=0; player.isDead=true; if(player.inVehicle) exitVehicle(); setTimeout(()=>showDeath(),1000); }
        updateHUD();
    }

    function showDmgFlash(){ const o=document.getElementById('dmgOverlay'); o.classList.add('show'); setTimeout(()=>o.classList.remove('show'),150); }

    function updateDayNight(dt) {
        gameTimeMin += dt*(10/60);
        if(gameTimeMin>1440) gameTimeMin-=1440;
        gameWeather = (gameWeather + dt*0.0006)%5;
        // 太阳角度：早晨东升、傍晚西落、夜晚地下
        const h = gameTimeMin/60;
        let elevDeg, azimDeg;
        if(h >= 6 && h < 18){
            // 白天：t=0(6点) 0° → t=1(12点) 60° → t=0(18点) 0°
            const t = (h-6)/12;
            elevDeg = Math.sin(t*Math.PI) * 70;   // 最高 70° 仰角
            azimDeg = 90 + t*180;                  // 从东 → 西
        } else {
            // 夜晚：太阳在地平线下
            elevDeg = -20;
            azimDeg = 270;
        }

        const sunPos = new THREE.Vector3();
        const phi = THREE.MathUtils.degToRad(90 - elevDeg);
        const theta = THREE.MathUtils.degToRad(azimDeg);
        sunPos.setFromSphericalCoords(1, phi, theta);

        // 同步自定义天空穹顶的太阳位置和颜色
        if(window._skyDome){
            const uni = window._skyDome.material.uniforms;
            uni.uSunDirection.value.copy(sunPos);

            const dayness = Math.max(0, Math.sin(phi));
            const df = U.clamp(dayness*1.4, 0, 1);
            uni.uDayness.value = df;

            // 太阳颜色：日出/日落偏暖，正午偏白
            const sunWarmth = Math.max(0, 1.0 - Math.abs(elevDeg - 35) / 35);
            const sunColor = new THREE.Color().setHSL(
                0.08 + sunWarmth * 0.04,
                0.3 + sunWarmth * 0.3,
                0.5 + df * 0.3
            );
            uni.uSunColor.value.copy(sunColor);

            // 地平线色调：日出/日落暖色，白天偏蓝
            const horizonHue = 0.55 + 0.05 * (1.0 - df);
            const horizonSat = 0.2 + 0.3 * (1.0 - df);
            const horizonLight = 0.5 + 0.4 * df;
            const horizonColor = new THREE.Color().setHSL(horizonHue, horizonSat, horizonLight);
            uni.uHorizonColor.value.copy(horizonColor);

            // 天顶色调：正午深蓝，夜晚接近黑色
            const zenithHue = 0.6 - 0.02 * df;
            const zenithSat = 0.3 + 0.3 * df;
            const zenithLight = 0.1 + 0.6 * df;
            const zenithColor = new THREE.Color().setHSL(zenithHue, zenithSat, zenithLight);
            uni.uZenithColor.value.copy(zenithColor);

            // 云量变化
            uni.uCloudCover.value = 0.3 + 0.4 * (0.5 + 0.5 * Math.sin(h * 0.3));
        }

        // 同步 sun 光源
        sun.position.copy(sunPos).multiplyScalar(150);

        const dayness = Math.max(0, Math.sin(phi));   // 0=夜 1=正午
        const df = U.clamp(dayness*1.4, 0, 1);

        // 光照强度随时间
        sun.intensity = 0.2 + df*3.0;
        sun.color.setHSL(0.10, 0.3+df*0.2, 0.5+df*0.3);
        ambient.intensity = 0.3 + df*0.5;
        ambient.color.setHSL(0.58, 0.2, 0.45+df*0.3);
        hemi.intensity = 0.3 + df*0.6;
        hemi.color.setHSL(0.58, 0.4, 0.55);
        if(window._fill) window._fill.intensity = 0.35 + df*0.4;
        if(window._rim) window._rim.intensity = 0.15 + df*0.35;

        // 雾色：使用 FogExp2 更自然的雾化
        if(df > 0.5){
            scene.fog.color.setHSL(0.58, 0.25, 0.7);
        } else if(df > 0.1){
            const t = df/0.5;
            scene.fog.color.setHSL(0.62, 0.35, U.lerp(0.12, 0.7, t));
        } else {
            scene.fog.color.setHSL(0.65, 0.5, 0.08);
        }

        // 曝光：白天 1.0~1.2，夜晚 0.5
        renderer.toneMappingExposure = 0.5 + df*0.7;

        document.getElementById('timeDisp').textContent = getTimeStr();
        document.getElementById('weatherDisp').textContent = weatherIcons[Math.floor(gameWeather)]+' '+weatherNames[Math.floor(gameWeather)];
    }

    function drawRadar() {
        const cv=document.getElementById('radarCv');
        const ctx=cv.getContext('2d');
        const w=cv.width,h=cv.height,cx=w/2,cy=h/2,r=65;
        ctx.clearRect(0,0,w,h);
        ctx.fillStyle='rgba(0,20,40,0.8)';
        ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
        ctx.strokeStyle='rgba(0,100,150,0.2)'; ctx.lineWidth=1;
        for(let i=1;i<=3;i++){ ctx.beginPath(); ctx.arc(cx,cy,r/3*i,0,Math.PI*2); ctx.stroke(); }
        const scale=r/120;
        const yaw=player.yaw;
        function w2r(wx,wz){
            const dx=wx-player.pos.x, dz=wz-player.pos.z;
            const rx=dx*Math.cos(-yaw)-dz*Math.sin(-yaw);
            const rz=dx*Math.sin(-yaw)+dz*Math.cos(-yaw);
            return [cx+rx*scale, cy-rz*scale];
        }
        Object.values(landmarks).forEach(lm=>{
            const [x,y]=w2r(lm.x,lm.z);
            if(Math.hypot(x-cx,y-cy)<r-3){
                ctx.fillStyle='#ffd700';
                ctx.beginPath(); ctx.arc(x,y,2.5,0,Math.PI*2); ctx.fill();
            }
        });
        npcs.forEach(n=>{
            if(n.health<=0) return;
            const [x,y]=w2r(n.mesh.position.x,n.mesh.position.z);
            if(Math.hypot(x-cx,y-cy)<r-2){
                ctx.fillStyle=n.isPolice?'#4488ff':(n.isGang?'#ff4444':'#88aa88');
                ctx.beginPath(); ctx.arc(x,y,1.5,0,Math.PI*2); ctx.fill();
            }
        });
        vehicles.forEach(v=>{
            if(v.health<=0) return;
            const [x,y]=w2r(v.mesh.position.x,v.mesh.position.z);
            if(Math.hypot(x-cx,y-cy)<r-2){
                ctx.fillStyle=v.config.siren?'#ff4444':'#aaaacc';
                ctx.fillRect(x-2,y-1,4,2);
            }
        });
        ctx.fillStyle='#ff6b35';
        ctx.beginPath();
        ctx.moveTo(cx,cy-5);
        ctx.lineTo(cx-3,cy+3);
        ctx.lineTo(cx+3,cy+3);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle='rgba(255,215,0,0.2)'; ctx.lineWidth=1.5;
        ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.stroke();
    }

    function initTouch() {
        const jl=document.getElementById('joyL'), knob=document.getElementById('joyKnob');
        const tv=document.getElementById('touchView');
        let jId=null, jStartX=0, jStartY=0, jActive=false;
        let vId=null, vStartX=0, vStartY=0, vBaseYaw=0, vBasePitch=0, vActive=false;

        // 全局兜底：在 .touch-ctrl 任何空白处（除按钮和摇杆外）滑动都转向
        const ctrl=document.getElementById('touchCtrl');
        ctrl.addEventListener('touchstart', e=>{
            for(const t of e.changedTouches){
                // 跳过摇杆/按钮
                const tag=(t.target && t.target.closest) ? t.target.closest('.joy-l, .t-btn, #chat-input-row, #settings-pop, #chat-panel') : null;
                if(tag) continue;
                if(t.clientX < window.innerWidth*0.4) continue; // 左 40% 留给摇杆
                if(vId===null){
                    vId=t.identifier;
                    vStartX=t.clientX; vStartY=t.clientY;
                    vBaseYaw=player.yaw; vBasePitch=player.pitch;
                    vActive=true;
                }
            }
        }, {passive:true});

        ctrl.addEventListener('touchmove', e=>{
            for(const t of e.changedTouches){
                if(t.identifier===vId && vActive){
                    const dx=(t.clientX-vStartX)/window.innerWidth;
                    const dy=(t.clientY-vStartY)/window.innerHeight;
                    player.yaw   = vBaseYaw   - dx*Math.PI*1.4;
                    player.pitch = U.clamp(vBasePitch - dy*Math.PI*0.9, -1.4, 1.4);
                }
                if(t.identifier===jId && jActive){
                    const dx=(t.clientX-jStartX)/50, dy=(t.clientY-jStartY)/50;
                    keys['w']=dy<-0.3; keys['s']=dy>0.3; keys['a']=dx<-0.3; keys['d']=dx>0.3;
                    knob.style.transform=`translate(${U.clamp(dx*28,-28,28)}px,${U.clamp(dy*28,-28,28)}px) translate(-50%,-50%)`;
                }
            }
        }, {passive:true});

        const endTouch=(e)=>{
            for(const t of e.changedTouches){
                if(t.identifier===vId){ vId=null; vActive=false; }
                if(t.identifier===jId){
                    jId=null; jActive=false;
                    keys['w']=keys['s']=keys['a']=keys['d']=false;
                    knob.style.transform='translate(-50%,-50%)';
                }
            }
        };
        ctrl.addEventListener('touchend', endTouch, {passive:true});
        ctrl.addEventListener('touchcancel', endTouch, {passive:true});

        // 摇杆专用：touchstart 立即锁定
        jl.addEventListener('touchstart', e=>{
            e.preventDefault(); e.stopPropagation();
            const t=e.changedTouches[0];
            jId=t.identifier;
            jStartX=t.clientX; jStartY=t.clientY; jActive=true;
        }, {passive:false});

        // 按钮事件
        const bindBtn=(id, fn)=>{
            const el=document.getElementById(id);
            el.addEventListener('touchstart', e=>{ e.preventDefault(); e.stopPropagation(); fn(); }, {passive:false});
        };
        bindBtn('btnFire', ()=>shoot());
        bindBtn('btnJump', ()=>{ if(!player.inVehicle && player.onGround){ player.vel.y=9; player.onGround=false; } });
        bindBtn('btnReload', ()=>reload());
        bindBtn('btnInteract', ()=>handleInteract());
        bindBtn('btnVehicle', ()=>{ keys['f']=true; setTimeout(()=>keys['f']=false, 120); });
    }

    function handleInteract() {
        if(U.dist2D(player.pos.x,player.pos.z,0,0)<5){ openShop(); return; }

        else showNotif('附近没有可交互的NPC');
    }
