    // ===== 引擎初始化 =====
    function initEngine() {
        scene = new THREE.Scene();
        // FogExp2 更自然的指数雾化，模仿大气散射效果
        scene.fog = new THREE.FogExp2(0x7a9ab8, 0.0055);

        camera = new THREE.PerspectiveCamera(62, window.innerWidth/window.innerHeight, 0.1, 2000);
        camera.position.set(0,5,10);

        renderer = new THREE.WebGLRenderer({
            antialias: !isMobile,
            powerPreference: 'high-performance',
            alpha: false,
            stencil: false,
            depth: true
        });
        renderer.setClearColor(0x0a0e14, 1.0);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.shadowMap.autoUpdate = true;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.15;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        document.body.appendChild(renderer.domElement);

        // ===== 自定义天空穹顶着色器（云/太阳光晕/星星/月亮/昼夜预设） =====
        // 参考 Cyberpunk Megapolis 的真实感天空方案，取代 Sky addon 提供更丰富的天空细节
        const skyDomeGeo = new THREE.SphereGeometry(100, 32, 16);
        const skyDomeMat = new THREE.ShaderMaterial({
            uniforms: {
                uDayness: { value: 0.85 },
                uSunDirection: { value: new THREE.Vector3(0.5, 0.8, -0.3) },
                uTime: { value: 0 },
                uSunColor: { value: new THREE.Color(1.0, 0.95, 0.8) },
                uHorizonColor: { value: new THREE.Color(0.8, 0.85, 0.9) },
                uZenithColor: { value: new THREE.Color(0.2, 0.5, 0.9) },
                uGroundColor: { value: new THREE.Color(0.02, 0.01, 0.02) },
                uCloudCover: { value: 0.5 }
            },
            vertexShader: `
                varying vec3 vWorldPosition;
                void main() {
                    vec4 worldPos = modelMatrix * vec4(position, 1.0);
                    vWorldPosition = worldPos.xyz;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    gl_Position.z = gl_Position.w;
                }
            `,
            fragmentShader: `
                uniform float uDayness;
                uniform vec3 uSunDirection;
                uniform float uTime;
                uniform vec3 uSunColor;
                uniform vec3 uHorizonColor;
                uniform vec3 uZenithColor;
                uniform vec3 uGroundColor;
                uniform float uCloudCover;
                varying vec3 vWorldPosition;

                float hash(vec3 p) {
                    p = fract(p * 0.3183099 + 0.1);
                    p *= 17.0;
                    return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
                }

                float noise(vec3 p) {
                    vec3 i = floor(p);
                    vec3 f = fract(p);
                    f = f * f * (3.0 - 2.0 * f);
                    return mix(
                        mix(mix(hash(i+vec3(0,0,0)),hash(i+vec3(1,0,0)),f.x),
                            mix(hash(i+vec3(0,1,0)),hash(i+vec3(1,1,0)),f.x),f.y),
                        mix(mix(hash(i+vec3(0,0,1)),hash(i+vec3(1,0,1)),f.x),
                            mix(hash(i+vec3(0,1,1)),hash(i+vec3(1,1,1)),f.x),f.y),f.z);
                }

                float fbm(vec3 p) {
                    float v = 0.0, a = 0.5;
                    for(int i = 0; i < 5; i++) { v += a * noise(p); p *= 2.0; a *= 0.5; }
                    return v;
                }

                void main() {
                    vec3 dir = normalize(vWorldPosition);
                    float y = dir.y;

                    // 天空渐变（天顶 → 地平线）
                    vec3 skyColor = mix(uZenithColor, uHorizonColor, pow(1.0 - max(y, 0.0), 0.6));

                    // 地平线暖色带
                    float horizonBlend = exp(-abs(y) * 8.0);
                    vec3 horizonTint = mix(uHorizonColor, vec3(1.0, 0.7, 0.4), 0.15 * uDayness);
                    skyColor = mix(skyColor, horizonTint, horizonBlend * 0.6);

                    // 太阳光晕（多层）
                    vec3 sunDir = normalize(uSunDirection);
                    float sunAngle = max(dot(dir, sunDir), 0.0);

                    // 太阳核心 - 亮白色圆盘
                    float sunCore = smoothstep(0.9992, 1.0, sunAngle);
                    vec3 sunCoreColor = vec3(1.0, 0.98, 0.9) * sunCore * 8.0;

                    // 太阳光晕 - 暖色渐变
                    float sunGlow = pow(sunAngle, 8.0) * 0.6;
                    float sunGlow2 = pow(sunAngle, 48.0) * 0.8;
                    vec3 sunGlowColor = uSunColor * (sunGlow * 0.4 + sunGlow2 * 0.6);

                    // 太阳光晕 - 大范围暖色散射
                    float sunScatter = pow(sunAngle + 0.1, 2.0) * 0.15;
                    vec3 scatterColor = vec3(1.0, 0.6, 0.3) * sunScatter * uDayness;

                    vec3 sunResult = sunCoreColor + sunGlowColor + scatterColor;
                    sunResult *= (0.2 + 0.8 * uDayness);

                    // 云层（FBM 噪声）
                    vec3 cloudPos = dir * 30.0 + vec3(uTime * 0.04, 0.0, uTime * 0.02);
                    float cloudNoise = fbm(cloudPos);
                    float cloudDensity = smoothstep(0.35, 0.75, cloudNoise) * uDayness * uCloudCover;

                    // 云层颜色（受太阳影响）
                    float cloudSun = max(dot(dir, sunDir), 0.0);
                    vec3 cloudBright = mix(vec3(0.7, 0.75, 0.8), vec3(1.0, 0.9, 0.7), pow(cloudSun, 4.0));
                    vec3 cloudDark = mix(vec3(0.4, 0.42, 0.45), vec3(0.3, 0.3, 0.35), 1.0 - uDayness);
                    vec3 cloudColor = mix(cloudDark, cloudBright, cloudDensity);

                    // 星星（只在夜晚可见）
                    float starVis = 1.0 - uDayness;
                    vec3 starPos = dir * 200.0;
                    vec3 starCell = floor(starPos * 30.0);
                    float starHash = hash(starCell);
                    float starPattern = step(0.997, starHash) * starVis;
                    float starTwinkle = sin(uTime * 3.0 + starHash * 100.0 + starCell.x * 0.5) * 0.5 + 0.5;
                    float starBright = starPattern * (0.5 + 0.5 * starTwinkle);
                    vec3 starColor = mix(vec3(0.8, 0.85, 1.0), vec3(1.0, 0.9, 0.7), starHash) * starBright;

                    // 月亮
                    float moonVis = 1.0 - uDayness;
                    vec3 moonDir = normalize(vec3(-sunDir.x * 0.8, 0.25 + 0.3 * (1.0 - uDayness), -sunDir.z * 0.8));
                    float moonAngle = max(dot(dir, moonDir), 0.0);
                    float moonDisk = smoothstep(0.999, 1.0, moonAngle);
                    float moonGlow = pow(moonAngle, 16.0) * 0.15;
                    vec3 moonColor = vec3(0.85, 0.85, 0.95) * (moonDisk * 1.5 + moonGlow) * moonVis;

                    // 组合
                    vec3 finalColor = skyColor + sunResult + cloudColor * cloudDensity + starColor + moonColor;

                    // 地面以下
                    if(y < 0.0) {
                        float groundBlend = exp(y * 12.0);
                        finalColor = mix(uGroundColor, uHorizonColor, groundBlend);
                    }

                    // 简单色调映射 + 伽马校正
                    finalColor = finalColor / (finalColor + vec3(1.0));
                    finalColor = pow(finalColor, vec3(1.0/2.2));

                    gl_FragColor = vec4(finalColor, 1.0);
                }
            `,
            side: THREE.BackSide,
            depthWrite: false
        });
        const skyDome = new THREE.Mesh(skyDomeGeo, skyDomeMat);
        skyDome.name = 'skyDome';
        scene.add(skyDome);
        window._skyDome = skyDome;

        // ===== IBL：用自定义天空穹顶生成 PMREM 环境贴图 =====
        // PBR 物体反射的就是真实天空纹理
        try {
            const pmrem = new THREE.PMREMGenerator(renderer);
            pmrem.compileEquirectangularShader();
            const envRT = pmrem.fromScene(skyDome, 0.04);
            scene.environment = envRT.texture;
            window._envRT = envRT;
            pmrem.dispose();
        } catch(e){ console.warn('IBL failed', e); }

        // 三点光 + 半球光（暖色温，金色阳光）— 5 灯系统
        ambient = new THREE.AmbientLight(0x8a7a6a, 0.45);
        scene.add(ambient);
        hemi = new THREE.HemisphereLight(0x9ec5e8, 0x3a2a1a, 0.6);
        scene.add(hemi);
        // Key：暖金太阳
        sun = new THREE.DirectionalLight(0xfff0d0, 3.0);
        if(window._skyDome){
            sun.position.copy(window._skyDome.material.uniforms.uSunDirection.value).multiplyScalar(150);
        } else {
            sun.position.set(-80,120,-60);
        }
        sun.castShadow = true;
        sun.shadow.mapSize.set(2048, 2048);   // 移动端 2048，PC 端 4096 在 updateFPS 里提
        sun.shadow.camera.near=1; sun.shadow.camera.far=500;
        sun.shadow.camera.left=-250; sun.shadow.camera.right=250;
        sun.shadow.camera.top=250; sun.shadow.camera.bottom=-250;
        sun.shadow.bias = -0.00005;
        sun.shadow.normalBias = 0.04;
        sun.shadow.radius = 4;
        scene.add(sun);
        // Fill：冷蓝紫补光（背光面不死黑）
        const fill = new THREE.DirectionalLight(0x6688c0, 0.55);
        fill.position.set(80, 60, 80);
        scene.add(fill);
        window._fill = fill;
        // Rim：暖金边缘光（从背后打，制造轮廓感）
        const rim = new THREE.DirectionalLight(0xc9a96e, 0.35);
        rim.position.set(0, 20, -120);
        scene.add(rim);
        window._rim = rim;

        // 后处理 — 桌面端才启用，移动端某些 GPU 驱动与 EffectComposer 链不兼容
        // 会导致整个画面变成纯黑（典型表现：UI 正常但 WebGL canvas 全黑）
        if(!isMobile){
            try {
                composer = new EffectComposer(renderer);
                const renderPass = new RenderPass(scene, camera);
                composer.addPass(renderPass);

                // SSAO 屏幕空间环境光遮蔽 — 让角落/接缝变深（Unity 真实感关键）
                try {
                    ssaoPass = new SSAOPass(scene, camera, window.innerWidth, window.innerHeight);
                    ssaoPass.kernelRadius = 0.6;
                    ssaoPass.minDistance = 0.001;
                    ssaoPass.maxDistance = 0.05;
                    ssaoPass.output = SSAOPass.OUTPUT.Default;
                    composer.addPass(ssaoPass);
                    window._ssao = ssaoPass;
                } catch(e){ console.warn('SSAO failed, skip', e); }

                const bloomPass = new UnrealBloomPass(
                    new THREE.Vector2(window.innerWidth, window.innerHeight),
                    0.95, 0.55, 0.78   // strength, radius, threshold — 接近 Neon City 强度
                );
                composer.addPass(bloomPass);
                window._bloom = bloomPass;

                try {
                    smaaPass = new SMAAPass(
                        window.innerWidth * renderer.getPixelRatio(),
                        window.innerHeight * renderer.getPixelRatio()
                    );
                    composer.addPass(smaaPass);
                } catch(e){ console.warn('SMAA failed, skip', e); }

                outputPass = new OutputPass();
                composer.addPass(outputPass);
            } catch(e){
                console.warn('EffectComposer init failed, fallback to direct render', e);
                composer = null;
            }
        }

        clock = new THREE.Clock();
    }

    // ===== 构建世界（完整） =====
    function buildWorld() {
        const gGeo = new THREE.PlaneGeometry(W, W, 150, 150);
        gGeo.rotateX(-Math.PI/2);
        const gPos = gGeo.attributes.position;
        for(let i=0;i<gPos.count;i++) gPos.setY(i, getTerrainH(gPos.getX(i), gPos.getZ(i)));
        gGeo.computeVertexNormals();
        // 地面纹理：优先用真实森林地面（Poly Haven），否则用程序生成草地
        const realGrass = REAL_TEX_GRASS();
        const gTex = realGrass.map ? realGrass.map.clone() : texGrass.map.clone();
        gTex.wrapS = gTex.wrapT = THREE.RepeatWrapping;
        gTex.repeat.set(40, 40);
        gTex.colorSpace = THREE.SRGBColorSpace;
        gTex.anisotropy = renderer.capabilities.getMaxAnisotropy ? renderer.capabilities.getMaxAnisotropy() : 4;
        const gRough = (realGrass.roughnessMap || texGrass.roughnessMap).clone();
        gRough.wrapS = gRough.wrapT = THREE.RepeatWrapping;
        gRough.repeat.set(40, 40);
        gRough.anisotropy = gTex.anisotropy;
        const gNormal = (realGrass.normalMap || texGrass.normalMap).clone();
        gNormal.wrapS = gNormal.wrapT = THREE.RepeatWrapping;
        gNormal.repeat.set(40, 40);
        gNormal.anisotropy = gTex.anisotropy;
        const gAO = realGrass.aoMap ? realGrass.aoMap.clone() : null;
        if(gAO){ gAO.wrapS = gAO.wrapT = THREE.RepeatWrapping; gAO.repeat.set(40,40); gAO.anisotropy = gTex.anisotropy; }
        const gMat = new THREE.MeshPhysicalMaterial({
            map: gTex,
            roughnessMap: gRough,
            normalMap: gNormal,
            aoMap: gAO,
            aoMapIntensity: 0.7,
            normalScale: new THREE.Vector2(1.2, 1.2),
            color: 0x8a9866,
            metalness: 0.0,
            roughness: 0.92,
            envMapIntensity: 0.8,
            clearcoat: 0.05
        });
        const ground = new THREE.Mesh(gGeo, gMat);
        ground.receiveShadow = true;
        scene.add(ground);

        const wGeo = new THREE.PlaneGeometry(80, 500, 40, 200);
        wGeo.rotateX(-Math.PI/2);
        const wMat = new THREE.ShaderMaterial({
            uniforms: { time: { value: 0 } },
            vertexShader: `
                uniform float time;
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    vec3 p = position;
                    p.z += sin(p.x*0.2 + time*1.5) * 0.5;
                    p.z += cos(p.y*0.3 + time*1.2) * 0.3;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
                }
            `,
            fragmentShader: `
                varying vec2 vUv;
                void main() {
                    float c = vUv.y * 0.5 + 0.5;
                    // 强制保证 alpha=1 避免在某些移动端驱动上完全透明
                    gl_FragColor = vec4(c*0.1, c*0.3, c*0.5, 1.0);
                }
            `,
            side: THREE.DoubleSide,
            transparent: false,
            depthWrite: true
        });
        const water = new THREE.Mesh(wGeo, wMat);
        water.position.set(-100, -1.2, 0);
        scene.add(water);
        window._water = water;

        buildRoads();
        buildLandmarks();
        buildBuildings();
        buildTrees();
        buildStreetLights();
        spawnVehicles();
        spawnNPCs();
        spawnPickups();
        spawnGlow();
        spawnParticles();

        // ===== v6.1 真实 GLB 模型摆放到场景 =====
        // 如果已加载真模型，在地图中心摆出 demo 建筑群
        if (window._realModels) {
            const models = window._realModels;
            // 在 (200, 0, 200) 附近摆 4 个建筑 + 1 个城市街区
            const placeG = (key, x, z, ry=0, scale=1) => {
                if (models[key]) {
                    const m = models[key].clone();
                    m.position.set(x, 0, z);
                    m.rotation.y = ry;
                    m.scale.setScalar(scale);
                    scene.add(m);
                }
            };
            placeG('building_city',  220,  220, 0, 1.5);
            placeG('building_city', -220,  220, Math.PI/4, 1.2);
            placeG('building_block',  220, -220, Math.PI/2, 0.8);
            placeG('building_block', -220, -220, Math.PI, 1.0);
            // 5 辆车分散摆
            placeG('car_mustang',  180,   0, Math.PI/2, 1.0);
            placeG('car_truck',    -180,   0, -Math.PI/2, 1.0);
            placeG('car_minivan',  0,   180, 0, 1.0);
            placeG('car_dragster', 0,  -180, Math.PI, 1.0);
            placeG('car_bigset',   300,  300, Math.PI/4, 1.0);
            // 5 个 RPG 角色分散摆（演示用，v6.2 替换胶囊体）
            placeG('char_barbarian',  150, 100, 0, 1.0);
            placeG('char_knight',    -150, 100, Math.PI, 1.0);
            placeG('char_mage',       150, -100, Math.PI/2, 1.0);
            placeG('char_rogue',     -150, -100, -Math.PI/2, 1.0);
            placeG('char_rogue_h',   100, 150, Math.PI/4, 1.0);
        }
    }

    // ===== 相机更新 =====
    function updateCamera() {
        const tgt = player.inVehicle ? player.inVehicle.mesh.position : player.pos;
        const tx = tgt.x - Math.sin(player.yaw)*5*Math.cos(player.pitch);
        const tz = tgt.z - Math.cos(player.yaw)*5*Math.cos(player.pitch);
        const ty = tgt.y + 2 + Math.sin(player.pitch)*5;
        camera.position.lerp(new THREE.Vector3(tx, ty, tz), 0.15);
        camera.lookAt(tgt.x, tgt.y + player.height*0.6, tgt.z);
    }

    // ===== 主循环 =====
    function animate() {
        requestAnimationFrame(animate);
        const dt = Math.min(clock.getDelta(), 0.05);
        if(gameStarted && !gamePaused) {
            updatePlayer(dt);
            updateProjectiles(dt);
            updateNPCs(dt);
            updateWantedDecay(dt);
            updateDayNight(dt);
            updateParticles(dt);
            pickups.forEach(p=>{
                p.mesh.position.y = 0.8 + Math.sin(performance.now()*0.003 + p.bobOffset)*0.15;
                p.mesh.rotation.y += dt*0.5;
            });
            glowObjs.forEach(g=>{
                if(!g.collected){
                    g.mesh.rotation.y += dt*0.8;
                    g.mesh.position.y = 0.5 + Math.sin(performance.now()*0.004)*0.1;
                }
            });
            player.stress = Math.max(0, player.stress - dt*2);
            updateHUD();
            updateFPS(dt);
            if(window._water) window._water.material.uniforms.time.value += dt;
            if(window._skyDome) window._skyDome.material.uniforms.uTime.value += dt;
            // emissive 呼吸（祈年殿风格）
            if(window._topBall){
                window._topBall.material.emissiveIntensity = 0.7 + 0.7*Math.sin(performance.now()*0.002);
            }
            if(window._crown){
                window._crown.material.emissiveIntensity = 0.6 + 0.5*Math.sin(performance.now()*0.003);
            }
            // 红色信标呼吸（IFS + 电视台）
            if(window._beacons){
                for(const b of window._beacons){
                    b.material.emissiveIntensity = 2.0 + 1.8*Math.abs(Math.sin(performance.now()*0.004 + b.position.x*0.1));
                }
            }
            // 灯泡呼吸
            if(window._bulbInst){
                const litFactor = Math.max(0, Math.sin((window._skyDome?window._skyDome.material.uniforms.uDayness.value*0.5+0.5:1) * Math.PI));
                window._bulbInst.material.emissiveIntensity = 2.0 + 1.5*litFactor + 0.5*Math.sin(performance.now()*0.003);
            }
        }
        updateCamera();

        if(composer) composer.render();
        else renderer.render(scene, camera);

        if(gameStarted && performance.now()%4<2){
            drawRadar();
            const pp = player.inVehicle ? player.inVehicle.mesh.position : player.pos;
            let nearest='野外', nd2=999;
            Object.values(landmarks).forEach(lm=>{
                const d=U.dist2D(pp.x,pp.z,lm.x,lm.z);
                if(d<nd2 && d<80){ nd2=d; nearest=lm.name; }
            });
            document.getElementById('locDisp').textContent = nearest;
            document.getElementById('moneyDisp').textContent = '$'+player.money.toLocaleString();
        }
    }

    // ===== 启动 =====
    async function init() {
        // v6.1.4: 强制横屏移到一个按钮，**不在 init 阶段调用**
        // （Android Edge 兼容性问题 + 不阻塞首屏）
        // 用户可以点击右上角"横屏"按钮手动锁定

        // 错误显示屏：把 WebGL/JS 错误吐到屏幕右下角，方便手机调试
        try {
            const errBox = document.createElement('div');
            errBox.id = 'errBox';
            errBox.style.cssText = 'position:fixed;bottom:0;left:0;right:0;max-height:30vh;overflow:auto;background:rgba(0,0,0,.85);color:#ff6666;font:10px monospace;padding:6px;z-index:99999;white-space:pre-wrap;display:none;border-top:1px solid #ff3333;';
            document.body.appendChild(errBox);
            const showErr = (msg) => { errBox.style.display='block'; errBox.textContent += msg + '\n'; };
            window.addEventListener('error', e => showErr('[JS] ' + (e.message||e.error)));
            window.addEventListener('unhandledrejection', e => showErr('[Promise] ' + (e.reason && e.reason.message ? e.reason.message : e.reason)));
        } catch(_){}

        // v6.1.2: 进度条 UI
        try {
            const pb = document.createElement('div');
            pb.id = 'progressBar';
            pb.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:60%;max-width:400px;background:rgba(0,0,0,.7);border:1px solid #ffd700;border-radius:8px;padding:12px;z-index:99998;color:#ffd700;font:14px sans-serif;text-align:center;display:none;';
            pb.innerHTML = '<div id="pbText">加载中...</div><div style="height:6px;background:#333;margin-top:8px;border-radius:3px;overflow:hidden;"><div id="pbFill" style="height:100%;background:linear-gradient(90deg,#ffd700,#ff8800);width:0%;transition:width .3s;"></div></div>';
            document.body.appendChild(pb);
        } catch(_){}
        const lt = document.getElementById('loadText');
        const showProgress = (txt, pct) => {
            try {
                const pb = document.getElementById('progressBar');
                const pf = document.getElementById('pbFill');
                const pt = document.getElementById('pbText');
                if (pb) pb.style.display = 'block';
                if (pf) pf.style.width = (pct||0) + '%';
                if (pt) pt.textContent = txt;
            } catch(_){}
        };

        try {
            if(lt) lt.textContent = '初始化引擎...';
            showProgress('初始化引擎...', 5);
            await initEngine();
            if(lt) lt.textContent = '加载真实 PBR 纹理...';
            showProgress('加载 PBR 纹理 (8 套 4K)...', 15);
            const realTex = await loadRealTextures().catch(e => {
                console.warn('[Init] real textures failed, use procedural', e);
                return null;
            });
            window._realTex = realTex;
            if(lt) lt.textContent = '加载 HDR 环境光...';
            showProgress('加载 HDR 环境...', 35);
            const realHDR = await loadRealHDR().catch(e => {
                console.warn('[Init] real HDR failed, use procedural sky', e);
                return null;
            });
            if (realHDR) scene.environment = realHDR;
            window._realHDR = realHDR;
            if(lt) lt.textContent = '构建城市...';
            showProgress('构建城市...', 50);
            buildWorld();
            if(lt) lt.textContent = '启动游戏...';
            showProgress('启动游戏...', 90);
            // v6.1.2: 不再 await GLB（避免卡死）
            // 启动 5 秒后后台慢慢加载 GLB，避免阻塞首屏
            setTimeout(() => {
                loadRealModels().catch(e => {
                    console.warn('[BG] real models failed (non-fatal)', e);
                });
            }, 5000);
        } catch(e){
            const lb = document.getElementById('loadText');
            if(lb) lb.textContent = '初始化失败: ' + e.message;
            console.error(e);
        } finally {
            // v6.1.1: 无论成功失败都强制移除 blocker，避免永远卡在启动页
            try {
                const blocker = document.getElementById('blocker');
                if (blocker) blocker.style.display = 'none';
            } catch(_){}
            // 隐藏进度条
            setTimeout(() => {
                try {
                    const pb = document.getElementById('progressBar');
                    if (pb) pb.style.display = 'none';
                } catch(_){}
            }, 2000);
        }
        // v6.1.4: 关键修复！移除 finally 里错误的 return
        // 让以下 initInput / AudioSys / HUD 全部正常执行
        try { initInput(); } catch(e){ console.warn('initInput', e); }
        try { AudioSys.init(); } catch(e){ console.warn('AudioSys', e); }
        updateHUD();
        updateWeaponHUD();
        updateWantedHUD();
        flashMoney();
        generateMission();
        // 立即同步一次光照/天空，避免开场一瞬间还停留在 initEngine 的默认弱光状态
        try { updateDayNight(0); } catch(e){ console.warn('updateDayNight', e); }

        setTimeout(() => {
            document.getElementById('loading').classList.add('hide');
        }, 800);

        clock.start();
        animate();
    }

    // 事件绑定
    document.getElementById('blocker').addEventListener('click', ()=>{
        if(!gameStarted){
            document.getElementById('blocker').style.display = 'none';
            gameStarted = true;
            gamePaused = false;
            showNotif('欢迎来到长沙！WASD移动，鼠标视角，T接任务');
            renderer.domElement.requestPointerLock();
        } else if(player.isDead || player.isBusted){
            respawn();
        }
    });

    // 挂载设置事件（已经绑定）
    // 启动
    init();

    console.log('星渊城 v6.0 终极融合版 完全加载');
</script>
