// ========== 主循环 ==========
const FIXED_STEP = CONFIG.physics.fixedStep;
const MAX_PHYS_STEPS = CONFIG.physics.maxPhysSteps;
let lastT = performance.now();
let fpsEMA = 60;
let booted = false, loopRunning = false, frameCounter = 0, frameTimer = 0;
let _wasHidden = false, pendingJump = false;
let _renderScale = 1.0, _targetScale = 1.0;
const MIN_SCALE = 0.6, MAX_SCALE = 1.0, TARGET_FPS = 45;
let estimatedTris = 0;
let _firstFrame = true, _firstFrameDone = false;
let _lastScaleUpdate = 0;
const SCALE_UPDATE_INTERVAL = 500;

function loop() {
    try {
        if (!loopRunning) return;
        // 移除 document.hidden 检查，避免循环空转
        const now = performance.now();
        let dt = Math.min((now - lastT) / 1000, 0.1);
        dt *= VisualFX.getTimeScale();
        if (_firstFrame) { dt = 0.016; _firstFrame = false; }
        if (dt < 0.0001) { lastT = now; return; }
        lastT = now;

        const currentFps = 1 / Math.max(dt, 1e-4);
        fpsEMA = lerp(fpsEMA, currentFps, 0.05);

        if (ENABLE_DYNAMIC_RES) {
            const nowPerf = performance.now();
            if (nowPerf - _lastScaleUpdate > SCALE_UPDATE_INTERVAL) {
                _lastScaleUpdate = nowPerf;
                if (fpsEMA < TARGET_FPS && _targetScale > MIN_SCALE) _targetScale -= 0.02;
                else if (fpsEMA > TARGET_FPS + 15 && _targetScale < MAX_SCALE) _targetScale += 0.02;
                _targetScale = clamp(_targetScale, MIN_SCALE, MAX_SCALE);
                _renderScale = lerp(_renderScale, _targetScale, 0.1);
                if (Math.abs(_renderScale - _targetScale) < 0.001) _renderScale = _targetScale;
                const renderWidth = Math.floor(innerWidth * _renderScale);
                const renderHeight = Math.floor(innerHeight * _renderScale);
                if (Math.abs(renderer.domElement.width - renderWidth) > 10 || Math.abs(renderer.domElement.height - renderHeight) > 10) {
                    renderer.setSize(renderWidth, renderHeight, false);
                    if (composer) composer.setSize(renderWidth, renderHeight);
                    if (ssaoPass) ssaoPass.setSize(renderWidth, renderHeight);
                    if (bloomPass) bloomPass.resolution.set(Math.floor(renderWidth * 0.7), Math.floor(renderHeight * 0.7));
                    G._lastRenderWidth = renderWidth;
                    G._lastRenderHeight = renderHeight;
                }
            }
        } else {
            if (renderer.domElement.width !== innerWidth || renderer.domElement.height !== innerHeight) {
                renderer.setSize(innerWidth, innerHeight, false);
                if (composer) composer.setSize(innerWidth, innerHeight);
                if (ssaoPass) ssaoPass.setSize(innerWidth, innerHeight);
                if (bloomPass) bloomPass.resolution.set(Math.floor(innerWidth * 0.7), Math.floor(innerHeight * 0.7));
            }
        }

        frameCounter++; frameTimer += dt;
        if (frameTimer > 1) {
            if (debugInfo) {
                if (frameCounter % 100 === 0) estimatedTris = renderer.info.render.triangles;
                debugInfo.textContent = `Tris:${(estimatedTris/1000).toFixed(0)}k Bodys:${world.bodies.length} Dyn:${G._dynamicBodyCount} Res:${Math.round(_renderScale * 100)}%`;
            }
            frameCounter = 0; frameTimer = 0;
        }

        nightNow = updateDayNight(dt);
        const night = nightNow > 0.55;

        for (const c of cars) c.setNightLights(night);
        for (const t of traffic) {
            if (t.headMat) t.headMat.emissiveIntensity = (night && nightNow > 0.3) ? 0.8 : 0;
            if (t.tailMat) t.tailMat.emissiveIntensity = (night && nightNow > 0.3) ? 0.8 : 0;
        }

        const useTouch = (_lastInputSource === 'touch' || (_lastInputSource === 'none' && _hasTouchCapability));
        let kx = (keys['KeyA'] ? 1 : 0) - (keys['KeyD'] ? 1 : 0);
        let kz = 0;
        if (keys['KeyW']) kz += 1;
        if (keys['KeyS']) kz -= 1;
        if (useTouch) {
            if (Math.abs(kx) < 0.01 && Math.abs(kz) < 0.01) {
                kx = input.moveX;
                kz = -input.moveZ;
            }
        }
        if (Math.abs(kx) > 1 || Math.abs(kz) > 1) {
            const len = Math.hypot(kx, kz);
            if (len > 1) { kx /= len; kz /= len; }
        }
        _md.set(kx, 0, kz);
        const run = keys['ShiftLeft'] || keys['ShiftRight'] || input.run;

        pendingJump = false;
        while (inputQueue.length > inputReadIdx) {
            const evt = inputQueue[inputReadIdx++];
            if (evt.type === 'jump') pendingJump = true;
        }
        if (inputReadIdx > 0) { inputQueue.splice(0, inputReadIdx); inputReadIdx = 0; }
        frameSeq++;

        if (inVilla) {
        } else if (playerCar && player.state === 'driving') {
            let driveKx = (keys['KeyA'] ? 1 : 0) - (keys['KeyD'] ? 1 : 0);
            let driveKz = 0;
            if (keys['KeyW']) driveKz += 1;
            if (keys['KeyS']) driveKz -= 1;
            if (useTouch && Math.abs(driveKx) < 0.01 && Math.abs(driveKz) < 0.01) {
                driveKx = -input.moveX;
                driveKz = -input.moveZ;
            }
            playerCar.input.throttle = clamp(driveKz, 0, 1);
            playerCar.input.reverse = driveKz < -0.1;
            let rawSteer = clamp(driveKx, -1, 1);
            if (Math.abs(rawSteer) < 0.08) rawSteer = 0;
            let steer = Math.sign(rawSteer) * Math.pow(Math.abs(rawSteer), 0.6);
            playerCar.input.steer = clamp(-steer, -1, 1);
            playerCar.input.brake = input.brake;
            playerCar.input.handBrake = keys['Space'] || input.handBrake || false;
        } else if (player.physicsEnabled) {
            player.viewVector.subVectors(player.root.position, camera.position).normalize();
            player.updateInput(_md, run, pendingJump);
        }

        if (!inVilla) { camOp.move(input.lookDX, input.lookDY); input.lookDX = 0; input.lookDY = 0; }

        if (input.actPressed) {
            if (player.state === 'driving') exitCar();
            else if (player.state === 'idle' || player.state === 'walk' || player.state === 'sprint') {
                const car = nearestCar(3.4);
                if (car) enterCar(car);
            }
        }
        input.actPressed = false;
        if (input.viewPressed) {
            input.viewPressed = false;
            if (player.state === 'driving') { camOp.targetRadius = camOp.targetRadius < 2 ? CONFIG.driveR : 0.001; }
        }

        const nearCar = (player.state !== 'driving' && player.state !== 'entering' && player.state !== 'exiting') ? nearestCar(3.4) : null;
        const ctxBtnEl = document.getElementById('ctxBtn');
        if (nearCar) ctxBtnEl.classList.add('show');
        else {
            if (player.state === 'driving') ctxBtnEl.classList.add('show');
            else ctxBtnEl.classList.remove('show');
        }
        ctxBtnEl.textContent = player.state === 'driving' ? '下 车' : '上 车';
        if (_hasTouchCapability) btnAct.textContent = player.state === 'driving' ? '下车' : '上车';
        checkVillaEnter(dt);

        if (!inVilla && !document.hidden) {
            if (player.physicsEnabled) player.preStep();
            const safeDt = Math.min(dt, 0.05);
            try {
                world.step(FIXED_STEP, safeDt, MAX_PHYS_STEPS);
            } catch (e) {
                console.error('Physics step failed', e);
                if (player.capsule) {
                    try { world.removeBody(player.capsule); } catch (e2) {}
                    player.resetVelocity();
                }
            }
            if (player.physicsEnabled) player.postStep();
            for (const body of world.bodies) {
                if (isNaN(body.position.x) || isNaN(body.velocity.x) || isNaN(body.position.y) || isNaN(body.velocity.y) || isNaN(body.position.z) || isNaN(body.velocity.z)) {
                    console.error('NaN detected for body', body.id);
                    let safeX = 6.3, safeY = 5, safeZ = 14;
                    if (player && body === player.capsule) { safeX = 6.3; safeY = 5; safeZ = 14; }
                    else if (playerCar && body === playerCar.body) { safeX = 6.3; safeY = 5; safeZ = 14; }
                    else { safeX = body.position.x || 0; safeY = 10; safeZ = body.position.z || 0; }
                    body.position.set(safeX, safeY, safeZ);
                    body.velocity.set(0, 0, 0);
                    body.angularVelocity.set(0, 0, 0);
                    body.quaternion.set(0, 0, 0, 1);
                }
            }
        }

        if (!inVilla) player.update(dt);

        for (const c of cars) c.update(dt);
        if (playerCar) { _pp.set(playerCar.pos.x, 0, playerCar.pos.z); }
        const pcPos = playerCar ? _pp : null;
        for (const t of traffic) t.update(dt, pcPos);
        for (const p of peds) p.update(dt, playerCar);

        if (playerCar && player.state === 'driving') {
            const isDrifting = playerCar.speed > 10 && Math.abs(playerCar.input.steer) > 0.5;
            if (isDrifting) {
                const rearOffset = new THREE.Vector3(0, 0, -1.2).applyQuaternion(playerCar.body.quaternion);
                const leftWheel = playerCar.body.position.clone().add(rearOffset).add(new THREE.Vector3(-0.6, 0, 0));
                const rightWheel = playerCar.body.position.clone().add(rearOffset).add(new THREE.Vector3(0.6, 0, 0));
                TireMarks.addMark(leftWheel, rightWheel);
                DriftSmoke.emit(leftWheel, playerCar.forward.clone().negate());
                DriftSmoke.emit(rightWheel, playerCar.forward.clone().negate());
            } else {
                TireMarks.reset();
            }
            DriftSmoke.update(dt);
        }

        const followTarget = (player.state === 'driving' && playerCar) ? playerCar.pos : player.root.position;
        updateShadowCamera(followTarget);
        if (player.state === 'driving' && playerCar) {
            camOp.target.set(playerCar.pos.x, playerCar.pos.y + 1, playerCar.pos.z);
            const heading = Math.atan2(playerCar.forward.x, playerCar.forward.z);
            camOp.update(dt, Math.abs(playerCar.speed) > 3 ? heading : null);
        } else if (camOp.mode === 'villa') { camOp.update(dt, null); }
        else { camOp.target.copy(player.root.position).add(_co); camOp.update(dt, null); }

        // 更新天空盒跟随相机
        skyDome.position.copy(camera.position);

        VisualFX.update(dt, {
            time: performance.now() / 1000,
            nightFactor: nightNow,
            speed: playerCar ? playerCar.speed : 0,
            throttle: playerCar ? Math.abs(playerCar.input.throttle) : 0,
            gear: playerCar ? playerCar.gear : 1,
            playerPos: playerCar ? playerCar.body.position : null,
            playerAngle: playerCar ? Math.atan2(playerCar.forward.x, playerCar.forward.z) : 0,
            trafficCars: traffic
        });

        if (playerCar && player.state === 'driving') {
            const gearMax = GEAR_MAX[Math.min(playerCar.gear, 5)];
            const rpm01 = clamp(Math.abs(playerCar.speed) / gearMax, 0, 1);
            engineAudio.update(rpm01, clamp(Math.abs(playerCar.speed) / 22, 0, 1), playerCar.driftAngle, true);
            speedEl.textContent = Math.round(Math.abs(playerCar.speed) * 3.6);
            gearEl.textContent = playerCar.speed < -0.5 ? 'R 挡' : `${playerCar.gear} 挡`;
            rpmFill.style.width = `${clamp((playerCar.rpm - 800) / (6800 - 800), 0, 1) * 100}%`;
        } else { engineAudio.update(0, 0, 0, false); rpmFill.style.width = '0%'; }

        const hh = Math.floor(DAY.hour), mmn = Math.floor((DAY.hour - hh) * 60);
        clockEl.textContent = `${String(hh).padStart(2, '0')}:${String(mmn).padStart(2, '0')}`;
        fpsEl.textContent = Math.round(fpsEMA);

        const focus = (player.state === 'driving' && playerCar) ? playerCar.pos : player.root.position;
        const th = camOp.theta * Math.PI / 180;
        const heading = (player.state === 'driving' && playerCar) ? Math.atan2(playerCar.forward.x, playerCar.forward.z) : Math.atan2(-Math.sin(th), -Math.cos(th));
        drawMinimap(focus, heading);

        if (G._pendingTrafficChange !== null) {
            updateTrafficCount(G._pendingTrafficChange);
            G._pendingTrafficChange = null;
        }
        if (G._pendingPedChange !== null) {
            updatePedCount(G._pendingPedChange);
            G._pendingPedChange = null;
        }

        trafficLightSystem.update(dt);

        if (_qualityCooldown > 0) _qualityCooldown -= dt;
        else if (!_applyingQuality && _pendingQualityChange === null && qTimer > 3) {
            qTimer = 0;
            if (fpsEMA < 28 && qLevel < 3) { _pendingQualityChange = qLevel + 1; _qualityCooldown = 5; }
            else if (fpsEMA > 58 && qLevel > 0) { _pendingQualityChange = qLevel - 1; _qualityCooldown = 5; }
        }
        qTimer += dt;
        if (_pendingQualityChange !== null && !_applyingQuality) {
            const target = _pendingQualityChange;
            _pendingQualityChange = null;
            clearTimeout(_qualityTimeout);
            _qualityTimeout = setTimeout(() => applyQuality(target), 0);
        }

        const op = cine ? 0 : 1;
        for (const k in hudCache) if (hudCache[k] && hudCache[k].style) hudCache[k].style.opacity = op;
        document.getElementById('tools').style.pointerEvents = 'auto';

        if (waterMat) {
            waterMat.uniforms.uTime.value = performance.now() / 1000;
            waterMat.uniforms.uSkyColor.value.setHex(nightNow > 0.5 ? 0x191970 : 0x87ceeb);
        }

        if (composer) {
            const passes = composer.passes;
            for (let i = 0; i < passes.length; i++) {
                const p = passes[i];
                if (p.uniforms && p.uniforms.uNight !== undefined) p.uniforms.uNight.value = nightNow;
                if (p.uniforms && p.uniforms.uVelocity !== undefined) {
                    const spd = playerCar ? playerCar.speed : 0;
                    const speedRatio = Math.min(Math.abs(spd) / 50, 1);
                    p.uniforms.uVelocity.value = speedRatio;
                    p.uniforms.uIntensity.value = speedRatio * 0.05;
                }
                if (p.uniforms && p.uniforms.uSunPos !== undefined) {
                    const sd = skyUni.uSunDir.value;
                    const sunWorld = camera.position.clone().add(sd.clone().multiplyScalar(200));
                    const proj = sunWorld.clone().project(camera);
                    const ux = (proj.x * 0.5 + 0.5);
                    const uy = (proj.y * 0.5 + 0.5);
                    p.uniforms.uSunPos.value.set(ux, uy);
                    p.uniforms.uIntensity.value = (proj.z < 0 && sd.y > 0) ? 0.5 : 0;
                }
            }
        }

        if (postProcessActive && composer) composer.render();
        else renderer.render(scene, camera);
        if (!_firstFrameDone && !_firstFrame) _firstFrameDone = true;

        input.jumpPressed = false;
    } catch (e) {
        console.error('❌ 渲染循环崩溃:', e);
        if (loopRunning) {
            renderer.setAnimationLoop(loop);
        }
    }
}

let fullscreenTimeout;
function showFullscreenBtn() {
    fullscreenBtn.style.opacity = '1';
    clearTimeout(fullscreenTimeout);
    fullscreenTimeout = setTimeout(() => { fullscreenBtn.style.opacity = '0.3'; }, 3000);
}
fullscreenBtn.addEventListener('touchstart', showFullscreenBtn);
fullscreenBtn.addEventListener('mouseenter', showFullscreenBtn);
fullscreenBtn.onclick = () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(() => {});
};
document.body.appendChild(fullscreenBtn);
showFullscreenBtn();

setHint('🚶 步行', _hasTouchCapability ? '左摇杆移动 · 右半屏视角 · 走近车辆点「上车」' : 'WASD 移动 · Shift 冲刺 · Space 跳 · 走近车辆按 F 上车 · E 进入别墅');
