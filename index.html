<script type="module">
import * as THREE from 'three';
import * as CANNON from 'cannon-es';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
window._engineOK = true;

const GT7_PRO = true, ENABLE_DYNAMIC_RES = true, ULTRA_QUALITY = true;
const POST = { EffectComposer: null, RenderPass: null, UnrealBloomPass: null, OutputPass: null, SSAOPass: null, loaded: false, loadError: false };
let composer = null, bloomPass = null, ssaoPass = null, ssaoPassObj = null;
let postProcessActive = false, _postCfg = '', _postInitLock = false;

const ChromaticAberrationShader = {
    uniforms: { tDiffuse: { value: null }, amount: { value: 0.0008 } },
    vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader: `uniform sampler2D tDiffuse; uniform float amount; varying vec2 vUv; void main(){ vec2 offset=amount*(vUv-0.5)*2.0; float r=texture2D(tDiffuse,vUv+offset).r; float g=texture2D(tDiffuse,vUv).g; float b=texture2D(tDiffuse,vUv-offset).b; gl_FragColor=vec4(r,g,b,1.0); }`
};

const CineMasterShader = {
    uniforms: {
        tDiffuse: { value: null },
        time: { value: 0 },
        intensity: { value: 0.03 },
        vignette: { value: 0.45 },
        contrast: { value: 1.05 },
        saturation: { value: 1.15 },
        uNight: { value: 0.0 }
    },
    vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader: `
        uniform sampler2D tDiffuse;
        uniform float time, intensity, vignette, contrast, saturation, uNight;
        varying vec2 vUv;
        float rand(vec2 co){ return fract(sin(dot(co.xy ,vec2(12.9898,78.233))) * 43758.5453); }
        void main(){
            vec3 col = texture2D(tDiffuse, vUv).rgb;
            col = (col - 0.5) * contrast + 0.5;
            float gray = dot(col, vec3(0.299, 0.587, 0.114));
            col = mix(vec3(gray), col, saturation);
            vec3 shadowsDay = vec3(0.15, 0.25, 0.35);
            vec3 highsDay = vec3(1.0, 0.85, 0.6);
            vec3 shadowsNight = vec3(0.15, 0.20, 0.35);
            vec3 highsNight = vec3(0.8, 0.9, 1.1);
            vec3 shadows = mix(shadowsDay, shadowsNight, uNight);
            vec3 highs = mix(highsDay, highsNight, uNight);
            float lum = smoothstep(0.2, 0.8, gray);
            col = mix(col * shadows, col * highs, lum);
            vec2 q = vUv - 0.5;
            float dist = length(q);
            col *= 1.0 - smoothstep(0.4, 0.9, dist) * vignette;
            float amount = 0.0015 * (1.0 - uNight * 0.5);
            float r = texture2D(tDiffuse, vUv + vec2(amount, 0.0)).r;
            float b = texture2D(tDiffuse, vUv - vec2(amount, 0.0)).b;
            col = vec3(r, col.g, b);
            col += (rand(vUv + time) - 0.5) * intensity * (1.0 - uNight * 0.5);
            gl_FragColor = vec4(col, 1.0);
        }`
};

const MotionBlurShader = {
    uniforms: { tDiffuse: { value: null }, uVelocity: { value: 0.0 }, uIntensity: { value: 0.0 } },
    vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader: `
        uniform sampler2D tDiffuse;
        uniform float uVelocity, uIntensity;
        varying vec2 vUv;
        void main() {
            vec2 center = vec2(0.5);
            vec2 dir = vUv - center;
            float dist = length(dir);
            vec2 blurDir = dir * dist * uIntensity * uVelocity;
            vec3 color = vec3(0.0);
            float total = 0.0;
            for (int i = 0; i < 6; i++) {
                float t = float(i) / 5.0 - 0.5;
                vec2 offset = vUv + blurDir * t;
                color += texture2D(tDiffuse, offset).rgb;
                total += 1.0;
            }
            gl_FragColor = vec4(color / total, 1.0);
        }`
};

const LensFlareShader = {
    uniforms: { tDiffuse: { value: null }, uSunPos: { value: new THREE.Vector2(0.5, 0.5) }, uIntensity: { value: 0.0 } },
    vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader: `
        uniform sampler2D tDiffuse;
        uniform vec2 uSunPos;
        uniform float uIntensity;
        varying vec2 vUv;
        void main() {
            vec2 dir = vUv - uSunPos;
            float dist = length(dir);
            float flare = exp(-dist * 12.0) * 0.35 + exp(-dist * 25.0) * 0.25;
            vec3 col = texture2D(tDiffuse, vUv).rgb;
            col += vec3(1.0, 0.9, 0.7) * flare * uIntensity * 1.5;
            gl_FragColor = vec4(col, 1.0);
        }`
};

async function loadPostProcess() {
    if (POST.loaded || POST.loadError || _postInitLock) return;
    _postInitLock = true;
    try {
        const mods = await Promise.race([
            Promise.all([
                import('three/addons/postprocessing/EffectComposer.js'),
                import('three/addons/postprocessing/RenderPass.js'),
                import('three/addons/postprocessing/UnrealBloomPass.js'),
                import('three/addons/postprocessing/OutputPass.js'),
                import('three/addons/postprocessing/SSAOPass.js')
            ]),
            new Promise((_, reject) => setTimeout(() => reject(new Error('超时')), 5000))
        ]);
        const [e, r, u, o, s] = mods;
        POST.EffectComposer = e.EffectComposer;
        POST.RenderPass = r.RenderPass;
        POST.UnrealBloomPass = u.UnrealBloomPass;
        POST.OutputPass = o.OutputPass;
        POST.SSAOPass = s.SSAOPass;
        POST.loaded = true;
        const q = QLevels[qLevel];
        if (q.bloom || q.ssao) initPostProcess();
        const el = document.getElementById('postStatus');
        if (el) { el.className = 'ok'; el.textContent = '🎨 极致 ✅'; }
    } catch(e) {
        POST.loadError = true;
        const el = document.getElementById('postStatus');
        if (el) { el.className = 'fallback'; el.textContent = '🎨 极致 ⚠️ 降级'; }
    } finally {
        _postInitLock = false;
    }
}

function initPostProcess() {
    if (_postInitLock || !POST.loaded || !POST.EffectComposer) return;
    if (POST.loadError || composer) return;
    try {
        const rs = new POST.RenderPass(scene, camera);
        composer = new POST.EffectComposer(renderer);
        composer.addPass(rs);
        const q = QLevels[qLevel];
        if (ULTRA_QUALITY && q.ssao && POST.SSAOPass) {
            ssaoPass = new POST.SSAOPass(scene, camera, innerWidth, innerHeight);
            ssaoPass.kernelRadius = qLevel <= 1 ? 16 : 12;
            ssaoPass.minDistance = 0.005;
            ssaoPass.maxDistance = 0.12;
            composer.addPass(ssaoPass);
            ssaoPassObj = ssaoPass;
        }
        if (q.bloom && POST.UnrealBloomPass) {
            const w = Math.floor(innerWidth * (GT7_PRO ? 0.7 : 0.5));
            const h = Math.floor(innerHeight * (GT7_PRO ? 0.7 : 0.5));
            bloomPass = new POST.UnrealBloomPass(new THREE.Vector2(w,h), 0.6, 0.4, 0.85);
            bloomPass.threshold = 0.98;
            bloomPass.strength = 1.0;
            bloomPass.radius = 0.25;
            composer.addPass(bloomPass);
        }
        const op = new POST.OutputPass;
        composer.addPass(op);
        composer.setSize(innerWidth, innerHeight);
        postProcessActive = true;
        _postCfg = q.bloom + '-' + q.ssao;
    } catch(e) { console.warn('后处理初始化失败', e); }
}

function disposePostProcess() {
    if (composer) { composer.dispose(); composer = null; }
    if (bloomPass) { bloomPass.dispose(); bloomPass = null; }
    if (ssaoPass) { ssaoPass.dispose(); ssaoPass = null; }
    postProcessActive = false;
    _postCfg = '';
}

const G = {
    playerCar: null, exitCar: null, pendingCarDestroy: null, nearRoad: null,
    player: null, cars: [], traffic: [], peds: [], camOp: null, DAY: null,
    renderer: null, world: null, scene: null, _booted: false, _dynamicBodyCount: 0,
    _groundCanvasCopy: null,
    _pendingTrafficChange: null, _pendingPedChange: null,
    _renderScale: 1.0, _targetScale: 1.0,
    _lastRenderWidth: 0, _lastRenderHeight: 0,
};

const V3 = (x=0,y=0,z=0)=>new THREE.Vector3(x,y,z);
const clamp = THREE.MathUtils.clamp;
const lerp = THREE.MathUtils.lerp;
const _v = { a:new THREE.Vector3(), b:new THREE.Vector3(), c:new THREE.Vector3(), d:new THREE.Vector3(), e:new THREE.Vector3(), f:new THREE.Vector3(), g:new THREE.Vector3(), h:new THREE.Vector3(), i:new THREE.Vector3(), j:new THREE.Vector3(), k:new THREE.Vector3(), l:new THREE.Vector3(), m:new THREE.Vector3(), n:new THREE.Vector3(), o:new THREE.Vector3(), p:new THREE.Vector3() };
function gv(k){ return _v[k]||(_v[k]=new THREE.Vector3()); }
const _c = { a:new THREE.Color(), b:new THREE.Color(), c:new THREE.Color() };
function gc(k){ return _c[k]||(_c[k]=new THREE.Color()); }
function av(a,b,o){ o=o||new THREE.Vector3(); return o.set(a.x*b.z+a.z*b.x, b.y, a.z*b.z-a.x*b.x); }
function sa(v1,v2){ let d=clamp(v1.dot(v2),-1,1),a; if(d>0.999999)a=0; else if(d<-0.999999)a=Math.PI; else a=Math.acos(d); const c=new THREE.Vector3().crossVectors(v1,v2); if(c.y<-1e-10)a=-a; else if(Math.abs(c.y)<1e-10)a=Math.sign(a)*Math.abs(a); return a; }
function ease(x){ return -(Math.cos(Math.PI*x)-1)/2; }
function rand(a,b){ return a+Math.random()*(b-a); }
function randi(a,b){ return Math.floor(rand(a,b+1)); }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }

const _y = new THREE.Vector3(0,1,0);
const _md = new THREE.Vector3, _pp = new THREE.Vector3, _co = new THREE.Vector3(0,0.4,0);
const _vto = new THREE.Vector3, _vpo = new THREE.Vector3, _ta = new THREE.Vector3, _tb = new THREE.Vector3;
const _pt = new THREE.Vector3, _pmd = new THREE.Vector3, _cf = new THREE.Vector3, _cv = new THREE.Vector3;
const _cq = new THREE.Quaternion, _ce = new THREE.Euler, _cuq = new THREE.Quaternion, _cdq = new THREE.Quaternion;
const _ca = new THREE.Vector3, _tra = new THREE.Vector3, _tr = new THREE.Vector3;
const _dir = new THREE.Vector3(), _right = new THREE.Vector3(), _fwdFlat = new THREE.Vector3();
const _tmpCar = new THREE.Vector3(), _pedMd = new THREE.Vector3(), _pedDir = new THREE.Vector3();

const GEAR_MAX = [0,5,9,13,17,22];
const GEAR_SPD = [0,5,9,13,17,22];
const RCURVES = [
    {closed:false,points:[{x:-190,z:-12},{x:-140,z:-6},{x:-70,z:2},{x:0,z:5},{x:75,z:3},{x:145,z:-4},{x:190,z:-14}]},
    {closed:false,points:[{x:-8,z:-185},{x:-3,z:-125},{x:2,z:-60},{x:5,z:0},{x:3,z:65},{x:-2,z:130},{x:-8,z:185}]},
    {closed:false,points:[{x:-118,z:-170},{x:-112,z:-90},{x:-108,z:-10},{x:-114,z:65},{x:-120,z:150}]},
    {closed:false,points:[{x:118,z:-165},{x:114,z:-85},{x:116,z:5},{x:112,z:80},{x:118,z:165}]},
    {closed:true,points:[{x:-100,z:-80},{x:-100,z:30},{x:-40,z:90},{x:50,z:90},{x:105,z:30},{x:105,z:-75},{x:50,z:-125},{x:-45,z:-125}]}
];
const _cmc = new Map();
function gcm(c){ const k=String(c); if(_cmc.has(k)) return _cmc.get(k); const m=new THREE.MeshPhysicalMaterial({color:c, metalness:0.82, roughness:0.12, clearcoat:1.0, clearcoatRoughness:0.05}); if(_cmc.size>20){ const kk=_cmc.keys().next().value; _cmc.delete(kk); } _cmc.set(k,m); return m; }

class SimBase{ constructor(f,m,d){ this.mass=m; this.damping=d; this.frameTime=1/f; this.offset=0; this.cache=[]; } lastFrame(){ return this.cache[this.cache.length-1]; } generateFrames(ts){ const t=this.offset+ts, n=Math.floor(t/this.frameTime); this.offset=t%this.frameTime; if(n>0){ for(let i=0;i<n;i++) this.cache.push(this.getFrame(i+1===n)); this.cache=this.cache.slice(-2); } } }
class SpringSim extends SimBase{ constructor(f,m,d,s=0,v=0){ super(f,m,d); this.state={position:s,velocity:v}; this.target=0; this.cache=[{position:s,velocity:v},{position:s,velocity:v}]; } simulate(ts){ this.generateFrames(ts); const t=this.offset/this.frameTime; this.state.position=lerp(this.cache[0].position,this.cache[1].position,t); this.state.velocity=lerp(this.cache[0].velocity,this.cache[1].velocity,t); } getFrame(){ const l=this.lastFrame(), p=l.position, v=l.velocity, a=(this.target-p)/this.mass, nv=(v+a)*this.damping; return {position:p+nv, velocity:nv}; } }
class VSpring extends SimBase{ constructor(f,m,d){ super(f,m,d); this.init(); } init(){ this.position=V3(); this.velocity=V3(); this.target=V3(); this.cache=[{position:V3(),velocity:V3()},{position:V3(),velocity:V3()}]; } simulate(ts){ this.generateFrames(ts); const t=this.offset/this.frameTime; this.position.lerpVectors(this.cache[0].position,this.cache[1].position,t); this.velocity.lerpVectors(this.cache[0].velocity,this.cache[1].velocity,t); } getFrame(){ const n={position:this.lastFrame().position.clone(), velocity:this.lastFrame().velocity.clone()}; const a=new THREE.Vector3().subVectors(this.target,n.position).divideScalar(this.mass); n.velocity.add(a).multiplyScalar(this.damping); n.position.add(n.velocity); return n; } }
class RSpring extends SimBase{ constructor(f,m,d,s=0,v=0){ super(f,m,d); this.position=s; this.velocity=v; this.target=0; this.lastLerp=0; this.cache=[{position:s,velocity:v},{position:s,velocity:v}]; } simulate(ts){ this.generateFrames(ts); const t=this.offset/this.frameTime, p=lerp(this.cache[0].position,this.cache[1].position,t); this.position=p-this.lastLerp; this.lastLerp=p; this.velocity=lerp(this.cache[0].velocity,this.cache[1].velocity,t); } getFrame(isLast){ const l=this.lastFrame(), n={position:l.position, velocity:l.velocity}; if(isLast){ n.position=0; this.lastLerp-=l.position; } const a=(this.target-n.position)/this.mass; n.velocity=(n.velocity+a)*this.damping; n.position+=n.velocity; return n; } }

let _lastShadowSnap = {x:0, z:0};
function updateShadowCamera(tp){
    if(!tp) return;
    _snapTarget = (G.playerCar && Math.abs(G.playerCar.speed)>10) ? 8 : 2;
    _curSnap = lerp(_curSnap, _snapTarget, 0.1);
    const snap = Math.max(2, Math.round(_curSnap));
    const nx = Math.round(tp.x/snap)*snap, nz = Math.round(tp.z/snap)*snap;
    if(Math.abs(_lastShadowSnap.x - nx) < 2 && Math.abs(_lastShadowSnap.z - nz) < 2) return;
    _lastShadowSnap.x = nx; _lastShadowSnap.z = nz;
    _lsp.set(nx, 150, nz);
    const s = sun.shadow.camera;
    s.position.copy(_lsp);
    s.updateMatrixWorld();
    s.updateProjectionMatrix();
}

const skyUni = {
    uSunDir: { value: new THREE.Vector3(0,1,0) },
    uDayness: { value: 1.0 },
    uDuskness: { value: 0.0 },

const skyMat = new THREE.ShaderMaterial({
    uniforms: skyUni,
    side: THREE.BackSide,
    depthWrite: false,
    fog: false,
    vertexShader: `varying vec3 vDir; void main(){ vDir=normalize(position); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader: `
        varying vec3 vDir;
        uniform vec3 uSunDir;
        uniform float uDayness;
        uniform float uDuskness;
        uniform float uTime;
        float hash(vec3 p){ p=fract(p*0.3183099+0.1); p*=17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
        float noise(vec3 x){ vec3 i=floor(x), f=fract(x); f=f*f*(3.0-2.0*f); return mix(mix(mix(hash(i),hash(i+vec3(1,0,0)),f.x),mix(hash(i+vec3(0,1,0)),hash(i+vec3(1,1,0)),f.x),f.y),mix(mix(hash(i+vec3(0,0,1)),hash(i+vec3(1,0,1)),f.x),mix(hash(i+vec3(0,1,1)),hash(i+vec3(1,1,1)),f.x),f.y),f.z); }
        float fbm(vec3 p){ float v=0.0,a=0.5; for(int i=0;i<6;i++){ v+=a*noise(p); p*=2.03; a*=0.5; } return v; }
        void main(){
            vec3 d = normalize(vDir);
            vec3 sun = normalize(uSunDir);
            float mu = clamp(dot(d,sun), -1.0, 1.0);
            float h = d.y;
            float dn = uDayness, dk = uDuskness;
            vec3 zen = mix(vec3(0.004,0.008,0.02), mix(vec3(0.16,0.14,0.38), vec3(0.12,0.32,0.68), dn), clamp(dn+dk,0.,1.));
            vec3 hor = mix(vec3(0.03,0.05,0.10), mix(vec3(1.00,0.45,0.18), vec3(0.62,0.78,0.94), dn), clamp(dn+dk,0.,1.));
            vec3 col = mix(zen, hor, pow(1.0-clamp(h,0.0,1.0), 3.0));
            float sunSide = pow(clamp(mu*0.5+0.5,0.,1.), 2.0);
            col = mix(col, hor*1.25, pow(1.0-clamp(h,0.,1.),3.0)*sunSide*dk*0.85);
            col += mix(vec3(1.0,0.55,0.25), vec3(1.0,0.85,0.6), dn) * (pow(clamp(mu,0.,1.),24.0)*0.35 + pow(clamp(mu,0.,1.),250.0)*0.9) * (dn+dk);
            col += vec3(1.0,0.95,0.85) * smoothstep(0.99985,0.99995, mu) * 2.0;
            if(h > 0.02){
                vec3 cp = d / max(d.y, 0.08);
                cp.x += uTime*0.010; cp.z += uTime*0.004;
                float base = fbm(cp*1.4), det = fbm(cp*4.5+7.3);
                float cov = smoothstep(0.48,0.78, base*0.75+det*0.35) * smoothstep(0.02,0.18,h);
                float lit = pow(clamp(mu*0.5+0.5,0.,1.), 1.5);
                vec3 cLit  = mix(vec3(1.0,0.62,0.45), vec3(1.05,0.98,0.92), dn);
                vec3 cShad = mix(vec3(0.25,0.18,0.32), vec3(0.55,0.60,0.70), dn);
                vec3 cCol = mix(cShad, cLit, lit*0.8+det*0.3);
                float edge = smoothstep(0.35,0.5,base)*(1.0-smoothstep(0.5,0.75,base));
                cCol += vec3(1.0,0.5,0.3)*edge*lit*dk*1.2;
                col = mix(col, cCol, cov*0.9);
            }
            vec3 sp = floor(d*280.0);
            col += vec3(0.8,0.9,1.0) * step(0.9985, hash(sp)) * (0.5+0.5*sin(uTime*2.0+hash(sp+3.0)*20.0)) * (1.0-clamp(dn+dk,0.,1.)) * smoothstep(0.0,0.25,h);
            gl_FragColor = vec4(col, 1.0);
        }
    `
});

const DAY = { hour:12.2, speed:1, auto:true, dayness:1, duskness:0 };
function hourAngle(h){ return (h-6)/12 * Math.PI; }
let nightNow = 0;
function updateDayNight(dt){
    skyUni.uTime.value = (skyUni.uTime.value + dt) % 10000;
    if(DAY.auto) DAY.hour = (DAY.hour + dt * DAY.speed * 24 / CONFIG.dayLength) % 24;
    const ang = hourAngle(DAY.hour);
    const sd = gv('a').set(Math.cos(ang), Math.sin(ang), 0.35).normalize();
    const e = sd.y;
    DAY.dayness = clamp((e + 0.08)/0.30, 0, 1);
    DAY.duskness = clamp(1 - Math.abs(e)/0.22, 0, 1) * (1 - DAY.dayness * 0.4);
    nightNow = 1 - DAY.dayness;
    skyUni.uSunDir.value.copy(sd);
    skyUni.uDayness.value = DAY.dayness;
    skyUni.uDuskness.value = DAY.duskness;
    sun.position.copy(camera.position).addScaledVector(sd, 200);
    sun.target.position.copy(camera.position);
    const si = 2.6 * clamp(e*3,0,1) + 0.25 * DAY.duskness;
    sun.intensity = si;
    sun.color.setHSL(0.1, 0.5, lerp(0.6, 0.97, DAY.dayness));
    if(DAY.duskness > 0.2) sun.color.setRGB(1.0, 0.55, 0.3);
    hemi.intensity = 0.38 + 0.68 * DAY.dayness;
    hemi.color.setHSL(0.6, 0.35, lerp(0.12, 0.72, DAY.dayness));
    hemi.groundColor.setHSL(0.08, 0.3, lerp(0.03, 0.3, DAY.dayness));
    moonMat.opacity = clamp(nightNow - 0.25, 0, 1) * 0.9;
    const mp = gv('b').set(-sd.x, Math.max(-sd.y, 0.12), -sd.z).normalize().multiplyScalar(700);
    moon.position.copy(camera.position).add(mp);
    moon.lookAt(camera.position);
    const fc = gc('a').set(0x0a1018).lerp(gc('b').set(0x9fb8d8), DAY.dayness).lerp(gc('c').set(0xc46a3a), DAY.duskness*0.7);
    scene.fog.color.copy(fc);
    renderer.setClearColor(fc);
    const night = nightNow;
    for (const m of (window.__LITMATS||[])) m.emissiveIntensity = night*night*2.0 + DAY.duskness*0.5;
    for (const m of (window.__LAMPMATS||[])) m.emissiveIntensity = night*3.0;
    for (const s of (window.__LAMPSPRITES||[])) { if(s.material) s.material.opacity = night*0.85; }
    const dayExposure = 0.72, nightExposure = 0.55;
    renderer.toneMappingExposure = lerp(nightExposure, dayExposure, DAY.dayness);
    return nightNow;
}

const CITY = { streets:[], blocks:[], buildings:[], lamps:[], trees:[], roadNodes:[], villa:null };
let curves = [], minimapCanvas = null, hillsMesh = null, villaColliders = [];
try{
    (function planCity(){
        const N = CONFIG.gridN, B = CONFIG.block;
        for(let k=0; k<N; k++) CITY.streets.push((k-(N-1)/2)*B);
        for(let i=0; i<N-1; i++) for(let j=0; j<N-1; j++){
            const cx = (CITY.streets[i]+CITY.streets[i+1])/2, cz = (CITY.streets[j]+CITY.streets[j+1])/2;
            const edge = Math.max(Math.abs(i-3.5), Math.abs(j-3.5))/3.5, park = edge>0.45 && Math.random()<0.18;
            CITY.blocks.push({i,j,cx,cz,edge,park});
            if(!park){
                const cells = [[-5.8,-5.8],[5.8,-5.8],[-5.8,5.8],[5.8,5.8]];
                const nB = edge<0.3 ? randi(3,4) : randi(2,4);
                const shuffled = cells.sort(()=>Math.random()-0.5).slice(0,nB);
                for(const [ox,oz] of shuffled){
                    if(Math.random()<0.15) continue;
                    const w = rand(6.5,10.5), d = rand(6.5,10.5);
                    const hBase = lerp(rand(24,58), rand(6,14), clamp(edge,0,1));
                    const h = Math.max(6, hBase * rand(0.8,1.2));
                    CITY.buildings.push({x:cx+ox+rand(-1,1), z:cz+oz+rand(-1,1), w, d, h, variant:randi(0,2), tint:Math.random()});
                }
            } else {
                for(let t=0; t<randi(5,9); t++) CITY.trees.push({x:cx+rand(-11,11), z:cz+rand(-11,11), s:rand(0.8,1.4)});
            }
        }
        for(const b of CITY.blocks) if(!b.park && Math.random()<0.5) CITY.trees.push({x:b.cx+rand(-13,13), z:b.cz+rand(-13,13), s:rand(0.7,1.1)});
        for(const rd of RCURVES){
            const closed = rd.closed, pts = rd.points;
            const curve = new THREE.CatmullRomCurve3(pts.map(p=>new THREE.Vector3(p.x,0,p.z)), closed, 'catmullrom', 0.5);
            curves.push(curve);
            const totalLen = curve.getLength(), nSamples = Math.max(2, Math.floor(totalLen/CONFIG.nodeSpacing)), nodes = [];
            for(let s=0; s<=nSamples; s++){
                const t = s/nSamples, pt = curve.getPoint(t), idx = CITY.roadNodes.length;
                CITY.roadNodes.push({x:pt.x,z:pt.z, curveIndex:curves.length-1, t, links:[], junction:false});
                nodes.push(idx);
            }
            for(let i=0; i<nodes.length-1; i++){
                CITY.roadNodes[nodes[i]].links.push(nodes[i+1]);
                CITY.roadNodes[nodes[i+1]].links.push(nodes[i]);
            }
            if(closed && nodes.length>2){
                const f = nodes[0], l = nodes[nodes.length-1];
                if(!CITY.roadNodes[f].links.includes(l)) CITY.roadNodes[f].links.push(l);
                if(!CITY.roadNodes[l].links.includes(f)) CITY.roadNodes[l].links.push(f);
            }
        }
        const jDist = CONFIG.junctionDist * CONFIG.junctionDist;
        for(let i=0; i<CITY.roadNodes.length; i++) for(let j=i+1; j<CITY.roadNodes.length; j++){
            const a = CITY.roadNodes[i], b = CITY.roadNodes[j];
            if(a.curveIndex === b.curveIndex) continue;
            const dx = a.x - b.x, dz = a.z - b.z;
            if(dx*dx + dz*dz < jDist){
                if(!a.links.includes(j)) a.links.push(j);
                if(!b.links.includes(i)) b.links.push(i);
                a.junction = true; b.junction = true;
            }
        }
        for(let ci=0; ci<curves.length; ci++){
            const curve = curves[ci], totalLen = curve.getLength(), nLamp = Math.floor(totalLen/24);
            for(let li=0; li<nLamp; li++){
                const t = (li+0.5)/nLamp, pt = curve.getPoint(t), tgt = curve.getTangent(t), perpX = tgt.z, perpZ = -tgt.x;
                let nearJunc = false;
                for(const node of CITY.roadNodes) if(node.junction && (pt.x-node.x)**2+(pt.z-node.z)**2<64){ nearJunc=true; break; }
                if(nearJunc) continue;
                const off = CONFIG.roadW/2 + 1.2;
                CITY.lamps.push({x:pt.x + perpX*off, z:pt.z + perpZ*off});
                CITY.lamps.push({x:pt.x - perpX*off, z:pt.z - perpZ*off});
            }
        }
        G.nearRoad = function(x,z,offset=0){
            if(CITY.roadNodes.length===0) return {x:0,z:0};
            let bestIdx = 0, bestDist = Infinity;
            for(let i=0; i<CITY.roadNodes.length; i++){
                const n = CITY.roadNodes[i], d = (n.x-x)**2 + (n.z-z)**2;
                if(d < bestDist){ bestDist = d; bestIdx = i; }
            }
            const node = CITY.roadNodes[bestIdx], ci = node.curveIndex;
            if(ci !== undefined && curves[ci]){
                const tgt = curves[ci].getTangent(node.t), px = tgt.z, pz = -tgt.x;
                return {x:node.x + px*offset, z:node.z + pz*offset};
            }
            return {x:node.x + offset, z:node.z};
        };
        function createVilla(){ /* 由下方完整实现 */ }
        CITY.villa = createVilla();
    })();
} catch(e){ console.warn('城市生成失败', e); }

const MAP_PX = 4096, M2PX = MAP_PX/CONFIG.citySize, w2px = x => (x + CONFIG.citySize/2)*M2PX;

    (function bakeGround(){

        for(const b of CITY.blocks){

            if(b.park){
                g.fillStyle = '#3b5a36'; g.fillRect(w2px(x0), w2px(z0), 24*M2PX, 24*M2PX);

                const rd = RCURVES[ci], curve = curves[ci], pts = curve.getPoints(420), tangents = [];
                for(let i=0; i<pts.length; i++){ const t=i/(pts.length-1); tangents.push(curve.getTangent(t).normalize()); }
                allCurveData.push({pts, tangents, closed:rd.closed});
            }
            g.strokeStyle = '#1e2126'; g.lineCap='round'; g.lineJoin='round'; g.lineWidth = CONFIG.roadW * M2PX;
            for(const cd of allCurveData){

                for(let i=1; i<cd.pts.length; i++) g.lineTo(w2px(cd.pts[i].x), w2px(cd.pts[i].z));

            g.strokeStyle = '#e6b838'; g.lineWidth = 0.32*M2PX; g.setLineDash([4*M2PX, 3*M2PX]);
            g.setLineDash([]);

                        if(!started){ g.moveTo(wx,wz); started=true; } else g.lineTo(wx,wz);
                    }

                }
            }
            g.fillStyle = 'rgba(245,248,252,0.85)';

function createWater(x,z,sizeX,sizeZ){
    const waterGeo = new THREE.PlaneGeometry(sizeX,sizeZ,64,64);
    const waterMat = new THREE.ShaderMaterial({
        uniforms: { uTime:{value:0}, uColor:{value:new THREE.Color(0x1a3a5c)}, uSkyColor:{value:new THREE.Color(0x87ceeb)} },
        vertexShader: `
            uniform float uTime;
            varying vec2 vUv; varying vec3 vNormal; varying vec3 vWorldPos;
            void main(){
                vUv = uv;
                vec3 pos = position;
                float w1 = sin(pos.x*3.0+uTime*2.0)*0.05;
                float w2 = sin(pos.y*4.0+uTime*1.5)*0.03;
                float w3 = sin((pos.x+pos.y)*5.0+uTime*3.0)*0.02;
                pos.z += w1+w2+w3;
                float dx = cos(pos.x*3.0+uTime*2.0)*0.15 + cos((pos.x+pos.y)*5.0+uTime*3.0)*0.1;
                float dy = cos(pos.y*4.0+uTime*1.5)*0.12 + cos((pos.x+pos.y)*5.0+uTime*3.0)*0.1;
                vNormal = normalize(vec3(-dx, -dy, 1.0));
                vWorldPos = (modelMatrix * vec4(pos, 1.0)).xyz;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
            }
        `,
        fragmentShader: `
            uniform float uTime; uniform vec3 uColor; uniform vec3 uSkyColor;
            varying vec2 vUv; varying vec3 vNormal; varying vec3 vWorldPos;
            void main(){
                vec3 viewDir = normalize(cameraPosition - vWorldPos);
                float fresnel = pow(1.0 - max(dot(viewDir, vNormal), 0.0), 3.0);
                vec3 waterColor = mix(uColor, uSkyColor, fresnel*0.6);
                float spec = pow(max(dot(reflect(-viewDir, vNormal), vec3(0.5,0.8,0.3)), 0.0), 64.0);
                waterColor += vec3(spec)*0.5;
                gl_FragColor = vec4(waterColor, 0.85);
            }
        `,
        transparent:true, side:THREE.DoubleSide
    });
    const water = new THREE.Mesh(waterGeo, waterMat);
    water.rotation.x = -Math.PI/2;
    water.position.set(x, 0.05, z);
    scene.add(water);
    return waterMat;
}

class Character{
    constructor(){
        this.height = 1.7;
        this.rayCastLength = 0.65;
        this.raySafeOffset = 0.05;
        this.moveSpeed = 4;
        this.velocityTarget = V3();
        this.velocity = V3();
        this.acceleration = V3();
        this.orientation = V3(0,0,1);
        this.orientationTarget = V3(0,0,1);
        this.angularVelocity = 0;
        this.influence = V3(1,0,1);
        this.wantsToJump = false;
        this.state = 'idle';
        this.viewVector = V3();
        this.rayResult = new CANNON.RaycastResult();
        this.rayHasHit = false;
        this.walkPhase = 0;
        this.velocitySim = new VSpring(60,50,0.8);
        this.rotationSim = new RSpring(60,10,0.5);
        this.root = new THREE.Group();
        this.tilt = new THREE.Group();
        this.modelC = new THREE.Group();
        this.modelC.position.y = -0.57;
        this.root.add(this.tilt); this.tilt.add(this.modelC);
        this.body3d = makeHumanoid({shirt:0xcf5b3a, pants:0x25314a});
        this.modelC.add(this.body3d.group);
        scene.add(this.root);

        const mat = playerMat;
        this.capsule = new CANNON.Body({ mass: CONFIG.physics.playerMass });
        this.capsule.material = mat;
        this.capsule.addShape(new CANNON.Sphere(0.5));
        this.capsule.fixedRotation = true;
        this.capsule.updateMassProperties();
        this.capsule.allowSleep = false;
        this.capsule.linearDamping = 0.05;
        this.capsule.angularDamping = 0.1;
        this.capsule.collisionFilterGroup = MASK.PLAYER;
        this.capsule.collisionFilterMask = MASK.STATIC | MASK.VEHICLE;
        addBody(this.capsule);
        this.physicsEnabled = true;
        this._inWorld = true;
        this._groundY = 0;
        this._rayStart = new CANNON.Vec3();
        this._rayEnd = new CANNON.Vec3();
    }
    setPhysicsEnabled(v){ this.physicsEnabled = v; if(v && !this._inWorld){ addBody(this.capsule); this._inWorld=true; } else if(!v && this._inWorld){ removeBody(this.capsule); this._inWorld=false; } }
    setPosition(x,y,z){ this.capsule.position.set(x,y,z); this.capsule.previousPosition.set(x,y,z); this.capsule.interpolatedPosition.set(x,y,z); this.capsule.quaternion.set(0,0,0,1); }
    resetVelocity(){ this.velocity.set(0,0,0); this.capsule.velocity.set(0,0,0); this.velocitySim.init(); }
    setOrientation(v, i=false){ const l = v.clone().setY(0).normalize(); this.orientationTarget.copy(l); if(i) this.orientation.copy(l); }
    updateInput(md, run, jump){
        if(this.state==='entering' || this.state==='exiting' || this.state==='driving') return;
        const hasDir = md.lengthSq() > 0.001;
        if(hasDir){
            this.velocityTarget.copy(md).multiplyScalar(run ? 1.4 : 0.8);
            this.setOrientation(this.getCameraRelativeMovementVector(md));
            this.state = run ? 'sprint' : 'walk';
            this.velocitySim.mass = 10;
        } else {
            this.velocityTarget.set(0,0,0);
            this.velocitySim.mass = this.velocity.length() > 0.6 ? 20 : 10;
            this.state = this.rayHasHit ? 'idle' : this.state;
        }
        if(this.rayHasHit) this.influence.set(1,0,1);
        else this.influence.set(0.35,0,0.35);
        if(jump && this.rayHasHit) this.wantsToJump = true;
    }
    getCameraRelativeMovementVector(l){ const fv = V3(this.viewVector.x,0,this.viewVector.z).normalize(); return av(fv,l); }
    feetRaycast(){
        const p = this.capsule.position;
        this._rayStart.set(p.x, p.y, p.z);
        this._rayEnd.set(p.x, p.y - this.rayCastLength - this.raySafeOffset, p.z);
        this.rayHasHit = world.raycastClosest(this._rayStart, this._rayEnd,
            { collisionFilterMask: MASK.STATIC | MASK.VEHICLE, skipBackfaces: true }, this.rayResult);
        if(this.rayHasHit) this._groundY = this.rayResult.hitPointWorld.y;
    }
    preStep(){ this.feetRaycast(); }
    postStep(){
        const body = this.capsule;
        const sv = V3(body.velocity.x, 0, body.velocity.z);
        gv('c').copy(this.velocity).multiplyScalar(this.moveSpeed);
        const avv = av(this.orientation, gv('c'));
        const nv = V3(lerp(sv.x, avv.x, this.influence.x), 0, lerp(sv.z, avv.z, this.influence.z));
        if (this.rayHasHit) {
            body.velocity.set(nv.x, 0, nv.z);
        } else {
            body.velocity.x = nv.x;
            body.velocity.z = nv.z;
        }
        if (this.wantsToJump && this.rayHasHit) {
            body.velocity.y += 4.4;
            this.wantsToJump = false;
        }
    }
    springMovement(dt){ this.velocitySim.target.copy(this.velocityTarget); this.velocitySim.simulate(dt); this.velocity.copy(this.velocitySim.position); this.acceleration.copy(this.velocitySim.velocity); }
    springRotation(dt){ const a = sa(this.orientation, this.orientationTarget); this.rotationSim.target = a; this.rotationSim.simulate(dt); this.orientation.applyAxisAngle(_y, this.rotationSim.position); this.angularVelocity = this.rotationSim.velocity; }
    update(dt){
        if(this.state==='driving') return;
        if(this.state==='entering' || this.state==='exiting'){ this.updateTransition(dt); return; }
        if(this.physicsEnabled){ this.springMovement(dt); this.springRotation(dt); }
        const ip = this.capsule.interpolatedPosition;
        this.root.position.set(ip.x, ip.y, ip.z);
        this.root.lookAt(ip.x + this.orientation.x, ip.y + this.orientation.y, ip.z + this.orientation.z);
        const tz = -this.angularVelocity * 2.3 * this.velocity.length();
        this.tilt.rotation.z = clamp(tz, -0.4, 0.4);
        this.tilt.position.y = (Math.cos(Math.abs(clamp(tz,-0.4,0.4)))/2) - 0.5;
        const spd = this.velocity.length() * this.moveSpeed;
        this.walkPhase += dt * (2.2 + spd * 1.55);
        const amp = clamp(spd/5.5, 0, 1) * 0.62, s = Math.sin(this.walkPhase);
        this.body3d.legL.rotation.x = s * amp; this.body3d.legR.rotation.x = -s * amp;
        this.body3d.armL.rotation.x = -s * amp * 0.85; this.body3d.armR.rotation.x = s * amp * 0.85;
        if(!this.rayHasHit){ this.body3d.legL.rotation.x = 0.35; this.body3d.legR.rotation.x = -0.2; this.body3d.armL.rotation.x = -1.1; this.body3d.armR.rotation.x = -1.1; }
        this.modelC.position.y = -0.57 + Math.abs(Math.sin(this.walkPhase)) * 0.045 * amp;
    }
    startTransition(k,fromPos,fromQuat,toObj,localOffset,duration,onDone){
        this.state = k;
        this.trans = { t:0, duration, onDone, toObj, localOffset, fromPos:fromPos.clone(), fromQuat:fromQuat.clone() };
        if(k==='entering') this.setPhysicsEnabled(false);
    }
    updateTransition(dt){
        const tr = this.trans; tr.t += dt;
        const f = ease(clamp(tr.t/tr.duration,0,1));
        const targetPos = tr.toObj.localToWorld(tr.localOffset.clone());
        const targetQuat = tr.toObj.getWorldQuaternion(new THREE.Quaternion);
        this.root.position.lerpVectors(tr.fromPos, targetPos, f);
        this.root.quaternion.slerpQuaternions(tr.fromQuat, targetQuat, f);
        const sit = this.state==='entering' ? f : 1-f;
        this.body3d.legL.rotation.x = this.body3d.legR.rotation.x = -1.35 * sit;
        this.body3d.armL.rotation.x = this.body3d.armR.rotation.x = -0.5 * sit;
        if(tr.t >= tr.duration){ const cb = tr.onDone; this.trans = null; cb && cb(); }
    }
}

        }

        this.wheelIndexSteer = [0,1];

        this.speed = 0;
        this.gear = 1;
        this.shiftTimer = 0;
        this.timeToShift = CONFIG.car.shiftTime;
        this.steeringSim = new SpringSim(60,10,0.6);
        this.input = { throttle:0, steer:0, brake:false, handBrake:false, reverse:false };
        this.beingDriven = false;

            const contact = e.contact;

            if (Math.abs(relVel) > 5) {
                const ip = new THREE.Vector3(
                    contact.bi.position.x + contact.ri.x,
                    contact.bi.position.y + contact.ri.y,
                    contact.bi.position.z + contact.ri.z
                );
                CarDamage.onCollision(this, ip, Math.abs(relVel));
                if (window.VisualFX && VisualFX.triggerShake) VisualFX.triggerShake(Math.min(Math.abs(relVel) / 20, 1.5));
            }
        });

    get pos(){ return this.body.interpolatedPosition; }
    update(dt){
        const q = this.body.interpolatedQuaternion;
        this.forward.set(0,0,1).applyQuaternion(_cq.set(q.x,q.y,q.z,q.w));
        this.speed = this.body.velocity.x*this.forward.x + this.body.velocity.y*this.forward.y + this.body.velocity.z*this.forward.z;
        const ef = CONFIG.car.engineForce, maxGears = CONFIG.car.maxGears, gs = GEAR_SPD;

                const pf = (-4 - this.speed)/4;
                const force = (ef/this.gear)*Math.abs(pf);
                this.applyEngineForce(force);
            } else {
                const currMax = gs[Math.min(this.gear, gs.length-1)] || 1;
                const prevMax = gs[Math.max(this.gear-1,0)] || 0;
                const pf = currMax-prevMax>0.001 ? (currMax-this.speed)/(currMax-prevMax) : 0;
                const upTh = 0.08, downTh = 1.3;
                if(pf < upTh && this.gear < maxGears && this.shiftTimer <= 0 && this.speed < 66) {
                    this.shiftUp();
                } else if(this.gear > 1 && pf > downTh && this.shiftTimer <= 0) this.shiftDown();
                else if(this.input.throttle > 0){ const force = (ef/this.gear)*pf*this.input.throttle; this.applyEngineForce(force); }
            }
        } else this.applyEngineForce(0);
        this.steeringSim.simulate(dt);
        this.setSteeringValue(this.steeringSim.position);
        const maxSV = CONFIG.car.steerMax;
        if(this.beingDriven && Math.abs(this.input.steer)>0.01){
            const sf = clamp(this.speed*0.3, 1, Number.MAX_VALUE);
            _cv.set(this.body.velocity.x,0,this.body.velocity.z);
            let drift = 0;
            if(_cv.length()>0.5){ _cv.normalize(); _fwdFlat.copy(this.forward).setY(0).normalize(); drift = sa(_cv, _fwdFlat); }
            this.driftAngle = drift;
            let steering;
            if(this.input.steer>0) steering = Math.min(-maxSV/sf, -drift);
            else steering = Math.max(maxSV/sf, -drift);
            this.steeringSim.target = clamp(steering*Math.abs(this.input.steer), -maxSV, maxSV);
        } else { this.steeringSim.target = 0; this.driftAngle = 0; }
        if(this.input.brake) this.setBrake(CONFIG.car.brakeForce, [0,1,2,3]);
        else this.setBrake(0, [0,1,2,3]);
        if(this.input.handBrake) this.setBrake(CONFIG.car.handBrakeForce, [2,3]);
        else this.setBrake(0, [2,3]);
        if(this.vehicle.numWheelsOnGround >= 3) this.body.angularDamping = 0.4;
        else this.body.angularDamping = 0.05;
        if(this.vehicle.numWheelsOnGround < 3 && this.body.velocity.length() < 0.5){
            const e = _ce.setFromQuaternion(_cq.set(q.x,q.y,q.z,q.w), 'YXZ');
            const up = _cuq.setFromEuler(new THREE.Euler(0,e.y,0));
            const cq = _cq.set(q.x,q.y,q.z,q.w);
            const dq = _cdq.copy(cq).conjugate().multiply(up);
            const angle = 2*Math.acos(clamp(dq.w, -1, 1));
            const axis = _ca.set(dq.x,dq.y,dq.z);
            if(axis.length() > 0.001 && !isNaN(axis.x) && !isNaN(axis.y) && !isNaN(axis.z)){
                axis.normalize();
                const ts = CONFIG.car.rollRecoveryStrength * angle;
                this.body.applyTorque(new CANNON.Vec3(axis.x*ts, -this.body.angularVelocity.y*20, axis.z*ts));
            }
        }
        const ip = this.body.interpolatedPosition, iq = this.body.interpolatedQuaternion;
        this.mesh.position.set(ip.x, ip.y, ip.z);
        this.mesh.quaternion.set(iq.x, iq.y, iq.z, iq.w);
        for(let i=0; i<4; i++){
            this.vehicle.updateWheelTransform(i);
            const t = this.vehicle.wheelInfos[i].worldTransform;
            if(this.wheelMeshes[i]){
                this.wheelMeshes[i].position.set(t.position.x, t.position.y, t.position.z);
                this.wheelMeshes[i].quaternion.set(t.quaternion.x, t.quaternion.y, t.quaternion.z, t.quaternion.w);
            }
        }
        const gr = this.gear >= 1 ? CAR_CFG.gearRatios[Math.min(this.gear-1, CAR_CFG.gearRatios.length-1)] : CAR_CFG.reverseRatio;
        this.rpm = CONFIG.car.idleRpm + Math.abs(this.speed) * 1280 / Math.abs(gr);
        this.rpm = clamp(this.rpm, CONFIG.car.idleRpm, CONFIG.car.maxRpm);
        if(this.headlights) for(const h of this.headlights){ if(h.target) h.target.updateMatrixWorld(); }
    }
    shiftUp(){ this.gear++; this.shiftTimer = this.timeToShift; this.applyEngineForce(0); }
    shiftDown(){ this.gear--; this.shiftTimer = this.timeToShift; this.applyEngineForce(0); }
    applyEngineForce(f){ for(const i of this.wheelIndexDrive) this.vehicle.applyEngineForce(f, i); }
    setSteeringValue(v){ for(const i of this.wheelIndexSteer) this.vehicle.setSteeringValue(v, i); }
    setBrake(f, idx){ for(const i of idx || this.wheelIndexDrive) this.vehicle.setBrake(f, i); }
    setNightLights(n){ if(this.headlights) for(const h of this.headlights){ h.intensity = n ? 260 : 0; h.visible = n; } this.headMat && (this.headMat.emissiveIntensity = n ? 1.2 : 0); }
    destroy(forceEject=false){
        if(this.mesh && G.playerCar === this && G.player && G.player.root.parent === this.mesh){
            try{ scene.attach(G.player.root); G.player.setPhysicsEnabled(true); } catch(e){}
            G.playerCar = null; G.pendingCarDestroy = null;
        }
        if(this.vehicle) try{ this.vehicle.removeFromWorld(world); } catch(e){}
        if(this.body) try{ removeBody(this.body); } catch(e){}
        if(this.wheelMeshes){
            for(const w of this.wheelMeshes){
                try{
                    if(w.parent) w.parent.remove(w);
                    scene.remove(w);
                    w.traverse(o=>{
                        if(o.geometry) o.geometry.dispose();
                        if(o.material){
                            if(Array.isArray(o.material)) o.material.forEach(m=>m.dispose());
                            else o.material.dispose();
                        }
                    });
                } catch(e){}
            }
            this.wheelMeshes = null;
        }
        if(this.mesh){
            scene.remove(this.mesh);
            this.mesh.traverse(o=>{
                if(o.geometry) o.geometry.dispose();
                if(o.material){
                    if(Array.isArray(o.material)) o.material.forEach(m=>m.dispose());
                    else o.material.dispose();
                }
            });
            this.mesh = null;
        }
    }
}

class CameraOperator{
    constructor(){
        this.target = new THREE.Vector3();
        this.radius = CONFIG.walkR;
        this.targetRadius = CONFIG.walkR;
        this.theta = 180;
        this.phi = 12;
        this.sensitivity = new THREE.Vector2(CONFIG.camera.sensitivity, CONFIG.camera.sensitivity*0.8);
        this.mode = 'walk';
        this.rayResult = new CANNON.RaycastResult();
        this.userHold = false;
        this._holdTimer = 0;
        this._pointerLocked = false;
        this._exitAnchor = new THREE.Object3D();
    }
    move(dx, dy){
        if(this.mode==='villa') return;
        this.theta -= dx * (this.sensitivity.x/2) * 0.28;
        this.theta = ((this.theta%360)+360)%360;
        this.phi = clamp(this.phi + dy * (this.sensitivity.y/2) * 0.28, -25, 62);
        this.userHold = true; this._holdTimer = 0;
    }
    update(dt, fh=null){
        if(this.userHold){ this._holdTimer += dt; if(this._holdTimer > 1.6){ this.userHold = false; this._holdTimer = 0; } }
        if(this.mode==='villa'){
            const t = performance.now()/10000;
            const target = _vto.copy(CONFIG.villaPos).add(_ta.set(0,6,0));
            const pos = _vpo.copy(CONFIG.villaPos).add(_ta.set(10*Math.cos(t), 8+2*Math.sin(t*0.7), 10*Math.sin(t)));
            camera.position.lerp(pos, 0.03); camera.lookAt(target);
            return;
        }
        if(this.mode==='drive' && fh !== null){
            let behind = (fh*180/Math.PI) + 180;
            let diff = ((behind - this.theta + 540) % 360) - 180;
            this.theta += diff * clamp(dt*2.2,0,1) * (this.userHold ? 0 : 1);
            this.theta = ((this.theta%360)+360)%360;
        }
        this.radius = lerp(this.radius, this.targetRadius, 0.12);
        const th = this.theta * Math.PI/180, ph = this.phi * Math.PI/180;
        const desired = new THREE.Vector3(
            this.target.x + this.radius * Math.sin(th) * Math.cos(ph),
            this.target.y + this.radius * Math.sin(ph),
            this.target.z + this.radius * Math.cos(th) * Math.cos(ph)
        );
        const from = new CANNON.Vec3(this.target.x, this.target.y, this.target.z);
        const to = new CANNON.Vec3(desired.x, desired.y, desired.z);
        const mask = this.mode==='drive' ? MASK.STATIC : (MASK.STATIC | MASK.VEHICLE);
        const hit = world.raycastClosest(from, to, { collisionFilterMask:mask }, this.rayResult);
        let pos = desired;
        if(hit){ const hp = this.rayResult.hitPointWorld; const dir = desired.clone().sub(this.target).normalize(); pos = new THREE.Vector3(hp.x, hp.y, hp.z).addScaledVector(dir, -0.35); pos.y = Math.max(pos.y, this.target.y + 0.2); }
        camera.position.lerp(pos, this.mode==='drive' ? 0.5 : 0.35);
        camera.lookAt(this.target);
    }
}

class EngineAudio{
    constructor(){ this.ok = false; this.enabled = true; this.ctx = null; this._visHandler = null; this._nodes = []; this._needsUserGesture = false; }
    init(){
        if(this.ok) return;
        this.dispose();
        try{
            const AC = window.AudioContext || window.webkitAudioContext;
            this.ctx = new AC();
            this.master = this.ctx.createGain();
            this.master.gain.value = 0;
            this.master.connect(this.ctx.destination);
            const bufferSize = this.ctx.sampleRate * 2;
            const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
            const output = noiseBuffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;
            this.noise = this.ctx.createBufferSource();
            this.noise.buffer = noiseBuffer;
            this.noise.loop = true;
            this.noiseFilter = this.ctx.createBiquadFilter();
            this.noiseFilter.type = 'bandpass';
            this.noiseFilter.frequency.value = 100;
            this.noiseFilter.Q.value = 2;
            this.osc = this.ctx.createOscillator();
            this.osc.type = 'sawtooth';
            this.osc.frequency.value = 55;
            this.sub = this.ctx.createOscillator();
            this.sub.type = 'sine';
            this.sub.frequency.value = 27.5;
            this.gain = this.ctx.createGain();
            this.gain.gain.value = 0;
            const distortion = this.ctx.createWaveShaper();
            const curve = new Float32Array(256);
            for (let i = 0; i < 256; i++) {
                const x = (i / 128) - 1;
                curve[i] = Math.tanh(x * 3);
            }
            distortion.curve = curve;
            this.noise.connect(this.noiseFilter);
            this.noiseFilter.connect(distortion);
            this.osc.connect(distortion);
            this.sub.connect(distortion);
            distortion.connect(this.gain);
            this.gain.connect(this.master);
            this.noise.start();
            this.osc.start();
            this.sub.start();
            this._nodes = [this.master, this.noise, this.noiseFilter, this.osc, this.sub, this.gain, distortion];
            this.ok = true;
            this.ctx.onstatechange = () => { if(this.ctx && this.ctx.state === 'suspended') this._needsUserGesture = true; };
            this._visHandler = () => {
                if(!document.hidden && this.ctx && this.ctx.state === 'suspended'){
                    this._needsUserGesture = true;
                    this._safeResume();
                }
            };
            document.addEventListener('visibilitychange', this._visHandler);
        } catch(e){ console.warn('音频初始化失败', e); }
    }
    async _safeResume(){
        if(!this.ctx || this.ctx.state === 'closed') return;
        if(this.ctx.state === 'suspended'){
            try{ await this.ctx.resume(); this._needsUserGesture = false; } catch(e){ this.dispose(); this.init(); }
        }
    }
    update(rpm01, speed01, drift, driving){
        if(!this.ok || !this.ctx || this.ctx.state === 'closed') return;
        const on = this.enabled && driving;
        this.master.gain.value = lerp(this.master.gain.value, on ? 0.5 : 0, 0.1);
        if(!on) return;
        const t = this.ctx.currentTime;
        const speed = speed01 * 60;
        const throttle = rpm01;
        const rpm = 55 + speed * 4 + throttle * 70;
        this.osc.frequency.setTargetAtTime(rpm, t, 0.1);
        this.sub.frequency.setTargetAtTime(rpm * 0.5, t, 0.1);
        const vol = 0.01 + throttle * 0.06;
        this.gain.gain.setTargetAtTime(vol, t, 0.1);
        const filterFreq = 80 + rpm * 0.6 + throttle * 300;
        this.noiseFilter.frequency.setTargetAtTime(filterFreq, t, 0.1);
    }
    dispose(){
        if(this.ctx && this.ctx.state !== 'closed'){ try{ this.ctx.close(); } catch(e){} }
        if(this._visHandler){ document.removeEventListener('visibilitychange', this._visHandler); this._visHandler = null; }
        for(const n of this._nodes){ try{ n.disconnect && n.disconnect(); } catch(e){} }
        this._nodes = []; this.ok = false; this.ctx = null;
    }
}
const engineAudio = new EngineAudio();

    if(!engineAudio.ok){ engineAudio.init(); if(engineAudio.ctx && engineAudio.ctx.state === 'suspended') engineAudio._safeResume(); }

// ========== TrafficLightSystem ==========
class TrafficLightSystem {
    constructor() {
        this.lights = new Map();
        this.cycleDuration = 10;
        this.timer = 0;
        CITY.roadNodes.forEach(node => {
            if (node.junction) {
                this.lights.set(node.x + '_' + node.z, { state: 'green', timer: 0 });
            }
        });
    }
    update(dt) {
        this.timer += dt;
        this.lights.forEach((light) => {
            light.timer += dt;
            if (light.timer > this.cycleDuration) {
                light.state = light.state === 'green' ? 'red' : 'green';
                light.timer = 0;
            }
        });
    }
    getStatus(node) {
        if (!node || !node.junction) return 'green';
        const key = node.x + '_' + node.z;
        const light = this.lights.get(key);
        return light ? light.state : 'green';
    }
}
const trafficLightSystem = new TrafficLightSystem();

// ========== TrafficCar（纯视觉版，无物理） ==========
class TrafficCar {
    constructor(x, z, color, variant = 'car') {
        const m = makeCarMesh(color, variant);
        this.mesh = m.group;
        this.headMat = m.headMat;
        this.tailMat = m.tailMat;
        scene.add(this.mesh);
        // 不使用物理，仅视觉移动
        this.pos = new THREE.Vector3(x, 0, z);
        this.speed = rand(3, 8);
        this.targetNode = null;
        this.currentNodeIdx = 0;
        this.stopped = false;
        this.stopTimer = 0;
        this.forward = new THREE.Vector3(0, 0, 1);
        this.laneOffset = rand(-1.5, 1.5);
        this.assignPath();
        // 同步 mesh 位置
        this.mesh.position.copy(this.pos);
    }
    assignPath() {
        if (CITY.roadNodes.length < 2) return;
        const start = randi(0, CITY.roadNodes.length - 1);
        this.currentNodeIdx = start;
        this.targetNode = CITY.roadNodes[start];
    }
    update(dt, playerPos) {
        if (!this.targetNode) return;
        if (playerPos) {
            const dist = this.pos.distanceTo(playerPos);
            if (dist > 200) {
                this.mesh.position.copy(this.pos);
                return;
            }
        }
        const lightStatus = trafficLightSystem.getStatus(this.targetNode);
        const distToNode = this.pos.distanceTo(new THREE.Vector3(this.targetNode.x, 0, this.targetNode.z));
        if (lightStatus === 'red' && distToNode < 10) {
            this.stopped = true;
            this.stopTimer = 0.5;
        } else if (this.stopped) {
            this.stopTimer -= dt;
            if (this.stopTimer <= 0) this.stopped = false;
        }
        let shouldStop = this.stopped;
        // 简单的避让（只检测前车）
        for (const other of traffic) {
            if (other === this) continue;
            const dx = other.pos.x - this.pos.x;
            const dz = other.pos.z - this.pos.z;
            const dist = Math.hypot(dx, dz);
            if (dist < 8 && dist > 0.1) {
                const dot = dx * this.forward.x + dz * this.forward.z;
                if (dot > 0 && dot < 12) {
                    shouldStop = true;
                    break;
                }
            }
        }
        if (shouldStop) {
            // 原地不动
        } else {
            const tx = this.targetNode.x + this.laneOffset;
            const tz = this.targetNode.z + this.laneOffset;
            const dir = new THREE.Vector3(tx - this.pos.x, 0, tz - this.pos.z);
            const dist = dir.length();
            dir.normalize();
            const targetRot = Math.atan2(dir.x, dir.z);
            this.forward.set(Math.sin(targetRot), 0, Math.cos(targetRot));
            const targetSpeed = this.stopped ? 0 : this.speed;
            this.pos.addScaledVector(dir, targetSpeed * dt);
            this.mesh.position.copy(this.pos);
            this.mesh.rotation.y = targetRot;
            if (dist < 4) {
                const links = this.targetNode.links;
                if (links && links.length > 0) {
                    let nextIdx;
                    if (links.length === 1) {
                        nextIdx = links[0];
                    } else {
                        const candidates = links.filter(idx => {
                            const node = CITY.roadNodes[idx];
                            if (!node) return false;
                            const nd = new THREE.Vector3(node.x - this.pos.x, 0, node.z - this.pos.z);
                            return nd.dot(this.forward) > -0.3;
                        });
                        nextIdx = candidates.length > 0 ? pick(candidates) : pick(links);
                    }
                    this.currentNodeIdx = nextIdx;
                    this.targetNode = CITY.roadNodes[nextIdx];
                }
            }
        }
        // 车轮旋转（视觉）
        const wheelRot = this.speed * dt * 2;
        // 这里不实际旋转车轮，因为我们是简化版
        // 但可以保留动画效果（若有 wheelGroups）
        if (this.mesh.children) {
            // 如果有车轮 group，旋转它们
            for (const child of this.mesh.children) {
                if (child.type === 'Group' && child.children.length > 0) {
                    child.rotation.x += wheelRot;
                }
            }
        }
    }
    destroy() {
        scene.remove(this.mesh);
        this.mesh.traverse(o => {
            if (o.geometry) o.geometry.dispose();
            if (o.material) {
                if (Array.isArray(o.material)) o.material.forEach(m => m.dispose());
                else o.material.dispose();
            }
        });
    }
}

class Ped {
    constructor(x, z) {
        const h = makeHumanoid({
            shirt: pick([0x3a6ea5, 0xcf5b3a, 0x2d5a3d, 0x8b4513, 0x6b4a7a]),
            pants: pick([0x25314a, 0x3d2d25, 0x2f4f4f, 0x4a3728]),
            skin: rand(0xc8a080, 0xe8c4a0),
            hair: pick([0x2a2118, 0x4a3728, 0x1a1a1a, 0x8b7355])
        });
        this.mesh = h.group;
        this.body3d = h;
        this.mesh.position.set(x, 0, z);
        const s = rand(0.9, 1.1);
        this.mesh.scale.set(s, rand(0.95, 1.05), s);
        scene.add(this.mesh);
        this.walkSpeed = rand(0.8, 1.8);
        this.target = new THREE.Vector3(x + rand(-20, 20), 0, z + rand(-20, 20));
        this.state = 'walk';
        this.walkPhase = rand(0, Math.PI * 2);
        this.waitTimer = 0;
        this.animOffset = rand(0, 10);
    }
    update(dt, playerCar) {
        if (playerCar) {
            const dist = this.mesh.position.distanceTo(playerCar.pos);
            if (dist > 150) return;
        }
        if (this.state === 'wait') {
            this.waitTimer -= dt;
            if (this.waitTimer <= 0) {
                this.state = 'walk';
                const angle = rand(0, Math.PI * 2);
                const dist = rand(10, 40);
                this.target.set(
                    this.mesh.position.x + Math.cos(angle) * dist,
                    0,
                    this.mesh.position.z + Math.sin(angle) * dist
                );
                this.target.x = clamp(this.target.x, -190, 190);
                this.target.z = clamp(this.target.z, -190, 190);
            }
            const breath = Math.sin(performance.now() * 0.003 + this.animOffset) * 0.02;
            this.body3d.torso.scale.y = 1 + breath;
            this.body3d.armL.rotation.x = 0;
            this.body3d.armR.rotation.x = 0;
            this.body3d.legL.rotation.x = 0;
            this.body3d.legR.rotation.x = 0;
            return;
        }
        const dir = new THREE.Vector3().subVectors(this.target, this.mesh.position);
        dir.y = 0;
        const dist = dir.length();
        if (dist < 0.5) {
            this.state = 'wait';
            this.waitTimer = rand(1, 4);
            return;
        }
        dir.normalize();
        if (playerCar) {
            const toCar = new THREE.Vector3().subVectors(playerCar.pos, this.mesh.position);
            toCar.y = 0;
            const carDist = toCar.length();
            if (carDist < 5 && carDist > 0.1) {
                toCar.normalize();
                const perp = new THREE.Vector3(-toCar.z, 0, toCar.x);
                dir.addScaledVector(perp, 2 / carDist);
                dir.normalize();
            }
        }
        this.mesh.position.addScaledVector(dir, this.walkSpeed * dt);
        this.mesh.lookAt(this.target.x, this.mesh.position.y, this.target.z);
        this.walkPhase += dt * 3 * this.walkSpeed;
        const amp = 0.4;
        this.body3d.legL.rotation.x = Math.sin(this.walkPhase) * amp;
        this.body3d.legR.rotation.x = Math.sin(this.walkPhase + Math.PI) * amp;
        this.body3d.armL.rotation.x = Math.sin(this.walkPhase + Math.PI) * amp * 0.6;
        this.body3d.armR.rotation.x = Math.sin(this.walkPhase) * amp * 0.6;
        this.body3d.torso.scale.y = 1;
    }
    destroy() {
        scene.remove(this.mesh);
        this.mesh.traverse(o => {
            if (o.geometry) o.geometry.dispose();
            if (o.material) {
                if (Array.isArray(o.material)) o.material.forEach(m => m.dispose());
                else o.material.dispose();
            }
        });
    }
}

// ========== TireMarks（修复索引 bug） ==========
const TireMarks = (function() {
    const MAX_MARKS = 2000;
    let mesh, positions, indices, indexOffset = 0;
    let lastLeft = null, lastRight = null;
    function init(scene) {
        const geo = new THREE.BufferGeometry();
        positions = new Float32Array(MAX_MARKS * 6 * 3);
        indices = new Uint32Array(MAX_MARKS * 6);
        geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geo.setIndex(new THREE.BufferAttribute(indices, 1));
        geo.setDrawRange(0, 0);
        const mat = new THREE.MeshBasicMaterial({ color:0x111111, transparent:true, opacity:0.6, depthWrite:false, polygonOffset:true, polygonOffsetFactor:-1 });
        mesh = new THREE.Mesh(geo, mat);
        mesh.frustumCulled = false;
        scene.add(mesh);
    }
    function addMark(leftPos, rightPos) {
        if (indexOffset >= MAX_MARKS) {
            indexOffset = 0;
            positions.fill(0);
            mesh.geometry.setDrawRange(0, 0);
            lastLeft = null; lastRight = null;
            return;
        }
        if (!lastLeft || !lastRight) { lastLeft = leftPos.clone(); lastRight = rightPos.clone(); return; }
        const i = indexOffset * 6;
        const v = indexOffset * 6;  // 修复：v = indexOffset * 6（之前是 *4，导致索引错位）
        positions[i*3+0]=lastLeft.x; positions[i*3+1]=0.02; positions[i*3+2]=lastLeft.z;
        positions[i*3+3]=lastRight.x; positions[i*3+4]=0.02; positions[i*3+5]=lastRight.z;
        positions[i*3+6]=rightPos.x; positions[i*3+7]=0.02; positions[i*3+8]=rightPos.z;
        positions[i*3+9]=leftPos.x; positions[i*3+10]=0.02; positions[i*3+11]=leftPos.z;
        positions[i*3+12]=rightPos.x; positions[i*3+13]=0.02; positions[i*3+14]=rightPos.z;
        positions[i*3+15]=leftPos.x; positions[i*3+16]=0.02; positions[i*3+17]=leftPos.z;
        indices[i]=v; indices[i+1]=v+1; indices[i+2]=v+2;
        indices[i+3]=v; indices[i+4]=v+2; indices[i+5]=v+3;
        indexOffset++;
        mesh.geometry.attributes.position.needsUpdate = true;
        mesh.geometry.index.needsUpdate = true;
        mesh.geometry.setDrawRange(0, indexOffset * 6);
        lastLeft = leftPos.clone(); lastRight = rightPos.clone();
    }
    function reset() { lastLeft = null; lastRight = null; }
    return { init, addMark, reset };
})();

// ========== DriftSmoke ==========
const DriftSmoke = (function() {
    const COUNT = 200;
    let points, geo, velocities, lifetimes;
    function init(scene) {
        geo = new THREE.BufferGeometry();
        const pos = new Float32Array(COUNT * 3);
        velocities = []; lifetimes = new Float32Array(COUNT);
        for (let i = 0; i < COUNT; i++) { pos[i*3+1] = -100; velocities.push(new THREE.Vector3()); lifetimes[i] = 0; }
        geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
        const mat = new THREE.PointsMaterial({ color:0xcccccc, size:0.4, transparent:true, opacity:0.3, depthWrite:false });
        points = new THREE.Points(geo, mat);
        points.frustumCulled = false;
        scene.add(points);
    }
    let nextIdx = 0;
    function emit(position, direction) {
        const i = nextIdx; nextIdx = (nextIdx + 1) % COUNT;
        const pos = geo.attributes.position.array;
        pos[i*3] = position.x; pos[i*3+1] = position.y + 0.15; pos[i*3+2] = position.z;
        velocities[i].set(direction.x*0.3+(Math.random()-0.5)*0.5, 0.8+Math.random()*0.5, direction.z*0.3+(Math.random()-0.5)*0.5);
        lifetimes[i] = 1.0;
    }
    function update(dt) {
        const pos = geo.attributes.position.array;
        for (let i = 0; i < COUNT; i++) {
            if (lifetimes[i] > 0) {
                lifetimes[i] -= dt * 1.5;
                pos[i*3] += velocities[i].x * dt;
                pos[i*3+1] += velocities[i].y * dt;
                pos[i*3+2] += velocities[i].z * dt;
                velocities[i].multiplyScalar(0.98);
            } else { pos[i*3+1] = -100; }
        }
        geo.attributes.position.needsUpdate = true;
    }
    return { init, emit, update };
})();

// ========== CarDamage ==========
const CarDamage = (function() {
    function deformMesh(mesh, impactPoint, force) {
        if (!mesh || !mesh.geometry) return;
        const posAttr = mesh.geometry.attributes.position;
        const localPoint = mesh.worldToLocal(impactPoint.clone());
        const radius = 0.8;
        for (let i = 0; i < posAttr.count; i++) {
            const vx = posAttr.getX(i), vy = posAttr.getY(i), vz = posAttr.getZ(i);
            const dx = vx - localPoint.x, dy = vy - localPoint.y, dz = vz - localPoint.z;
            const dist = Math.sqrt(dx*dx + dy*dy + dz*dz);
            if (dist < radius) {
                const influence = (1 - dist / radius) * force;
                posAttr.setX(i, vx + dx * influence * 0.3);
                posAttr.setY(i, vy + dy * influence * 0.1);
                posAttr.setZ(i, vz + dz * influence * 0.3);
            }
        }
        posAttr.needsUpdate = true;
        mesh.geometry.computeVertexNormals();
    }
    function onCollision(car, contactPoint, impactForce) {
        if (impactForce < 5) return;
        const force = Math.min(impactForce / 30, 1.0);
        car.mesh.traverse(child => {
            if (child.isMesh && child.name !== 'Wheel') {
                deformMesh(child, contactPoint, force);
            }
        });
        if (window.VisualFX && VisualFX.triggerShake) VisualFX.triggerShake(force);
    }
    return { onCollision };
})();

        const speed = playerCar.speed || 0;

            camera.position.x += (Math.random() - 0.5) * state.cameraShake * 0.1;

    }
    function triggerShake(intensity) { state.cameraShake = Math.min(intensity || 0.5, 1.5); }
    const carColors = [0xcc0000,0x0044cc,0x228B22,0xFFD700,0x333333,0xffffff,0x8B4513,0x4B0082,0xFF6347,0x2F4F4F];
    function getRandomCarColor() { return carColors[Math.floor(Math.random() * carColors.length)]; }
    function update(dt, context) {
        state.frameCount++;
        const speed = context.speed || 0;
        const gear = context.gear || 1;
        safe(() => updateSpeedCamera(dt), 'SpeedCamera');
        safe(() => updateCameraShake(dt), 'CameraShake');
        safe(() => updateSpeedometer(speed, gear), 'Speedometer');
    }
    function init() {
        safe(initSpeedometer, 'Speedometer');
        safe(initPhotoMode, 'PhotoMode');
        console.log('[VisualFX] 已加载');
    }
    return { init, update, triggerShake, getRandomCarColor, getTimeScale: () => state.timeScale };
})();

// ========== 交通/行人生成 ==========
function spawnTraffic(n) {
    const colors = [0x8a939e, 0x3f5a78, 0x777d52, 0x5a3f4a, 0x2f3136, 0x9e8638, 0x6b4a2f, 0x4a6741];
    for (let i = 0; i < n; i++) {
        if (CITY.roadNodes.length === 0) break;
        const startNode = CITY.roadNodes[randi(0, CITY.roadNodes.length - 1)];
        if (!startNode) continue;
        const c = new TrafficCar(startNode.x, startNode.z, pick(colors), Math.random() < 0.15 ? 'van' : 'car');
        traffic.push(c);
    }
}
function spawnPeds(n) {
    for (let i = 0; i < n; i++) {
        const x = rand(-180, 180);
        const z = rand(-180, 180);
        let safe = true;
        for (const node of CITY.roadNodes) {
            if (Math.hypot(node.x - x, node.z - z) < 6) { safe = false; break; }
        }
        if (safe) peds.push(new Ped(x, z));
    }
}
function updateTrafficCount(t) {
    if (traffic.length === t) return;
    if (traffic.length < t) { while (traffic.length < t) traffic.push(new TrafficCar(rand(-180,180), rand(-180,180), pick([0x8a939e,0x3f5a78,0x777d52,0x5a3f4a,0x2f3136,0x9e8638]))); }
    else { const toRemove = traffic.splice(t); for (const c of toRemove) if (c.destroy) c.destroy(); }
}
function updatePedCount(t) {
    if (peds.length === t) return;
    if (peds.length < t) { while (peds.length < t) peds.push(new Ped(rand(-180,180), rand(-180,180))); }
    else { const toRemove = peds.splice(t); for (const p of toRemove) if (p.destroy) p.destroy(); }
}
